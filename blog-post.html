        <svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1A6BFF"/>
              <stop offset="100%" stop-color="#00C2A8"/>
            </linearGradient>
            <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1A6BFF"/>
              <stop offset="100%" stop-color="#00C2A8"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g filter="url(#glow)" opacity="0.7">
            <line x1="62" y1="80" x2="38" y2="56" stroke="url(#accentGrad)" stroke-width="1.5"/>
            <line x1="62" y1="80" x2="88" y2="56" stroke="url(#accentGrad)" stroke-width="1.5"/>
            <line x1="62" y1="80" x2="62" y2="108" stroke="url(#accentGrad)" stroke-width="1.5"/>
          </g>
          <circle cx="62" cy="80" r="10" fill="url(#nodeGrad)" filter="url(#glow)"/>

            <line x1="12" y1="1" x2="12" y2="3"></line>

        <button class="nav-mobile-toggle" aria-label="Відкрити меню">

  <main class="container-narrow">
    <article class="article-header">
      <div style="margin-bottom: 2rem;">
        <a href="blog.html" style="color: var(--text-muted); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.5rem;">

      </div>

      <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem;">

        <div id="article-meta" style="color: var(--text-muted); font-size: 0.85rem;"></div>
      </div>

      <h1 id="article-title" style="font-size: clamp(2rem, 4vw, 3rem); line-height: 1.2; margin-bottom: 2rem;">

      </h1>

      <div style="border-radius: 1.5rem; overflow: hidden; max-height: 420px; background-color: var(--bg-surface); border: 1px solid var(--border-color); margin-bottom: 2rem;">
