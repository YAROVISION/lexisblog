<head>

  <style>
    /* === COSMIC SPACE BACKGROUND === */
    body {
      margin: 0;
      overflow: hidden;
      background: #00000a;
      background-image:
        /* Nebula glow — deep violet */
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(60, 0, 120, 0.45) 0%, transparent 65%),
        /* Nebula glow — cold indigo */
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(15, 10, 80, 0.5) 0%, transparent 60%),
        /* Distant star cluster — faint blue */
        radial-gradient(ellipse 40% 35% at 60% 20%, rgba(10, 30, 90, 0.35) 0%, transparent 55%),
        /* Deep space base */
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%);
      animation: cosmicShift 30s ease-in-out infinite alternate;
    }

    @keyframes cosmicShift {
      0%   { background-image:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(60, 0, 120, 0.45) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(15, 10, 80, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 60% 20%, rgba(10, 30, 90, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%); }
      50%  { background-image:
        radial-gradient(ellipse 70% 70% at 70% 25%, rgba(40, 0, 100, 0.4) 0%, transparent 65%),
        radial-gradient(ellipse 65% 55% at 25% 75%, rgba(20, 5, 90, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 60%, rgba(5, 15, 70, 0.3) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%); }
      100% { background-image:
        radial-gradient(ellipse 80% 60% at 30% 60%, rgba(50, 0, 110, 0.42) 0%, transparent 65%),
        radial-gradient(ellipse 55% 50% at 75% 30%, rgba(10, 8, 75, 0.48) 0%, transparent 60%),
        radial-gradient(ellipse 45% 38% at 40% 80%, rgba(8, 20, 85, 0.32) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%); }
    }

    /* Starfield layer */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1px 1px at 15% 22%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 8%,  rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 52% 41%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 75%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 90%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 70%, rgba(200,220,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  45%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 40% 30%, rgba(180,200,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 68% 50%, rgba(255,255,255,0.6) 0%, transparent 100%);
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0%   { opacity: 0.6; }
      50%  { opacity: 1.0; }
      100% { opacity: 0.7; }
    }

    /* Dark Overlay — subtle, just for depth contrast */
    .dark-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 50%, rgba(0,0,8,0.3) 0%, rgba(0,0,5,0.65) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Glassmorphism Search Bar */
    .search-wrapper {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 600px;
    }

    .glass-search {
      width: 100%;
      padding: 15px 56px 15px 25px;
      font-size: 1.1rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
      box-sizing: border-box;
    }

    .glass-search::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .glass-search:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 194, 168, 0.5);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 194, 168, 0.3);
    }

    /* View Toggle Button inside Search Bar */
    .view-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0;
      z-index: 2;
    }

    .view-toggle-btn:hover {
      background: rgba(0, 194, 168, 0.25);
      border-color: rgba(0, 194, 168, 0.7);
      color: #00e5ff;
      box-shadow: 0 0 18px rgba(0, 194, 168, 0.45);
      transform: translateY(-50%) scale(1.08);
    }

    .view-toggle-btn:active {
      transform: translateY(-50%) scale(0.94);
    }

    .view-toggle-btn svg {
      width: 20px;
      height: 20px;
      transition: transform 0.2s ease;
    }

    /* List View Container */
    .list-container {
      position: absolute;
      top: 175px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 760px;
      height: calc(100vh - 200px);
      overflow-y: auto;
      z-index: 10;
      display: none;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 50px;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 194, 168, 0.4) transparent;
    }

    .list-container::-webkit-scrollbar {
      width: 6px;
    }

    .list-container::-webkit-scrollbar-thumb {
      background: rgba(0, 194, 168, 0.35);
      border-radius: 3px;
    }

    .list-container.active {
      display: flex;
      animation: fadeInList 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes fadeInList {
      from {
        opacity: 0;
        transform: translate(-50%, 15px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    /* Node List Item (Horizontal active link in a column) */
    .node-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(18, 22, 36, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-decoration: none;
      color: #fff;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .node-list-item::before {

      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--node-accent, #60a5fa);

      transition: width 0.2s, opacity 0.2s;

    .node-list-item:hover {
      background: rgba(28, 35, 60, 0.9);
      border-color: rgba(0, 194, 168, 0.45);
      transform: translateX(6px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 16px rgba(0, 194, 168, 0.22);
    }

    .node-list-item:hover::before {
      width: 6px;
      opacity: 1;
    }

    .node-list-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .node-list-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .node-list-title {
      font-size: 1.02rem;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-list-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .node-list-tag {
      font-size: 0.72rem;
      padding: 3px 9px;

      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .node-list-arrow {
      color: rgba(255, 255, 255, 0.35);
      transition: transform 0.2s, color 0.2s;
      display: flex;
      align-items: center;
    }

    .node-list-item:hover .node-list-arrow {
      color: #00e5ff;
      transform: translateX(3px);
    }

    .node-list-empty {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 1.05rem;
      background: rgba(18, 22, 36, 0.6);
      border-radius: 12px;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Graph Container */
    #graph-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2; /* Below UI, above overlay */
    }

    /* Modal / Window for Node Content */
    .node-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .node-modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .node-modal-content {
      background: rgba(20, 24, 33, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      color: #fff;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .node-modal-overlay.active .node-modal-content {
      transform: translateY(0);
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-modal:hover {
      color: #fff;
    }

    .node-modal-body {
      line-height: 1.6;
    }
    
    .node-modal-body h1, .node-modal-body h2, .node-modal-body h3 {
      color: #00C2A8;
      margin-top: 0;
    }

    /* Ensure navbar is on top */
    .navbar-wrapper {
      position: relative;
      z-index: 100;
    }
  </style>

  <!-- Graph Initialization Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let graphData = GRAPH_DATA;
      let highlightNodes = new Set();
      let highlightLinks = new Set();
      let hoverNode = null;
      
      const searchInput = document.getElementById('search-input');
      
      // Initialize ForceGraph
      const Graph = ForceGraph()
        (document.getElementById('graph-container'))
        .backgroundColor('rgba(0,0,0,0)') // Transparent to show gradient bg
        .nodeId('id')
        .nodeLabel('name')
        .nodeCanvasObject((node, ctx, globalScale) => {
          if (!node || !isFinite(node.x) || !isFinite(node.y)) return;

          // Cosmic color palette by group
          if (!node.cosmicColor) {
            const groupColors = {
              'concepts':  ['#c084fc', '#a78bfa', '#818cf8', '#60a5fa', '#38bdf8'], // фіолетово-синій спектр
              'entities':  ['#f0abfc', '#e879f9', '#d946ef', '#c026d3'],            // яскраво-пурпурний
              'fallacies': ['#fb923c', '#f97316', '#ea580c'],                       // помаранчево-вогняний
              'sources':   ['#34d399', '#10b981', '#059669'],                       // смарагдово-зелений
            };
            const palette = groupColors[node.group] || ['#7dd3fc', '#93c5fd', '#a5b4fc'];
            node.cosmicColor = palette[Math.floor(Math.random() * palette.length)];
          }

          const isActive = highlightNodes.size === 0 || highlightNodes.has(node);
          const isHighlighted = highlightNodes.has(node);
          const color = isActive ? node.cosmicColor : 'rgba(255,255,255,0.08)';

          const radius = isHighlighted ? 4 : 3; // Менші вузли: 3px базово, 4px при виділенні

          // Outer glow
          if (isActive) {
            const glowRadius = radius * 3.5;
            const grd = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, glowRadius);
            grd.addColorStop(0, color + 'cc');
            grd.addColorStop(1, color + '00');
            ctx.beginPath();
            ctx.arc(node.x, node.y, glowRadius, 0, 2 * Math.PI, false);
            ctx.fillStyle = grd;
            ctx.fill();
          }

          // Core dot
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
          if (isActive) {
            ctx.shadowBlur = 12;
            ctx.shadowColor = color;
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.fillStyle = isActive ? '#ffffff' : 'rgba(255,255,255,0.06)';
          ctx.fill();
          ctx.shadowBlur = 0;

          // Colored ring around core
          if (isActive) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.stroke();
          }

          // Draw Text Label
          if (isActive) {
            const label = node.name;
            const fontSize = Math.max(10 / globalScale, 2);
            if (globalScale > 0.8 || highlightNodes.has(node)) {
              ctx.font = `${fontSize}px 'Inter', sans-serif`;
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
              ctx.fillText(label, node.x + radius + 3, node.y);
            }
          }
        })
        .nodeCanvasObjectMode(() => 'after')
        .linkColor(link => {
          if (highlightNodes.size === 0) return 'rgba(180, 200, 255, 0.75)';
          return highlightLinks.has(link) ? 'rgba(0, 229, 255, 1)' : 'rgba(255, 255, 255, 0.08)';
        })
        .linkWidth(link => {
          if (highlightNodes.size === 0) return 1.2;
          return highlightLinks.has(link) ? 3 : 0.5;
        })
        .linkDirectionalParticles(link => highlightNodes.size === 0 ? 1 : (highlightLinks.has(link) ? 5 : 0))
        .linkDirectionalParticleWidth(2)
        .linkDirectionalParticleSpeed(0.004)
        .onNodeHover(node => {
          // Optional: hover logic
          hoverNode = node;
        })
        .onNodeClick(node => {
          // Center on node when clicked
          Graph.centerAt(node.x, node.y, 1000);
          Graph.zoom(8, 2000);
          
          openNodeModal(node);
        });

      // Modal Display Helper
      function openNodeModal(node) {
        const modal = document.getElementById('node-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        
        modalTitle.textContent = node.name.replace(/_/g, ' ');
        modalBody.innerHTML = marked.parse(node.content || "*Немає вмісту*");
        modal.classList.add('active');
      }

      // Close modal logic
      document.getElementById('close-modal').addEventListener('click', () => {
        document.getElementById('node-modal').classList.remove('active');
      });
      document.getElementById('node-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('node-modal')) {
          document.getElementById('node-modal').classList.remove('active');
        }
      });

      // Load Data
      Graph.graphData(graphData);

      // === List View & View Toggle Logic ===
      const listContainer = document.getElementById('list-container');
      const viewToggleBtn = document.getElementById('view-toggle-btn');
      const iconWeb = viewToggleBtn.querySelector('.icon-web');
      const iconLines = viewToggleBtn.querySelector('.icon-lines');
      let currentView = 'graph'; // 'graph' (павутинка) or 'list' (горизонтальні рисочки)

      const groupMeta = {
        'concepts':  { label: 'Концепція', color: '#a78bfa' },
        'entities':  { label: 'Сутність',  color: '#f0abfc' },
        'fallacies': { label: 'Помилка',   color: '#fb923c' },
        'sources':   { label: 'Джерело',   color: '#34d399' },
        'root':      { label: 'Каталог',   color: '#38bdf8' }
      };

      function renderNodeList(nodesToRender) {
        listContainer.innerHTML = '';
        if (!nodesToRender || nodesToRender.length === 0) {
          listContainer.innerHTML = '<div class="node-list-empty">Нічого не знайдено за вашим запитом</div>';
          return;
        }

        const sortedNodes = nodesToRender.slice().sort((a, b) => a.name.localeCompare(b.name, 'uk'));

        sortedNodes.forEach(node => {
          const meta = groupMeta[node.group] || { label: 'Термін', color: '#38bdf8' };
          const link = document.createElement('a');
          link.href = '#';
          link.className = 'node-list-item';
          link.style.setProperty('--node-accent', meta.color);
          link.dataset.nodeId = node.id;
          
          const displayName = node.name.replace(/_/g, ' ');

          link.innerHTML = `
            <div class="node-list-left">
              <span class="node-list-dot" style="background:${meta.color}; box-shadow:0 0 10px ${meta.color};"></span>
              <span class="node-list-title" title="${displayName}">${displayName}</span>
            </div>
            <div class="node-list-right">
              <span class="node-list-tag" style="color:${meta.color}; border-color:${meta.color}40;">${meta.label}</span>
              <span class="node-list-arrow">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </span>
            </div>
          `;

          link.addEventListener('click', (e) => {
            e.preventDefault();
            openNodeModal(node);
          });

          listContainer.appendChild(link);
        });
      }

      function getFilteredNodes(query) {
        if (!query) return graphData.nodes;
        return graphData.nodes.filter(node => 
          node.name.toLowerCase().includes(query) || 
          (node.content && node.content.toLowerCase().includes(query))
        );
      }

      function updateListView() {
        const query = searchInput.value.toLowerCase().trim();
        const matchedNodes = getFilteredNodes(query);
        renderNodeList(matchedNodes);
      }

      // Toggle between Graph (павутинка) and List (горизонтальні рисочки)
      viewToggleBtn.addEventListener('click', () => {
        if (currentView === 'graph') {
          currentView = 'list';
          // Button transforms into horizontal lines
          iconWeb.style.display = 'none';
          iconLines.style.display = 'block';
          viewToggleBtn.setAttribute('title', 'Вигляд: Список (натисніть для перегляду павутинкою)');
          viewToggleBtn.setAttribute('aria-label', 'Перемкнути на вигляд павутинки');
          
          document.getElementById('graph-container').style.display = 'none';
          listContainer.classList.add('active');
          updateListView();
        } else {
          currentView = 'graph';
          // Button transforms back into spiderweb
          iconWeb.style.display = 'block';
          iconLines.style.display = 'none';
          viewToggleBtn.setAttribute('title', 'Вигляд: Павутинка (натисніть для перегляду списком)');
          viewToggleBtn.setAttribute('aria-label', 'Перемкнути на вигляд списком');
          
          listContainer.classList.remove('active');
          document.getElementById('graph-container').style.display = 'block';
          Graph.width(window.innerWidth).height(window.innerHeight);
        }
      });

      // Search Logic
      searchInput.addEventListener('input', e => {
        const query = e.target.value.toLowerCase().trim();
        
        // Synchronize List View
        updateListView();
        
        // Synchronize Graph View
        highlightNodes.clear();
        highlightLinks.clear();
        
        if (query) {
          const matchedNodes = getFilteredNodes(query);
          
          matchedNodes.forEach(node => {
            highlightNodes.add(node);
            
            // Highlight connections for matched nodes
            graphData.links.forEach(link => {
              if (link.source.id === node.id || link.source === node.id || 
                  link.target.id === node.id || link.target === node.id) {
                highlightLinks.add(link);
                // Highlight neighbor nodes
                const neighborId = link.source.id === node.id ? link.target.id || link.target : link.source.id || link.source;
                const neighbor = graphData.nodes.find(n => n.id === neighborId);
                if (neighbor) highlightNodes.add(neighbor);
              }
            });
          });
        }
        
        // Trigger graph redraw
        Graph.nodeColor(Graph.nodeColor())
             .linkColor(Graph.linkColor())
             .linkWidth(Graph.linkWidth());
      });
      
      // Handle window resize
      window.addEventListener('resize', () => {
        Graph.width(window.innerWidth).height(window.innerHeight);
      });
    });
  </script>
</body>
</html>
