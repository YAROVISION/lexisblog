<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wiki | Lexis — База Знань</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
  <!-- Force Graph Library -->
  <script src="https://unpkg.com/force-graph"></script>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    /* === COSMIC SPACE BACKGROUND === */
    body {
      margin: 0;
      overflow: hidden;
      background: #00000a;
      background-image:
        /* Nebula glow — deep violet */
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(60, 0, 120, 0.45) 0%, transparent 65%),
        /* Nebula glow — cold indigo */
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(15, 10, 80, 0.5) 0%, transparent 60%),
        /* Distant star cluster — faint blue */
        radial-gradient(ellipse 40% 35% at 60% 20%, rgba(10, 30, 90, 0.35) 0%, transparent 55%),
        /* Deep space base */
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%);
      animation: cosmicShift 30s ease-in-out infinite alternate;
    }

    @keyframes cosmicShift {
      0%   { background-image:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(60, 0, 120, 0.45) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(15, 10, 80, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 60% 20%, rgba(10, 30, 90, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%); }
      50%  { background-image:
        radial-gradient(ellipse 70% 70% at 70% 25%, rgba(40, 0, 100, 0.4) 0%, transparent 65%),
        radial-gradient(ellipse 65% 55% at 25% 75%, rgba(20, 5, 90, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 60%, rgba(5, 15, 70, 0.3) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%); }
      100% { background-image:
        radial-gradient(ellipse 80% 60% at 30% 60%, rgba(50, 0, 110, 0.42) 0%, transparent 65%),
        radial-gradient(ellipse 55% 50% at 75% 30%, rgba(10, 8, 75, 0.48) 0%, transparent 60%),
        radial-gradient(ellipse 45% 38% at 40% 80%, rgba(8, 20, 85, 0.32) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%); }
    }

    /* Starfield layer */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1px 1px at 15% 22%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 8%,  rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 52% 41%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 75%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 90%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 70%, rgba(200,220,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  45%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 40% 30%, rgba(180,200,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 68% 50%, rgba(255,255,255,0.6) 0%, transparent 100%);
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0%   { opacity: 0.6; }
      50%  { opacity: 1.0; }
      100% { opacity: 0.7; }
    }

    /* Dark Overlay — subtle, just for depth contrast */
    .dark-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 50%, rgba(0,0,8,0.3) 0%, rgba(0,0,5,0.65) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Glassmorphism Search Bar */
    .search-wrapper {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 600px;
    }

    .glass-search {
      width: 100%;
      padding: 15px 25px;
      font-size: 1.1rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .glass-search::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .glass-search:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 194, 168, 0.5);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 194, 168, 0.3);
    }

    /* Graph Container */
    #graph-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2; /* Below UI, above overlay */
    }

    /* Modal / Window for Node Content */
    .node-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .node-modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .node-modal-content {
      background: rgba(20, 24, 33, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      color: #fff;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .node-modal-overlay.active .node-modal-content {
      transform: translateY(0);
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-modal:hover {
      color: #fff;
    }

    .node-modal-body {
      line-height: 1.6;
    }
    
    .node-modal-body h1, .node-modal-body h2, .node-modal-body h3 {
      color: #00C2A8;
      margin-top: 0;
    }

    /* Ensure navbar is on top */
    .navbar-wrapper {
      position: relative;
      z-index: 100;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar-wrapper">
    <nav class="navbar">
      <a href="index.html" class="nav-brand" aria-label="Lexis Головна">
        <svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1A6BFF"/>
              <stop offset="100%" stop-color="#00C2A8"/>
            </linearGradient>
            <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1A6BFF"/>
              <stop offset="100%" stop-color="#00C2A8"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g filter="url(#glow)" opacity="0.7">
            <line x1="62" y1="80" x2="38" y2="56" stroke="url(#accentGrad)" stroke-width="1.5"/>
            <line x1="62" y1="80" x2="88" y2="56" stroke="url(#accentGrad)" stroke-width="1.5"/>
            <line x1="62" y1="80" x2="62" y2="108" stroke="url(#accentGrad)" stroke-width="1.5"/>
          </g>
          <circle cx="62" cy="80" r="10" fill="url(#nodeGrad)" filter="url(#glow)"/>
          <text x="62" y="84.5" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="white">λ</text>
          <text x="138" y="100" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="58" font-weight="700" letter-spacing="-1" fill="currentColor">LEXIS</text>
          <rect x="138" y="108" width="260" height="2.5" rx="1.25" fill="url(#accentGrad)" opacity="0.9"/>
          <text x="138" y="130" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="3.5" fill="#4A90D9" opacity="0.8">LOGICAL TEXT ANALYSIS</text>
        </svg>
      </a>

      <ul class="nav-menu">
        <li><a href="features.html" class="nav-link active">wiki</a></li>
        <li><a href="logoskop.html" class="nav-link">Логоскоп</a></li>
        <li><a href="sources.html" class="nav-link">Джерела</a></li>
        <li><a href="blog.html" class="nav-link">Блог</a></li>
      </ul>
    </nav>
  </header>

  <div class="dark-overlay"></div>

  <!-- Search Bar -->
  <div class="search-wrapper">
    <input type="text" id="search-input" class="glass-search" placeholder="Пошук у базі знань..." autocomplete="off">
  </div>

  <!-- Graph -->
  <div id="graph-container"></div>
  
  <!-- Node Content Modal -->
  <div class="node-modal-overlay" id="node-modal">
    <div class="node-modal-content">
      <span class="close-modal" id="close-modal">&times;</span>
      <h2 id="modal-title"></h2>
      <div class="node-modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/graph_data.js"></script>
  
  <!-- Graph Initialization Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let graphData = GRAPH_DATA;
      let highlightNodes = new Set();
      let highlightLinks = new Set();
      let hoverNode = null;
      
      const searchInput = document.getElementById('search-input');
      
      // Initialize ForceGraph
      const Graph = ForceGraph()
        (document.getElementById('graph-container'))
        .backgroundColor('rgba(0,0,0,0)') // Transparent to show gradient bg
        .nodeId('id')
        .nodeLabel('name')
        .nodeCanvasObject((node, ctx, globalScale) => {
          // Cosmic color palette by group
          if (!node.cosmicColor) {
            const groupColors = {
              'concepts':  ['#c084fc', '#a78bfa', '#818cf8', '#60a5fa', '#38bdf8'], // фіолетово-синій спектр
              'entities':  ['#f0abfc', '#e879f9', '#d946ef', '#c026d3'],            // яскраво-пурпурний
              'fallacies': ['#fb923c', '#f97316', '#ea580c'],                       // помаранчево-вогняний
              'sources':   ['#34d399', '#10b981', '#059669'],                       // смарагдово-зелений
            };
            const palette = groupColors[node.group] || ['#7dd3fc', '#93c5fd', '#a5b4fc'];
            node.cosmicColor = palette[Math.floor(Math.random() * palette.length)];
          }

          const isActive = highlightNodes.size === 0 || highlightNodes.has(node);
          const isHighlighted = highlightNodes.has(node);
          const color = isActive ? node.cosmicColor : 'rgba(255,255,255,0.08)';

          const radius = isHighlighted ? 4 : 3; // Менші вузли: 3px базово, 4px при виділенні

          // Outer glow
          if (isActive) {
            const glowRadius = radius * 3.5;
            const grd = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, glowRadius);
            grd.addColorStop(0, color + 'cc');
            grd.addColorStop(1, color + '00');
            ctx.beginPath();
            ctx.arc(node.x, node.y, glowRadius, 0, 2 * Math.PI, false);
            ctx.fillStyle = grd;
            ctx.fill();
          }

          // Core dot
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
          if (isActive) {
            ctx.shadowBlur = 12;
            ctx.shadowColor = color;
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.fillStyle = isActive ? '#ffffff' : 'rgba(255,255,255,0.06)';
          ctx.fill();
          ctx.shadowBlur = 0;

          // Colored ring around core
          if (isActive) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.stroke();
          }

          // Draw Text Label
          if (isActive) {
            const label = node.name;
            const fontSize = Math.max(10 / globalScale, 2);
            if (globalScale > 0.8 || highlightNodes.has(node)) {
              ctx.font = `${fontSize}px 'Inter', sans-serif`;
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
              ctx.fillText(label, node.x + radius + 3, node.y);
            }
          }
        })
        .nodeCanvasObjectMode(() => 'after')
        .linkColor(link => {
          if (highlightNodes.size === 0) return 'rgba(180, 200, 255, 0.75)';
          return highlightLinks.has(link) ? 'rgba(0, 229, 255, 1)' : 'rgba(255, 255, 255, 0.08)';
        })
        .linkWidth(link => {
          if (highlightNodes.size === 0) return 1.2;
          return highlightLinks.has(link) ? 3 : 0.5;
        })
        .linkDirectionalParticles(link => highlightNodes.size === 0 ? 1 : (highlightLinks.has(link) ? 5 : 0))
        .linkDirectionalParticleWidth(2)
        .linkDirectionalParticleSpeed(0.004)
        .onNodeHover(node => {
          // Optional: hover logic
          hoverNode = node;
        })
        .onNodeClick(node => {
          // Center on node when clicked
          Graph.centerAt(node.x, node.y, 1000);
          Graph.zoom(8, 2000);
          
          // Show Modal
          const modal = document.getElementById('node-modal');
          const modalTitle = document.getElementById('modal-title');
          const modalBody = document.getElementById('modal-body');
          
          modalTitle.textContent = node.name;
          modalBody.innerHTML = marked.parse(node.content || "*Немає вмісту*");
          modal.classList.add('active');
        });

      // Close modal logic
      document.getElementById('close-modal').addEventListener('click', () => {
        document.getElementById('node-modal').classList.remove('active');
      });
      document.getElementById('node-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('node-modal')) {
          document.getElementById('node-modal').classList.remove('active');
        }
      });

      // Load Data
      Graph.graphData(graphData);

      // Search Logic
      searchInput.addEventListener('input', e => {
        const query = e.target.value.toLowerCase().trim();
        
        highlightNodes.clear();
        highlightLinks.clear();
        
        if (query) {
          // Find matching nodes
          const matchedNodes = graphData.nodes.filter(node => 
            node.name.toLowerCase().includes(query) || 
            (node.content && node.content.toLowerCase().includes(query))
          );
          
          matchedNodes.forEach(node => {
            highlightNodes.add(node);
            
            // Highlight connections for matched nodes
            graphData.links.forEach(link => {
              if (link.source.id === node.id || link.source === node.id || 
                  link.target.id === node.id || link.target === node.id) {
                highlightLinks.add(link);
                // Highlight neighbor nodes
                const neighborId = link.source.id === node.id ? link.target.id || link.target : link.source.id || link.source;
                const neighbor = graphData.nodes.find(n => n.id === neighborId);
                if (neighbor) highlightNodes.add(neighbor);
              }
            });
          });
        }
        
        // Trigger graph redraw
        Graph.nodeColor(Graph.nodeColor())
             .linkColor(Graph.linkColor())
             .linkWidth(Graph.linkWidth());
      });
      
      // Handle window resize
      window.addEventListener('resize', () => {
        Graph.width(window.innerWidth).height(window.innerHeight);
      });
    });
  </script>
</body>
</html>
