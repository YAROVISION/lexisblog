<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Право: Карта судових рішень | Lexis — AI-аналіз процесуальних документів</title>
  <meta name="description" content="Інтерактивний семантичний граф взаємозв'язків судових рішень, правових норм, справ та суддів Верховного Суду.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #090d16;
    }

    .navbar-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .pravo-main-container {
      position: fixed;
      top: 68px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: calc(100vh - 68px);
      height: calc(100dvh - 68px);
      background: #090d16;
      overflow: hidden;
    }

    .pravo-graph-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #090d16;
    }

    @media (max-width: 640px) {
      .pravo-main-container {
        top: 60px;
        height: calc(100vh - 60px);
        height: calc(100dvh - 60px);
      }
    }
  </style>
</head>
<body>
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Navbar -->
  <header class="navbar-wrapper">
    <nav class="navbar">
      <a href="index.html" class="nav-brand" aria-label="Lexis Головна">
        <svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1A6BFF"/>
              <stop offset="100%" stop-color="#00C2A8"/>
            </linearGradient>
            <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1A6BFF"/>
              <stop offset="100%" stop-color="#00C2A8"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g filter="url(#glow)" opacity="0.7">
            <line x1="62" y1="80" x2="38" y2="56" stroke="url(#accentGrad)" stroke-width="1.5"/>
            <line x1="62" y1="80" x2="88" y2="56" stroke="url(#accentGrad)" stroke-width="1.5"/>
            <line x1="62" y1="80" x2="62" y2="108" stroke="url(#accentGrad)" stroke-width="1.5"/>
          </g>
          <circle cx="62" cy="80" r="10" fill="url(#nodeGrad)" filter="url(#glow)"/>
          <text x="62" y="84.5" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="white">λ</text>
          <text x="138" y="100" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="58" font-weight="700" letter-spacing="-1" fill="currentColor">LEXIS</text>
          <rect x="138" y="108" width="260" height="2.5" rx="1.25" fill="url(#accentGrad)" opacity="0.9"/>
          <text x="138" y="130" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="3.5" fill="#4A90D9" opacity="0.8">LOGICAL TEXT ANALYSIS</text>
        </svg>
      </a>

      <ul class="nav-menu">
        <li><a href="features.html" class="nav-link">Вікі</a></li>
        <li><a href="sources.html" class="nav-link">Джерела</a></li>
        <li><a href="blog.html" class="nav-link">Блог</a></li>
        <li><a href="pravo.html" class="nav-link active">Право</a></li>
      </ul>

      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Перемикач теми">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
          </svg>
          <svg class="icon-moon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button class="nav-mobile-toggle" aria-label="Відкрити меню">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>

            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </nav>

    <div class="nav-mobile-menu">
      <a href="features.html" class="nav-link">Вікі</a>
      <a href="pravo.html" class="nav-link active">Право</a>
      <a href="sources.html" class="nav-link">Джерела</a>
      <a href="blog.html" class="nav-link">Блог</a>
