<head>

  <style>
    /* === COSMIC SPACE BACKGROUND === */
    body {
      margin: 0;
      overflow: hidden;
      background: #00000a;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(60, 0, 120, 0.45) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(15, 10, 80, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 60% 20%, rgba(10, 30, 90, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%);
      animation: cosmicShift 30s ease-in-out infinite alternate;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @keyframes cosmicShift {
      0% {
        background-image:
          radial-gradient(ellipse 80% 60% at 20% 30%, rgba(60, 0, 120, 0.45) 0%, transparent 65%),
          radial-gradient(ellipse 60% 50% at 80% 70%, rgba(15, 10, 80, 0.5) 0%, transparent 60%),
          radial-gradient(ellipse 40% 35% at 60% 20%, rgba(10, 30, 90, 0.35) 0%, transparent 55%),
          radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%);
      }
      50% {
        background-image:
          radial-gradient(ellipse 70% 70% at 70% 25%, rgba(40, 0, 100, 0.4) 0%, transparent 65%),
          radial-gradient(ellipse 65% 55% at 25% 75%, rgba(20, 5, 90, 0.45) 0%, transparent 60%),
          radial-gradient(ellipse 50% 40% at 50% 60%, rgba(5, 15, 70, 0.3) 0%, transparent 55%),
          radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%);
      }
      100% {
        background-image:
          radial-gradient(ellipse 80% 60% at 30% 60%, rgba(50, 0, 110, 0.42) 0%, transparent 65%),
          radial-gradient(ellipse 55% 50% at 75% 30%, rgba(10, 8, 75, 0.48) 0%, transparent 60%),
          radial-gradient(ellipse 45% 38% at 40% 80%, rgba(8, 20, 85, 0.32) 0%, transparent 55%),
          radial-gradient(ellipse 100% 100% at 50% 50%, #06050f 0%, #000008 100%);
      }
    }

    /* Starfield layer */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(1px 1px at 15% 22%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 8%,  rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 52% 41%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 75%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 90%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 60% 70%, rgba(200,220,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  45%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 40% 30%, rgba(180,200,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 68% 50%, rgba(255,255,255,0.6) 0%, transparent 100%);
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0%   { opacity: 0.6; }
      50%  { opacity: 1.0; }
      100% { opacity: 0.7; }
    }

    /* Dark Overlay */
    .dark-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 50%, rgba(0,0,8,0.3) 0%, rgba(0,0,5,0.65) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Top Control Bar (Search, Filters, Toggle) */
    .search-wrapper {
      position: absolute;
      top: 88px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: 92%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .search-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-input-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .glass-search {
      width: 100%;
      padding: 13px 52px 13px 24px;
      font-size: 1.02rem;
      color: #fff;
      background: rgba(20, 17, 24, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 30px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      outline: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      box-sizing: border-box;
    }

    .glass-search::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .glass-search:focus {
      background: rgba(26, 22, 34, 0.95);
      border-color: rgba(0, 194, 168, 0.6);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), 0 0 16px rgba(0, 194, 168, 0.35);
    }

    /* Filter Chips Bar */
    .filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      user-select: none;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .filter-chip.active {
      background: linear-gradient(135deg, rgba(26, 107, 255, 0.8), rgba(0, 194, 168, 0.8));
      color: #ffffff;
      border-color: rgba(0, 194, 168, 0.5);
      box-shadow: 0 2px 12px rgba(0, 194, 168, 0.3);
    }

    .filter-count {
      font-size: 0.72rem;
      opacity: 0.75;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* View Toggle Button inside Search Bar */
    .view-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0;
      z-index: 2;
    }

    .view-toggle-btn:hover {
      background: rgba(0, 194, 168, 0.25);
      border-color: rgba(0, 194, 168, 0.7);
      color: #00e5ff;
      box-shadow: 0 0 18px rgba(0, 194, 168, 0.45);
      transform: translateY(-50%) scale(1.08);
    }

    .view-toggle-btn:active {
      transform: translateY(-50%) scale(0.94);
    }

    .view-toggle-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Brain Stats Floating Badge */
    .brain-stats-badge {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 40;
      background: rgba(18, 22, 34, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .brain-stats-badge .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00C2A8;
      box-shadow: 0 0 8px #00C2A8;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #00e5ff; }
    }

    /* Graph Container */
    #graph-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }

    /* List View Container */
    .list-container {
      position: absolute;
      top: 215px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 820px;
      height: calc(100vh - 240px);
      overflow-y: auto;
      z-index: 10;
      display: none;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 60px;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 194, 168, 0.4) transparent;
    }

    .list-container::-webkit-scrollbar {
      width: 6px;
    }

    .list-container::-webkit-scrollbar-thumb {
      background: rgba(0, 194, 168, 0.35);
      border-radius: 3px;
    }

    .list-container.active {
      display: flex;
      animation: fadeInList 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes fadeInList {
      from {
        opacity: 0;
        transform: translate(-50%, 15px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    /* Node List Item */
    .node-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(18, 22, 36, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-decoration: none;
      color: #fff;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .node-list-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--node-accent, #60a5fa);
      opacity: 0.8;
      transition: width 0.2s, opacity 0.2s;
    }

    .node-list-item:hover {
      background: rgba(28, 35, 60, 0.9);
      border-color: rgba(0, 194, 168, 0.45);
      transform: translateX(6px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 16px rgba(0, 194, 168, 0.22);
    }

    .node-list-item:hover::before {
      width: 6px;
      opacity: 1;
    }

    .node-list-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .node-list-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .node-list-title {
      font-size: 1.02rem;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-list-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .node-list-tag {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .node-list-arrow {
      color: rgba(255, 255, 255, 0.35);
      transition: transform 0.2s, color 0.2s;
      display: flex;
      align-items: center;
    }

    .node-list-item:hover .node-list-arrow {
      color: #00e5ff;
      transform: translateX(3px);
    }

    .node-list-empty {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 1.05rem;
      background: rgba(18, 22, 36, 0.6);
      border-radius: 12px;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Modal / Window for Obsidian Node Content */
    .node-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .node-modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .node-modal-content {
      background: rgba(18, 20, 30, 0.95);
      border: 1px solid rgba(0, 194, 168, 0.3);
      border-radius: 18px;
      padding: 32px;
      width: 90%;
      max-width: 780px;
      max-height: 82vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 194, 168, 0.15);
      color: #e2e8f0;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 194, 168, 0.4) transparent;
    }

    .node-modal-content::-webkit-scrollbar {
      width: 6px;
    }

    .node-modal-content::-webkit-scrollbar-thumb {
      background: rgba(0, 194, 168, 0.4);
      border-radius: 3px;
    }

    .node-modal-overlay.active .node-modal-content {
      transform: translateY(0);
    }

    .close-modal {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 26px;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
      line-height: 1;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
    }

    .close-modal:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.1);
    }

    .modal-header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .modal-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    #modal-title {
      margin: 0 0 16px 0;
      font-size: 1.5rem;
      color: #ffffff;
      font-weight: 700;
      line-height: 1.3;
      padding-right: 36px;
    }

    .node-modal-body {
      line-height: 1.7;
      font-size: 0.98rem;
      color: #cbd5e1;
    }
    
    .node-modal-body h1, .node-modal-body h2, .node-modal-body h3, .node-modal-body h4 {
      color: #00C2A8;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }

    .node-modal-body h1 {
      font-size: 1.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .node-modal-body h2 {
      font-size: 1.2rem;
    }

    .node-modal-body hr {
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 20px 0;
    }

    .node-modal-body ul, .node-modal-body ol {
      padding-left: 22px;
      margin: 10px 0;
    }

    .node-modal-body li {
      margin-bottom: 6px;
    }

    .node-modal-body blockquote {
      border-left: 3px solid #1A6BFF;
      margin: 16px 0;
      padding: 10px 16px;
      background: rgba(26, 107, 255, 0.08);
      border-radius: 0 8px 8px 0;
    }

    /* Obsidian Wiki Links */
    .wiki-link {
      color: #38bdf8;
      text-decoration: none;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .wiki-link:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.6);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* Ensure navbar is on top */
    .navbar-wrapper {
      position: relative;
      z-index: 100;
    }

    @media (max-width: 640px) {
      .search-wrapper {
        top: 76px;
        width: 94%;
      }
      .list-container {
        top: 240px;
        height: calc(100vh - 260px);
      }
      .node-modal-content {
        padding: 20px;
        width: 95%;
      }
    }
  </style>
</head>

  <div class="node-modal-overlay" id="node-modal">

  <script src="assets/js/main.js"></script>
  <script src="assets/js/digest_graph_data.js"></script>
  
  <!-- Digest Graph Initialization Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let graphData = DIGEST_GRAPH_DATA;
      let highlightNodes = new Set();
      let highlightLinks = new Set();
      let currentCategory = 'all';
      let selectedNode = null;
      
      const searchInput = document.getElementById('search-input');
      const listContainer = document.getElementById('list-container');
      const viewToggleBtn = document.getElementById('view-toggle-btn');
      const iconWeb = viewToggleBtn.querySelector('.icon-web');
      const iconLines = viewToggleBtn.querySelector('.icon-lines');
      let currentView = 'graph';

      // Category metadata and colors
      const groupMeta = {
        'root':      { label: '🧠 Ядро Нейромозку',  color: '#38bdf8', palette: ['#38bdf8', '#60a5fa', '#3b82f6', '#0284c7'] },
        'entities':  { label: '🏛️ Суд / Інституція', color: '#f43f5e', palette: ['#f43f5e', '#fb7185', '#fda4af', '#e11d48'] },
        'concepts':  { label: '📚 Правова Концепція', color: '#a855f7', palette: ['#c084fc', '#a855f7', '#9333ea', '#7e22ce'] },
        'sources':   { label: '📂 Огляд / Дайджест',  color: '#06b6d4', palette: ['#22d3ee', '#06b6d4', '#0891b2', '#00C2A8'] },
        'segments':  { label: '📑 Правова Позиція',  color: '#10b981', palette: ['#34d399', '#10b981', '#059669', '#6ee7b7'] }
      };

      // Calculate counts for chips
      const counts = { all: graphData.nodes.length, root: 0, entities: 0, concepts: 0, sources: 0, segments: 0 };
      graphData.nodes.forEach(n => {
        if (counts[n.group] !== undefined) {
          counts[n.group]++;
        }
      });
      document.getElementById('count-all').textContent = counts.all.toLocaleString('uk-UA');
      if (document.getElementById('count-root')) document.getElementById('count-root').textContent = counts.root.toLocaleString('uk-UA');
      document.getElementById('count-entities').textContent = counts.entities.toLocaleString('uk-UA');
      document.getElementById('count-concepts').textContent = counts.concepts.toLocaleString('uk-UA');
      document.getElementById('count-sources').textContent = counts.sources.toLocaleString('uk-UA');
      if (document.getElementById('count-segments')) document.getElementById('count-segments').textContent = counts.segments.toLocaleString('uk-UA');

      document.getElementById('stats-text').textContent = 
        `Нейромозок: ${graphData.nodes.length.toLocaleString('uk-UA')} вузлів • ${graphData.links.length.toLocaleString('uk-UA')} нейро-зв'язків`;

      // Helper to find node by any string id/name/path
      function findNode(query) {
        if (!query) return null;
        const q = query.toLowerCase().trim();
        return graphData.nodes.find(n => 
          n.id.toLowerCase() === q || 
          n.name.toLowerCase() === q ||
          (n.rel_path && n.rel_path.toLowerCase().replace(/\.md$/, '') === q) ||
          (n.rel_path && n.rel_path.toLowerCase() === q)
        );
      }

      // Initialize ForceGraph
      const Graph = ForceGraph()
        (document.getElementById('graph-container'))
        .backgroundColor('rgba(0,0,0,0)')
        .nodeId('id')
        .nodeLabel('name')
        .d3VelocityDecay(0.35)
        .d3AlphaDecay(0.02)
        .warmupTicks(30)
        .cooldownTicks(80)
        .nodeCanvasObject((node, ctx, globalScale) => {
          if (!node || !isFinite(node.x) || !isFinite(node.y)) return;

          // Assign color palette by group
          if (!node.cosmicColor) {
            const meta = groupMeta[node.group] || groupMeta.segments;
            node.cosmicColor = meta.palette[Math.floor(Math.random() * meta.palette.length)];
          }

          // Category filter check
          const matchesCategory = currentCategory === 'all' || node.group === currentCategory;
          const isActive = matchesCategory && (highlightNodes.size === 0 || highlightNodes.has(node));
          const isHighlighted = highlightNodes.has(node);
          const isSelected = selectedNode === node;
          const color = isActive ? node.cosmicColor : 'rgba(255,255,255,0.03)';

          // Sizing hierarchy
          let baseRadius = 1.4;
          if (node.group === 'root') baseRadius = 7.0;
          else if (node.group === 'entities') baseRadius = 5.5;
          else if (node.group === 'concepts') baseRadius = 4.2;
          else if (node.group === 'sources') baseRadius = 2.8;

          const radius = (isHighlighted || isSelected) ? baseRadius * 1.6 : baseRadius;

          // Outer glowing aura for prominent nodes or active matches
          if (isActive && (node.group !== 'segments' || isHighlighted || isSelected)) {
            const glowMul = (node.group === 'root' || node.group === 'entities') ? 4.5 : (node.group === 'concepts' ? 3.5 : 2.5);
            const glowRadius = radius * glowMul;
            const grd = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, glowRadius);
            grd.addColorStop(0, color + 'aa');
            grd.addColorStop(1, color + '00');
            ctx.beginPath();
            ctx.arc(node.x, node.y, glowRadius, 0, 2 * Math.PI, false);
            ctx.fillStyle = grd;
            ctx.fill();
          }

          // Core dot
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
          if (isActive && (isHighlighted || isSelected || node.group !== 'segments')) {
            ctx.shadowBlur = (isHighlighted || isSelected) ? 16 : 8;
            ctx.shadowColor = color;
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.fillStyle = isActive ? (node.group === 'segments' ? color : '#ffffff') : 'rgba(255,255,255,0.04)';
          ctx.fill();
          ctx.shadowBlur = 0;

          // Colored ring around core for major nodes
          if (isActive && node.group !== 'segments') {
            ctx.beginPath();
            ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }

          // Text Label - hierarchy based on importance & zoom
          if (isActive) {
            let shouldShowLabel = isHighlighted || isSelected;
            if (!shouldShowLabel) {
              if (node.group === 'root' || node.group === 'entities') {
                shouldShowLabel = true;
              } else if (node.group === 'concepts') {
                shouldShowLabel = globalScale > 0.8;
              } else if (node.group === 'sources') {
                shouldShowLabel = globalScale > 2.0;
              } else if (node.group === 'segments') {
                shouldShowLabel = globalScale > 4.5;
              }
            }

            if (shouldShowLabel) {
              const label = node.name.length > 55 ? node.name.slice(0, 52) + '...' : node.name;
              const fontSize = Math.max(11 / globalScale, 2.2);
              ctx.font = `${fontSize}px 'Inter', sans-serif`;
              ctx.textAlign = 'left';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = (isHighlighted || isSelected) ? '#ffffff' : 'rgba(255, 255, 255, 0.88)';
              ctx.fillText(label, node.x + radius + 4, node.y);
            }
          }
        })
        .nodeCanvasObjectMode(() => 'after')
        .linkColor(link => {
          if (highlightNodes.size === 0) return 'rgba(160, 180, 240, 0.22)';
          return highlightLinks.has(link) ? 'rgba(0, 229, 255, 0.95)' : 'rgba(255, 255, 255, 0.02)';
        })
        .linkWidth(link => {
          if (highlightNodes.size === 0) return 0.5;
          return highlightLinks.has(link) ? 2.5 : 0.2;
        })
        .linkDirectionalParticles(link => highlightNodes.size === 0 ? 0 : (highlightLinks.has(link) ? 4 : 0))
        .linkDirectionalParticleWidth(1.8)
        .linkDirectionalParticleSpeed(0.004)
        .onNodeClick(node => {
          selectedNode = node;
          highlightConnected(node);
          Graph.centerAt(node.x, node.y, 800);
          Graph.zoom(6, 1200);
          openNodeModal(node);
        });

      function highlightConnected(node) {
        highlightNodes.clear();
        highlightLinks.clear();
        if (!node) return;

        highlightNodes.add(node);
        graphData.links.forEach(link => {
          const srcId = link.source.id || link.source;
          const tgtId = link.target.id || link.target;
          if (srcId === node.id || tgtId === node.id) {
            highlightLinks.add(link);
            const neighborId = srcId === node.id ? tgtId : srcId;
            const neighbor = graphData.nodes.find(n => n.id === neighborId);
            if (neighbor) highlightNodes.add(neighbor);
          }
        });
      }

      // Transform obsidian links in markdown
      function formatObsidianMarkdown(content) {
        if (!content) return "*Немає вмісту*";
        
        // Remove yaml frontmatter
        let clean = content.replace(/^---[\s\S]*?---\n/, '');
        
        // Convert [[target|alias]] and [[target]] to clickable links
        clean = clean.replace(/\[\[(.*?)(?:\|(.*?))?\]\]/g, (match, target, alias) => {
          const cleanTarget = target.split('#')[0].trim();
          const label = alias ? alias.trim() : cleanTarget.split('/').pop().replace(/_/g, ' ');
          return `<a href="#" class="wiki-link" data-node="${cleanTarget}">${label}</a>`;
        });

        return marked.parse(clean);
      }

      // Modal Display Helper
      function openNodeModal(node) {
        const modal = document.getElementById('node-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalCategory = document.getElementById('modal-category');
        
        const meta = groupMeta[node.group] || { label: 'Документ', color: '#00C2A8' };

        modalCategory.textContent = meta.label;
        modalCategory.style.backgroundColor = `${meta.color}25`;
        modalCategory.style.color = meta.color;
        modalCategory.style.border = `1px solid ${meta.color}50`;

        modalTitle.textContent = node.name;
        modalBody.innerHTML = formatObsidianMarkdown(node.content);
        modal.classList.add('active');

        // Attach click handlers to internal wiki links inside modal
        modalBody.querySelectorAll('.wiki-link').forEach(linkEl => {
          linkEl.addEventListener('click', (e) => {
            e.preventDefault();
            const targetQuery = linkEl.getAttribute('data-node');
            const targetNode = findNode(targetQuery);
            if (targetNode) {
              selectedNode = targetNode;
              highlightConnected(targetNode);
              Graph.centerAt(targetNode.x, targetNode.y, 800);
              Graph.zoom(6, 1200);
              openNodeModal(targetNode);
            }
          });
        });
      }

      // Close modal logic
      const closeModal = () => document.getElementById('node-modal').classList.remove('active');
      document.getElementById('close-modal').addEventListener('click', closeModal);
      document.getElementById('node-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('node-modal')) closeModal();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });

      // Load Data into Graph
      Graph.graphData(graphData);

      // Render List View with virtualized batching
      let renderedCount = 0;
      let currentFilteredNodes = [];
      const PAGE_SIZE = 80;

      function renderNodeList(nodesToRender) {
        listContainer.innerHTML = '';
        currentFilteredNodes = nodesToRender || [];
        renderedCount = 0;

        if (currentFilteredNodes.length === 0) {
          listContainer.innerHTML = '<div class="node-list-empty">Нічого не знайдено за вашим запитом</div>';
          return;
        }

        renderNextBatch();
      }

      function renderNextBatch() {
        const batch = currentFilteredNodes.slice(renderedCount, renderedCount + PAGE_SIZE);
        if (batch.length === 0) return;

        const fragment = document.createDocumentFragment();

        batch.forEach(node => {
          const meta = groupMeta[node.group] || { label: 'Документ', color: '#38bdf8' };
          const link = document.createElement('a');
          link.href = '#';
          link.className = 'node-list-item';
          link.style.setProperty('--node-accent', meta.color);
          link.dataset.nodeId = node.id;
          
          link.innerHTML = `
            <div class="node-list-left">
              <span class="node-list-dot" style="background:${meta.color}; box-shadow:0 0 10px ${meta.color};"></span>
              <span class="node-list-title" title="${node.name}">${node.name}</span>
            </div>
            <div class="node-list-right">
              <span class="node-list-tag" style="color:${meta.color}; border-color:${meta.color}40;">${meta.label}</span>
              <span class="node-list-arrow">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </span>
            </div>
          `;

          link.addEventListener('click', (e) => {
            e.preventDefault();
            selectedNode = node;
            highlightConnected(node);
            openNodeModal(node);
          });

          fragment.appendChild(link);
        });

        // Remove old load-more button if exists
        const oldBtn = listContainer.querySelector('.load-more-btn');
        if (oldBtn) oldBtn.remove();

        listContainer.appendChild(fragment);
        renderedCount += batch.length;

        if (renderedCount < currentFilteredNodes.length) {
          const loadMoreBtn = document.createElement('button');
          loadMoreBtn.className = 'load-more-btn';
          loadMoreBtn.style.cssText = `
            display: block; width: 100%; margin: 16px 0; padding: 12px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; color: #38bdf8; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; backdrop-filter: blur(8px);
          `;
          loadMoreBtn.textContent = `Показати ще (${currentFilteredNodes.length - renderedCount} залишилось)...`;
          loadMoreBtn.addEventListener('click', () => {
            renderNextBatch();
          });
          listContainer.appendChild(loadMoreBtn);
        }
      }

      function getFilteredNodes(query) {
        let list = graphData.nodes;
        if (currentCategory !== 'all') {
          list = list.filter(n => n.group === currentCategory);
        }
        if (!query) return list;
        return list.filter(node => 
          node.name.toLowerCase().includes(query) || 
          node.id.toLowerCase().includes(query) ||
          (node.digest && node.digest.toLowerCase().includes(query)) ||
          (node.content && node.content.toLowerCase().includes(query))
        );
      }

      function updateListView() {
        const query = searchInput.value.toLowerCase().trim();
        const matchedNodes = getFilteredNodes(query);
        renderNodeList(matchedNodes);
      }

      // Filter Chips Click
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-category');
          
          triggerFilterAndSearch();
        });
      });

      // Toggle between Graph and List
      viewToggleBtn.addEventListener('click', () => {
        if (currentView === 'graph') {
          currentView = 'list';
          iconWeb.style.display = 'none';
          iconLines.style.display = 'block';
          viewToggleBtn.setAttribute('title', 'Вигляд: Список (натисніть для перегляду графом)');
          
          document.getElementById('graph-container').style.display = 'none';
          listContainer.classList.add('active');
          updateListView();
        } else {
          currentView = 'graph';
          iconWeb.style.display = 'block';
          iconLines.style.display = 'none';
          viewToggleBtn.setAttribute('title', 'Вигляд: Граф (натисніть для перегляду списком)');
          
          listContainer.classList.remove('active');
          document.getElementById('graph-container').style.display = 'block';
          Graph.width(window.innerWidth).height(window.innerHeight);
        }
      });

      function triggerFilterAndSearch() {
        const query = searchInput.value.toLowerCase().trim();
        
        if (currentView === 'list') {
          updateListView();
          return;
        }

        highlightNodes.clear();
        highlightLinks.clear();
        
        const matchedNodes = getFilteredNodes(query);
        
        if (query || currentCategory !== 'all') {
          // If a large set of nodes matches category, highlight matched
          matchedNodes.forEach(node => {
            highlightNodes.add(node);
            
            // For search query, also highlight direct connections
            if (query && matchedNodes.length < 300) {
              graphData.links.forEach(link => {
                const srcId = link.source.id || link.source;
                const tgtId = link.target.id || link.target;
                if (srcId === node.id || tgtId === node.id) {
                  highlightLinks.add(link);
                  const neighborId = srcId === node.id ? tgtId : srcId;
                  const neighbor = graphData.nodes.find(n => n.id === neighborId);
                  if (neighbor && (currentCategory === 'all' || neighbor.group === currentCategory)) {
                    highlightNodes.add(neighbor);
                  }
                }
              });
            }
          });
        }
        
        // Trigger redraw
        Graph.nodeColor(Graph.nodeColor())
             .linkColor(Graph.linkColor())
             .linkWidth(Graph.linkWidth());
      }

      // Search Logic with debounce
      let searchTimeout = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(triggerFilterAndSearch, 150);
      });

      // Window resize handler
      window.addEventListener('resize', () => {
        if (currentView === 'graph') {
          Graph.width(window.innerWidth).height(window.innerHeight);
        }
      });
    });
  </script>
