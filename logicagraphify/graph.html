  <style>

      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    #canvas:active {
      cursor: grabbing;
    }

    @keyframes slideInPanel {
      from {
        opacity: 0;
        transform: translateY(-16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slideInLegend {
      from {
        opacity: 0;
        transform: translate(-50%, 16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    @keyframes slideInControls {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Top Left Control Panel */
    .panel {

      top: 16px;
      left: 16px;
      background: rgba(36, 33, 30, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 16px 18px;
      width: 320px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      z-index: 10;
      pointer-events: auto;
      animation: slideInPanel 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1A6BFF, #00C2A8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    .panel-badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      background: rgba(26,107,255,0.15);
      border: 1px solid rgba(26,107,255,0.35);
      border-radius: 4px;
      color: #4A90D9;
      font-weight: 600;
    }
    .panel-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .search-box {
      width: 100%;
      padding: 8px 12px;
      background: #14110f;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .search-box:focus {
      border-color: var(--accent);
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 12px;
    }
    .filter-btn {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--surface-border);
      background: #14110f;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .filter-btn:hover {
      background: var(--surface-hover);
      color: #fff;
    }
    .filter-btn.active {
      background: rgba(26, 107, 255, 0.25);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Controls Bar (Zoom, Center) */
    .controls-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 6px;
      background: rgba(36, 33, 30, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 4px;
      z-index: 10;
      animation: slideInControls 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
    }
    .ctrl-btn {
      background: #14110f;
      border: 1px solid var(--surface-border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    /* Legend (Bottom Center) */
    .legend {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(36, 33, 30, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 6px 14px;
      display: flex;
      gap: 14px;
      font-size: 0.72rem;
      color: var(--text-muted);
      z-index: 10;
      pointer-events: none;
      animation: slideInLegend 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Floating Hover Tooltip */
    .hover-tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(20, 17, 15, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 280px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: none;
      z-index: 30;
      transform: translate(-50%, -125%);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .hover-tooltip .tt-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
    }
    .hover-tooltip .tt-cluster {
      font-size: 0.7rem;
      color: #4A90D9;
      font-weight: 500;
    }

    /* Info Panel (Right) */
    .info-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(36, 33, 30, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 20px;
      width: 380px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      display: none;
      z-index: 20;
    }
    .info-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .info-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .close-btn:hover { color: #fff; }
    .info-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;

    .info-summary {
      font-size: 0.84rem;
      line-height: 1.6;
      color: #d9c5b2;
      background: rgba(20, 17, 15, 0.6);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 14px 0 8px 0;
    }
    .rel-list {

      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rel-item {
      background: rgba(20, 17, 15, 0.5);

      border-radius: 6px;
      padding: 7px 10px;

      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .rel-item:hover {
      border-color: rgba(26, 107, 255, 0.4);

    }
    .rel-name {
      font-weight: 600;

      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rel-type-tag {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: block;
    }
    .rel-conf {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      white-space: nowrap;

    .conf-AMBIGUOUS { background: rgba(239,209,70,0.15); color: #EFD146; }

    .open-doc-btn {
      display: inline-block;
      margin-top: 14px;
      width: 100%;
      text-align: center;
      padding: 8px;
      background: rgba(26, 107, 255, 0.15);

      border-radius: 6px;

      font-size: 0.78rem;

      background: rgba(26, 107, 255, 0.3);

    @media (max-width: 640px) {
      .panel { width: calc(100vw - 32px); }
      .info-panel { width: calc(100vw - 32px); }
      .legend { display: none; }
    }

нтуванні рішень[^79]."}, {"id": "2._Виправдання_другого_порядку_проблеми_тлумачення,_релевантності_та_класифікації_Second_order_justi", "title": "2. Виправдання другого порядку: проблеми тлумачення, релевантності та класифікації (Second order justification)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 1, "sources": ["Clippings/theory_json_segments/segment_005_2.2._Second_order_justification.md"], "summary": "Legal Reasoning and Legal Theory (1978) · **Сторінки:** 5-7\n\n### 2.2. Виправдання другого порядку\n\nВиправдання першого порядку може ґрунтуватися на правовій нормі, зміст якої є абсолютно зрозумілим у даному контексті. Макормік зауважує, однак, що нерідко такої норми або взагалі не існує, або значення наявного правила є неясним стосовно встановлених обставин справи[^30]."}, {"id": "Перехід_до_аргументативної_теорії_«Rhetoric_and_the_Rule_of_Law»_2005", "title": "Перехід до аргументативної теорії: «Rhetoric and the Rule of Law» (2005)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 2, "sources": ["Clippings/theory_json_segments/segment_007_3._Rhetoric_and_the_Rule_of_Law_2005.md"], "summary": "Rhetoric and the Rule of Law (2005) · **Сторінки:** 8-10\n\n## 3. Риторика та верховенство права. Теорія юридичного міркування (2005)\n\nУ праці Rh & RoL Макормік підсумовує поступальний розвиток своїх поглядів на юридичне міркування з моменту публікації LR & LT."}, {"id": "Підсумок_Еволюція_від_рафінованого_позитивізму_до_постпозитивізму_Recapitulation", "title": "Підсумок: Еволюція від рафінованого позитивізму до постпозитивізму (Recapitulation)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 1, "sources": ["Clippings/theory_json_segments/segment_012_4._Recapitulation.md"], "summary": "Recapitulation · **Сторінки:** 13-14\n\n## 4. Підсумок\n\nЗастосування методу діахронічного аналізу та чітке розмежування теорії юридичного міркування Макорміка, сформульованої у працях LR & LT та Rh & RoL, мало на меті виокремити два якісно відмінні етапи в розвитку його наукової позиції. Перший із цих етапів тяготів до формалізму, тоді як другий став виразно аргументативно-риторичним."}, {"id": "Повний_покажчик_приміток_та_бібліографічних_посилань_1–101_Notes_&_References", "title": "Повний покажчик приміток та бібліографічних посилань 1–101 (Notes & References)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 1, "sources": ["Clippings/theory_json_segments/segment_013_Notes_and_References.md"], "summary": "E-mail: m.sopinski@wpia.uw.edu.pl\n\n[^2]: N. MacCormick, Legal Reasoning and Legal Theory, Oxford 1978; N. MacCormick, Rhetoric and the Rule of Law, Oxford 2005."}, {"id": "Вступ_Два_етапи_еволюції_теорії_правового_міркування_Макорміка_Introduction_Two_Stages_of_MacCormick", "title": "Вступ: Два етапи еволюції теорії правового міркування Макорміка (Introduction: Two Stages of MacCormick's Theory)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 1, "sources": ["Clippings/theory_json_segments/segment_002_1._Introduction.md"], "summary": "Introduction · **Сторінки:** 1-2\n\n## 1. Вступ\n\nТеорія юридичного міркування Ніла Макорміка ґрунтується на висновках двох його фундаментальних праць: «Юридичне міркування та теорія права» (далі: LR&LT) та «Риторика та верховенство права» (далі: Rh&RoL)[^2]. Перша з них датується 1978 роком, друга — 2005 роком."}, {"id": "3._Консеквенціалістські_аргументи,_аргументи_когерентності_та_несуперечливості_Consequentialist_argu", "title": "3. Консеквенціалістські аргументи, аргументи когерентності та несуперечливості (Consequentialist arguments, coherence and consistency)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 1, "sources": ["Clippings/theory_json_segments/segment_006_2.3._Consequentialist_arguments.md"], "summary": "Legal Reasoning and Legal Theory (1978) · **Сторінки:** 7-8\n\n### 2.3. Консеквенціалістські аргументи, аргументи когерентності та несуперечливості\n\nУ теорії міркування Макорміка розрізняються два типи консеквенціалістських аргументів[^49]. Перший стосується ситуації, коли суддя передбачає фактичні наслідки обраного рішення."}, {"id": "Загальні_засади_праці_«Legal_Reasoning_and_Legal_Theory»_1978", "title": "Загальні засади праці «Legal Reasoning and Legal Theory» (1978)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 1, "sources": ["Clippings/theory_json_segments/segment_003_2._Legal_Reasoning_and_Legal_Theory_1978.md"], "summary": "Legal Reasoning and Legal Theory (1978) · **Сторінки:** 2-4\n\n## 2. Юридичне міркування та теорія права (1978)\n\nПраця LR & LT вважається одним із найважливіших досягнень Макорміка у сфері філософії права XX століття. На момент публікації ця книга була, ймовірно, першою науковою працею, цілком присвяченою проблемам юридичного міркування та тлумачення, написаною філософом, вихованим у традиціях позит..."}, {"id": "1._Риторика_та_верховенство_права_узгодження_двох_топосів_Rhetoric_and_the_rule_of_law", "title": "1. Риторика та верховенство права: узгодження двох топосів (Rhetoric and the rule of law)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 5, "sources": ["Clippings/theory_json_segments/segment_008_3.1._Rhetoric_and_the_rule_of_law.md"], "summary": "Rhetoric and the Rule of Law (2005) · **Сторінки:** 10-11\n\n### 3.1. Риторика та верховенство права: узгодження двох топосів\n\nУ Rh & RoL Макормік детально аналізує взаємовідношення між ідеєю верховенства права та тезою про аргументативну природу права[^69]. Спираючись на концепцію Хаїма Перельмана, Макормік використовує поняття «спільних місць» (грецькі topoi), прагнучи довести, що, попри видиму не..."}, {"id": "Титул,_анотація_та_ключові_слова_Title,_Abstract_&_Keywords", "title": "Титул, анотація та ключові слова (Title, Abstract & Keywords)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 1, "sources": ["Clippings/theory_json_segments/segment_001_Title_and_Abstract.md"], "summary": "Погляди Макорміка формувалися поступово, тому його теорію можна поділити на два основні етапи. Таким чином, застосування діахронічного підходу є цілком виправданим. Мета статті полягає в аналізі відмінностей між тезами теорії юридичного міркування, викладеними в праці «Юридичне міркування та теорія права» (*Legal Reasoning and Legal Theory*, 1978), та загальними переглядами цієї теорії, окресленим..."}, {"id": "4._Застосування_дедуктивної_моделі_у_процесі_інтерпретації_Application_of_the_deductive_model_in_int", "title": "4. Застосування дедуктивної моделі у процесі інтерпретації (Application of the deductive model in interpretation)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 3, "sources": ["Clippings/theory_json_segments/segment_011_3.4._Application_of_the_deductive_model.md"], "summary": "Rhetoric and the Rule of Law (2005) · **Сторінки:** 13\n\n## 3.4. Застосування дедуктивної моделі у процесі інтерпретації\n\nПерегляд деяких засад щодо природи юридичного міркування, здійснений Макорміком у Rh & RoL, спонукає до осмислення ролі дедуктивної моделі під час вирішення справ судами. Насамперед слід підкреслити, що, за Макорміком, право не є точною наукою, і тому юридичний силогізм не можна..."}, {"id": "3._Зближення_позиції_Макорміка_з_тезою_Рональда_Дворкіна_про_«єдину_правильну_відповідь»_Approximati", "title": "3. Зближення позиції Макорміка з тезою Рональда Дворкіна про «єдину правильну відповідь» (Approximation to Dworkin's thesis)", "type": "concept", "domain": "legal_theory", "cluster": "MacCormick Legal Reasoning & Justification", "degree": 1, "sources": ["Clippings/theory_json_segments/segment_010_3.3._Approximation_to_Dworkin_s_thesis.md"], "summary": "Rhetoric and the Rule of Law (2005) · **Сторінки:** 12-13\n\n## 3.3. Зближення позиції Макорміка з тезою Рональда Дворкіна про «єдину правильну відповідь»\n\nУ Rh & RoL Макормік істотно переглядає свої попередні погляди на проблему складних і ясних справ[^85]. Спочатку він звертається до історичного значення поняття «складна справа» (hard case) як справи, що нерідко призводила до несправедливих рішень..."}, {"id": "Висновки_до_четвертого_розділу", "title": "Висновки до четвертого розділу", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 3, "sources": ["Clippings/scherbina_json_segments/segment_19_Розділ_4_Висновки.md"], "summary": "Аналітичний аспект логічного аналізу юридичної аргументації · **Сторінки:** 330-335\n\nВисновки до четвертого розділу. Під час дослідження аналітичного аспекту логічного аналізу юридичної аргументації у роботі проаналізовано схеми аргументації, що найбільш поширені в юридичній аргументації. Це дало змогу зробити висновок, що у сучасній дослідницькій літературі та підручниках з аргументації стосовно ..."}, {"id": "2._Аналітичний_та_герменевтичний_аспекти_логічного_аналізу_юридичної_аргументації", "title": "2. Аналітичний та герменевтичний аспекти логічного аналізу юридичної аргументації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 2, "sources": ["Clippings/scherbina_json_segments/segment_11_Розділ_3_3.2_Аналітичний_та_герменевтичний_аспекти.md"], "summary": "Дослідження юридичної аргументації: підходи та аспекти · **Сторінки:** 171-180\n\n3.2. Аналітичний та герменевтичний аспекти логічного аналізу юридичної аргументації. Юридична аргументація та дослідження в цій галузі можуть розглядатися під різними кутами зору."}, {"id": "Титул,_реквізити_та_зміст_дисертації", "title": "Титул, реквізити та зміст дисертації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 1, "sources": ["Clippings/scherbina_json_segments/segment_01_Титул_та_зміст.md"], "summary": "Автор: Олена Юріївна Щербина Спеціальність: 09.00.06 – логіка Науковий ступінь: доктор філософських наук Науковий консультант: І. Хоменко, доктор філософських наук, професор Установа: Київський національний університет імені Тараса Шевченка Місто, рік: Київ – 2014 МІНІСТЕРСТВО ОСВІТИ І НАУКИ УКРАЇНИ КИЇВСЬКИЙ НАЦІОНАЛЬНИЙ УНІВЕРСИТЕТ ІМЕНІ ТАРАСА ШЕВЧЕНКА На правах рукопису ЩЕРБИНА ОЛЕНА ЮРІЇВНА У..."}, {"id": "4._Абдукція_в_юридичній_аргументації", "title": "4. Абдукція в юридичній аргументації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 7, "sources": ["Clippings/scherbina_json_segments/segment_17_Розділ_4_4.4_Абдукція_в_юридичній_аргументації.md"], "summary": "Аналітичний аспект логічного аналізу юридичної аргументації · **Сторінки:** 281-302\n\n4.4. Абдукція в юридичній аргументації. У правдоподібній аргументації застосовуються не тільки різні форми індуктивних міркувань та міркувань за аналогією."}, {"id": "1._Основні_сучасні_підходи_до_аналізу_юридичної_аргументації", "title": "1. Основні сучасні підходи до аналізу юридичної аргументації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 3, "sources": ["Clippings/scherbina_json_segments/segment_10_Розділ_3_3.1_Основні_сучасні_підходи.md"], "summary": "Дослідження юридичної аргументації: підходи та аспекти · **Сторінки:** 129-171\n\nРОЗДІЛ 3. ДОСЛІДЖЕННЯ ЮРИДИЧНОЇ АРГУМЕНТАЦІЇ: ПІДХОДИ ТА АСПЕКТИ. Аналізуються недоліки та переваги логічного підходу до юридичної аргументації у порівнянні з риторичним та діалектичним підходами."}, {"id": "2._Специфіка_розуміння_царини_логічного_знання_при_аналізі_юридичної_аргументації", "title": "2. Специфіка розуміння царини логічного знання при аналізі юридичної аргументації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 2, "sources": ["Clippings/scherbina_json_segments/segment_07_Розділ_2_2.2_Специфіка_розуміння_царини_логічного.md"], "summary": "Взаємозв’язок логіки та юридичної аргументації: теоретико-методологічні засади · **Сторінки:** 94-115\n\n2.2. Специфіка розуміння царини логічного знання при аналізі юридичної аргументації. Питання взаємозв’язку логіки та юридичної аргументації пов’язане з проблемою розуміння царини логічного."}, {"id": "Висновки_до_першого_розділу", "title": "Висновки до першого розділу", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 1, "sources": ["Clippings/scherbina_json_segments/segment_05_Розділ_1_Висновки.md"], "summary": "Методологічна та джерельна база дослідження · **Сторінки:** 77-79\n\nВисновки до першого розділу. Проведений огляд досліджень, присвячених питанню взаємозв’язку логіки та юридичної аргументації, поєднуючих у собі існуючі доробки, що ґрунтуються на вивченні, з одного боку, проблеми становлення теорії та практики аргументації, з другого – проблеми взаємозв’язку логіки та права, дав змогу показати, що ..."}, {"id": "3._Логічна_складова_правового_стилю_юристів_країн_романо-германського_та_англо-американського_права", "title": "3. Логічна складова правового стилю юристів країн романо-германського та англо-американського права", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 2, "sources": ["Clippings/scherbina_json_segments/segment_12_Розділ_3_3.3_Логічна_складова_правового_стилю.md"], "summary": "Дослідження юридичної аргументації: підходи та аспекти · **Сторінки:** 180-193\n\n3.3. Логічна складова правового стилю юристів країн романо-германського та англо-американського права. Зростаючий інтерес до дослідження проблем юридичної аргументації є обумовленим практичними проблемами суспільства."}, {"id": "Загальні_висновки_дисертації", "title": "Загальні висновки дисертації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 1, "sources": ["Clippings/scherbina_json_segments/segment_25_Загальні_висновки_дисертації.md"], "summary": "Проведений огляд досліджень, присвячених питанню взаємозв’язку логіки та юридичної аргументації, поєднуючих у собі існуючі доробки, що ґрунтуються на вивченні, з одного боку, проблеми становлення теорії та практики аргументації, з другого – проблеми взаємозв’язку логіки та права, дав змогу показати, що багатовікова історія аргументації взагалі як практичного мистецтва та застосування його у праві ..."}, {"id": "1._Поняття_аргументації,_юридичної_аргументації_та_логічного_аналізу", "title": "1. Поняття аргументації, юридичної аргументації та логічного аналізу", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 2, "sources": ["Clippings/scherbina_json_segments/segment_03_Розділ_1_1.1_Поняття_аргументації.md"], "summary": "Методологічна та джерельна база дослідження · **Сторінки:** 17-32\n\nРОЗДІЛ 1. МЕТОДОЛОГІЧНА ТА ДЖЕРЕЛЬНА БАЗА ДОСЛІДЖЕННЯ. Виділяються та досліджуються різні сенси понять «аргументація» та «юридична аргументація»."}, {"id": "Вступ._Актуальність,_мета,_завдання_та_методологія", "title": "Вступ. Актуальність, мета, завдання та методологія", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 1, "sources": ["Clippings/scherbina_json_segments/segment_02_Вступ.md"], "summary": "Актуальність теми дослідження. Для розвитку наукової думки в кінці XX – початку XXI ст. характерними є не тільки процеси диференціації, а й інтеграції наук, які пов’язані з тим, що на перший план виходить проблема застосування теоретичних знань із різних наукових галузей у практичній діяльності людини."}, {"id": "5._Застосування_апарата_сучасної_логіки_у_дослідженні_феномену_мовчання_в_юридичній_аргументації", "title": "5. Застосування апарата сучасної логіки у дослідженні феномену мовчання в юридичній аргументації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 1, "sources": ["Clippings/scherbina_json_segments/segment_18_Розділ_4_4.5_Феномен_мовчання_в_аргументації.md"], "summary": "Аналітичний аспект логічного аналізу юридичної аргументації · **Сторінки:** 302-330\n\n4.5. Застосування апарата сучасної логіки у дослідженні феномену мовчання в юридичній аргументації. Інтерпретація мовчання в юридичній аргументації Наприкінці ХХ – на початку ХХІ сторіччя криза слова породжує інтерес до мовчання, особливо до його комунікативної функції."}, {"id": "1._Інтерпретація_як_спосіб_аргументування_в_юридичній_аргументації", "title": "1. Інтерпретація як спосіб аргументування в юридичній аргументації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 1, "sources": ["Clippings/scherbina_json_segments/segment_20_Розділ_5_5.1_Інтерпретація_як_спосіб_аргументування.md"], "summary": "Герменевтичний аспект логічного аналізу юридичної аргументації · **Сторінки:** 335-345\n\nРОЗДІЛ 5. ГЕРМЕНЕВТИЧНИЙ АСПЕКТ ЛОГІЧНОГО АНАЛІЗУ ЮРИДИЧНОЇ АРГУМЕНТАЦІЇ. Розглядається роль інтерпретації в юридичній аргументації, демонструється, що тут вона може бути репрезентована як спосіб аргументування."}, {"id": "2._Дедукція_та_індукція_в_юридичній_аргументації", "title": "2. Дедукція та індукція в юридичній аргументації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 2, "sources": ["Clippings/scherbina_json_segments/segment_15_Розділ_4_4.2_Дедукція_та_індукція_в_аргументації.md"], "summary": "Аналітичний аспект логічного аналізу юридичної аргументації · **Сторінки:** 225-265\n\n4.2. Дедукція та індукція в юридичній аргументації. Суть дедуктивного способу обґрунтування полягає у тому, що на підтримку власної точки зору учасник дискусії наводить доводи таким чином, щоб вони та точка зору складали б разом доказове з точки зору логіки міркування, якщо б доводи були істинними."}, {"id": "1._Методологічна_функція_аргументації_в_юридичних_міркуваннях", "title": "1. Методологічна функція аргументації в юридичних міркуваннях", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 2, "sources": ["Clippings/scherbina_json_segments/segment_06_Розділ_2_2.1_Методологічна_функція_аргументації.md"], "summary": "Взаємозв’язок логіки та юридичної аргументації: теоретико-методологічні засади · **Сторінки:** 79-94\n\nРОЗДІЛ 2. ВЗАЄМОЗВ’ЯЗОК ЛОГІКИ ТА ЮРИДИЧНОЇ АРГУМЕНТАЦІЇ: ТЕОРЕТИКО-МЕТОДОЛОГІЧНІ ЗАСАДИ. Розглядається методологічна функція аргументації в юридичному міркуванні."}, {"id": "Висновки_до_п’ятого_розділу", "title": "Висновки до п’ятого розділу", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 1, "sources": ["Clippings/scherbina_json_segments/segment_24_Розділ_5_Висновки.md"], "summary": "Герменевтичний аспект логічного аналізу юридичної аргументації · **Сторінки:** 377-379\n\nВисновки до п’ятого розділу. Результатом дослідження герменевтичного аспекту логічного аналізу юридичної аргументації стали такі положення: 1. Теза про те, що інтерпретація в юридичній аргументації може бути репрезентована як спосіб аргументування."}, {"id": "2._Логічна_складова_тлумачення_юридичних_текстів", "title": "2. Логічна складова тлумачення юридичних текстів", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 4, "sources": ["Clippings/scherbina_json_segments/segment_21_Розділ_5_5.2_Логічна_складова_тлумачення_текстів.md"], "summary": "Герменевтичний аспект логічного аналізу юридичної аргументації · **Сторінки:** 345-355\n\n5.2. Логічна складова тлумачення юридичних текстів. Упорядкування правової термінології неможливе без достатньо глибокої наукової розробки юридичних понять, їхнього логічного аналізу."}, {"id": "3._Юридична_логіка_як_наукова_дисципліна_проблеми_витлумачення", "title": "3. Юридична логіка як наукова дисципліна: проблеми витлумачення", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 3, "sources": ["Clippings/scherbina_json_segments/segment_08_Розділ_2_2.3_Юридична_логіка_як_наукова_дисципліна.md"], "summary": "Взаємозв’язок логіки та юридичної аргументації: теоретико-методологічні засади · **Сторінки:** 115-126\n\n2.3. Юридична логіка як наукова дисципліна: проблеми витлумачення. Серед науковців та викладачів логіки в юридичних вищих закладах освіти України є такі, хто висловлює думку про коректність і, навіть, необхідність вживання терміна «юридична логіка» щодо назви академічної дисципліни, приєднуючись..."}, {"id": "3._Специфіка_використання_аналогії_в_юридичній_аргументації", "title": "3. Специфіка використання аналогії в юридичній аргументації", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 1, "sources": ["Clippings/scherbina_json_segments/segment_16_Розділ_4_4.3_Специфіка_використання_аналогії.md"], "summary": "Аналітичний аспект логічного аналізу юридичної аргументації · **Сторінки:** 265-281\n\n4.3. Специфіка використання аналогії в юридичній аргументації. Аргументація за аналогією є невід’ємною частиною юридичного міркування."}, {"id": "Висновки_до_другого_розділу", "title": "Висновки до другого розділу", "type": "concept", "domain": "legal_logic", "cluster": "Scherbina Legal Hermeneutics & Abduction", "degree": 3, "sources": ["Clippings/scherbina_json_segments/segment_09_Розділ_2_Висновки.md"], "summary": "Взаємозв’язок логіки та юридичної аргументації: теоретико-методологічні засади · **Сторінки:** 126-129\n\nВисновки до другого розділу. Аналіз іс ги до значення слів. Іноді ми не знаємо встановленого значення слова, або воно..."}, {"id": "Правило_34_Одразу_переходьте_до_суті_Jump_right_in", "title": "Правило 34: Одразу переходьте до суті (Jump right in)", "type": "rule", "domain": "argumentation_rules", "cluster": "Weston Argumentation Rules", "degree": 1, "sources": ["Clippings/rulebook_json_segments/segment_049_Ch8_Rule_34_Jump_right_in.md"], "summary": "Аргументативні есе · **Сторінки:** Частина 49 · **Всього стор.:** 1\n\n← [[segment_048_Ch8_Overview|Попередній сегмент]] | [[_Зміст_Rulebook_for_Arguments|Зміст]] | [[segment_050_Ch8_Rule_35_Urge_a_definite_claim_or_proposal|Наступний сегмент]] →\n\nПравило 34: Одразу переходьте до суті. НІ: Століттями філософи дискутували про найкращий спосіб бути щасливим. Ми це вже знали."}, {"id": "Правило_9_Фонова_статистика_часто_має_вирішальне_значення_Background_rates_are_often_crucial", "title": "Правило 9: Фонова статистика часто має вирішальне значення (Background rates are often crucial)", "type": "rule", "domain": "argumentation_rules", "cluster": "Weston Argumentation Rules", "degree": 1, "sources": ["Clippings/rulebook_json_segments/segment_018_Ch2_Rule_9_Background_rates_are_often_crucial.md"], "summary": "Аргументи на прикладах · **Сторінки:** Частина 18 · **Всього стор.:** 1\n\n← [[segment_017_Ch2_Rule_8_Use_representative_examples|Попередній сегмент]] | [[_Зміст_Rulebook_for_Arguments|Зміст]] | [[segment_019_Ch2_Rule_10_Statistics_need_a_critical_eye|Наступний сегмент]] →\n\nПравило 9: Фонова статистика часто має вирішальне значення. Щоб переконати вас, що я першокласний стрілець з лука, недостатньо ..."}, {"id": "Огляд_Розділ_II._Аргументи_на_прикладах_Overview_Chapter_II_Arguments_by_Example", "title": "Огляд: Розділ II. Аргументи на прикладах (Overview: Chapter II: Arguments by Example)", "type": "concept", "domain": "argumentation_rules", "cluster": "Argument Construction & Essays", "degree": 1, "sources": ["Clippings/rulebook_json_segments/segment_01 торінки:** Частина 35 · **Всього стор.:** 1\n\n← [[segment_034_Ch6_Overview|Попередній сегмент]] | [[_Зміст_Rulebook_for_Arguments|Зміст]] | [[segment_036_Ch6_Rule_23_Modus_tollens|Наступний сегмент]] →\n\nПравило 22: Ствердження антецедента. Використовуючи букви p і q, щоб позначити твердження, найпростіша дедуктивно правильна форма така: Якщо [твердження p], то [твердження ..."}, {"id": "Правило_2_Розгортайте_свої_думки_у_природному_порядку_Unfold_your_ideas_in_a_natural_order", "title": "Правило 2: Розгортайте свої думки у природному порядку (Unfold your ideas in a natural order)", "type": "rule", "domain": "argumentation_rules", "cluster": "Weston Argumentation Rules", "degree": 1, "sources": ["Clippings/rulebook_json_segments/segment_010_Ch1_Rule_2_Unfold_your_ideas_in_a_natural_orde.md"], "summary": "Короткі аргументи: деякі загальні правила · **Сторінки:** Частина 10 · **Всього стор.:** 1\n\n← [[segment_009_Ch1_Rule_1_Resolve_premises_and_conclusion|Попередній сегмент]] | [[_Зміст_Rulebook_for_Arguments|Зміст]] | [[segment_011_Ch1_Rule_3_Start_from_reliable_premises|Наступний сегмент]] →\n\nПравило 2: Розгортайте свої думки у природному порядку. Аргументи рухаються. Причини та докази ведуть до ви..."}, {"id": "5._Значення_логіки_для_правознавства_та_юридичної_практики", "title": "5. Значення логіки для правознавства та юридичної практики", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_07_1.5._Значення_логіки_для_правознавства_та_юридично.md"], "summary": "Предмет і значення логіки. Мислення і мова · **Кількість сторінок:** 2\n\nМетодологічне значення семіотичного трикутника полягає в тому, що він є основою моделювання різних видів відношень. Наприклад, модифікацією семіотичного трикутника є комунікативний трикутник «інформація – адресат – реципієнт», або драматичний трикутник «агресор – жертва – рятувальник», або герменевтичний трикутник «текст– авто..."}, {"id": "4._Недедуктивні_умовиводи", "title": "4. Недедуктивні умовиводи", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 4, "sources": ["Clippings/logica_json_segments/segment_30_5.4._Недедуктивні_умовиводи.md"], "summary": "Умовивід · **Кількість сторінок:** 27\n\nго значення використання дедуктивних умовиводів як форми мислення, унаслідок чого з’являється нове (вивідне) знання, яке є необхідно істинним, є суттєвим аспектом юридичної теорії та юридичної практики. Висновок буде необхідно істинним, якщо правильність виведення його із засновків поєднується з істинністю останніх. При порушенні цієї умови укладення буде ймо..."}, {"id": "2._Предмет_науки_логіки", "title": "2. Предмет науки логіки", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_04_1.2._Предмет_науки_логіки.md"], "summary": "Предмет і значення логіки. Мислення і мова · **Кількість сторінок:** 4\n\nОднією з головних особливостей логіки як науки про мислення є її формальний характер. Логіку в її традиційному та класичному значенні вважають «формальною логікою»."}, {"id": "4._Відношення_між_поняттями._Діаграми_Ейлера_–_Венна", "title": "4. Відношення між поняттями. Діаграми Ейлера – Венна", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_12_2.4._Відношення_між_поняттями._Діаграми_Ейлера_Вен.md"], "summary": "Поняття · **Кількість сторінок:** 3\n\nЗдійснити повний логічний аналіз поняття означає визначити всі логічні характеристики обсягу і змісту. Наприклад: закон – це а) непорожнє; б) загальне; в) нереєструюче; г) незбірне; д) конкретне; е) позитивне; є) безвідносне поняття. \u0007Відношення між поняттями."}, {"id": "Контрольні_питання_до_Розділу_2", "title": "Контрольні питання до Розділу 2", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_14_Контрольні_питання_до_Розділу_2.md"], "summary": "Поняття · **Кількість сторінок:** 2\n\nними ознаками. Помилка: надмірність. У класичних визначеннях це правило виконується за умови, якщо: а) рід, що входить у визначальне, є найближчим по відношенню до визначуваного, тобто таким, що ніяке інше поняття, підпорядковане роду і підпорядковуюче визначуване раніше не визначене; б) у визначальному відсутні вирази, що знаходяться у відношенні слідування (п..."}, {"id": "5._Логіка_запитань_і_відповідей_інтерогативна_логіка", "title": "5. Логіка запитань і відповідей (інтерогативна логіка)", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_19_3.5._Логіка_запитань_і_відповідей_інтерогативна_ло.md"], "summary": "Судження · **Кількість сторінок:** 6\n\nНайчастіше правозаборонні норми в усіх юридичних документах формулюються за допомогою деонтичної модальності. Наприклад, у статті 37 Конституції України говориться: «Утворення і діяльність політичних партій та громадських організацій, програмні цілі або дії яких спрямовані на ліквідацію незалежності України, зміну конституційного ладу насильницьким шляхом, пор..."}, {"id": "2._Види_доведення", "title": "2. Види доведення", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 4, "sources": ["Clippings/logica_json_segments/segment_33_6.2._Види_доведення.md"], "summary": "Доведення і спростування. Гіпотеза · **Кількість сторінок:** 5\n\nУ нашому прикладі тезою є твердження, що «Чинний Цивільний кодекс України прийнятий Верховною Радою України». У даному прикладі аргументами слугують судження: 1."}, {"id": "Контрольні_питання_до_Розділу_1", "title": "Контрольні питання до Розділу 1", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_08_Контрольні_питання_до_Розділу_1.md"], "summary": "Предмет і значення логіки. Мислення і мова · **Кількість сторінок:** 1\n\nу впровадженні ТЗНПК (тестів загальної навчальної правничої компетентності) як оцінки рівня розвитку інтелекту юриста-бакалавра зі встановленням певного необхідного покажчика для продовження навчання в магістратурі. Серед установлених МОН України загальних професійних компетентностей юриста велика кількість здобувається завдяк..."}, {"id": "Титул,_зміст", "title": "Титул, зміст", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_01_Титул_зміст.md"], "summary": "Данильяна Харків «Право» 2022 УДК 16(075.8) Л69 А в т о р и: О. Юркевич, доктор філософських наук, професор (розділ 1, підрозділи 2.1, 2.2, 2.3, 2.4, 3.5); С. Качурова, кандидат філософських наук, доцент (підрозділи 3.1, 3.2, 3.3, 3.4, розділ 4); О."}, {"id": "Список_рекомендованих_джерел", "title": "Список рекомендованих джерел", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 2, "sources": ["Clippings/logica_json_segments/segment_38_Список_рекомендованих_джерел.md"], "summary": "Логіка : підручник / В. – Київ : Знання, 2004. Логіка : підручник / А."}, {"id": "Контрольні_питання_до_Розділу_4", "title": "Контрольні питання до Розділу 4", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_26_Контрольні_питання_до_Розділу_4.md"], "summary": "Основні закони логіки · **Кількість сторінок:** 1\n\n«Оскільки інструкція до використання довга, то управління машиною буде складним», «У цій дисертації не розкрита актуальність роботи, але вона заслуговує на позитивний відгук». За допомогою закону достатньої підстави в логіку вводиться принцип загальної зумовленості речей у природі. Завдяки цьому він стає фундаментом наукового, доказового пізнання."}, {"id": "1._Загальна_характеристика_судження", "title": "1. Загальна характеристика судження", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_15_3.1._Загальна_характеристика_судження.md"], "summary": "Судження · **Кількість сторінок:** 4\n\nСудження, висловлювання і речення Людині властиво пізнавати навколишній світ, визначати зв’язки і відносини між предметами. Ці зв’язки відбиваються в мисленні у вигляді суджень. Поняття – це початкова, найпростіша форма мислення."}, {"id": "3._Складні_судження", "title": "3. Складні судження", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_17_3.3._Складні_судження.md"], "summary": "Судження · **Кількість сторінок:** 8\n\nСкладні судження та їх види. Логічні сполучники. Формули складних суджень С к л а д н и м  називається судження, яке складається з декількох простих, об’єднаних в одне ціле за допомогою певних логічних сполучників, головними з  яких є: «і» (кон’юнкція), «або» (диз’юнкція), «якщо… то» (імплікація), «тоді і  тільки тоді… коли…» (еквівалентність)."}, {"id": "1._Поняття_як_форма_думки._Поняття_і_слово", "title": "1. Поняття як форма думки. Поняття і слово", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_09_2.1._Поняття_як_форма_думки._Поняття_і_слово.md"], "summary": "Поняття · **Кількість сторінок:** 4\n\nТермін «поняття» використовується: а)  для позначення системи знань про предмети та їх відношення (у теоретичному значенні)  і б) для позначення уявної дії (у практичному значенні). У професійній сфері фахівці користуються науковими поняттями (право, закон, громадянин), завдяки яким передаються знання. А в побутових життєвих або в професійних практичних ситуаці..."}, {"id": "Контрольні_питання_до_Розділу_6", "title": "Контрольні питання до Розділу 6", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_37_Контрольні_питання_до_Розділу_6.md"], "summary": "Доведення і спростування. Гіпотеза · **Кількість сторінок:** 1\n\nОсобливості доведення версій наступні: непрямі логічні доведення вимагають підкріплення прямими доказами; доведення вважається завершеним лише при вступі в силу вироку суду. До цього моменту діє презумпція невинуватості."}, {"id": "4._Мислення_і_мова._Семіотика", "title": "4. Мислення і мова. Семіотика", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 2, "sources": ["Clippings/logica_json_segments/segment_06_1.4._Мислення_і_мова._Семіотика.md"], "summary": "Предмет і значення логіки. Мислення і мова · **Кількість сторінок:** 5\n\nНекласичний період сучасної логіки охоплює період із  початку XX ст. Некласичні логіки постають в якості множини різних формальних систем, у яких варіюється апарат традиційної та формальної логіки, що дозволяє отримати різні моделі логічних висновків і логічної істини."}, {"id": "3._Правила_доведення_та_можливі_логічні_помилки_в_доведенні", "title": "3. Правила доведення та можливі логічні помилки в доведенні", "type": "rule", "domain": "formal_logic", "cluster": "Formal Logic Laws & Rules", "degree": 3, "sources": ["Clippings/logica_json_segments/segment_34_6.3._Правила_доведення_та_можливі_логічні_помилки_.md"], "summary": "Доведення і спростування. Гіпотеза · **Кількість сторінок:** 7\n\n<А1 ∇ ˅ А2 ∇ ˅ А3> (~ А1 ˄ ~ А2) А3 Ми бачимо, що теза обґрунтовується шляхом виключення всіх членів розділового судження, крім одного. Непряме доведення є ефективним засобом обґрунтування висунутих положень."}, {"id": "3._Закон_непротиріччя", "title": "3. Закон непротиріччя", "type": "rule", "domain": "formal_logic", "cluster": "Formal Logic Laws & Rules", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_23_4.3._Закон_непротиріччя.md"], "summary": "Основні закони логіки · **Кількість сторінок:** 1\n\nпонять ототожнюється. Це найчастіше відбувається несвідомо (паралогізм). Проте іноді підміна робиться навмисно (софізм)."}, {"id": "1._Загальна_характеристика_умовиводів._Види_умовиводів", "title": "1. Загальна характеристика умовиводів. Види умовиводів", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 2, "sources": ["Clippings/logica_json_segments/segment_27_5.1._Загальна_характеристика_умовиводів._Види_умов.md"], "summary": "Умовивід · **Кількість сторінок:** 2\n\nУмовивід – третя, найбільш складна, логічна форма мислення, яка займає особливе місце в міркуваннях. Умовивід – це логічний засіб здобування нового знання. Об’єктивною підставою умовиводу є логічний зв’язок і взаємозалежність предметів та явищ дійсності."}, {"id": "3._Види_понять", "title": "3. Види понять", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_11_2.3._Види_понять.md"], "summary": "Поняття · **Кількість сторінок:** 4\n\nки» − множ.) на визначення обсягу думки не впливає. Тож слід розрізнювати числову характеристику в граматичному та логічному аналізі. Закономірності взаємозв’язку між змістом і обсягом понять виражені в  з а к о н і  зворотного відношення між змістом і обсягом понять: якщо обсяг поняття збільшується, то зміст стає вужчим."}, {"id": "Контрольні_питання_до_Розділу_5", "title": "Контрольні питання до Розділу 5", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_31_Контрольні_питання_до_Розділу_5.md"], "summary": "Умовивід · **Кількість сторінок:** 1\n\nЩо таке умовивід? Яка структура умовиводу? Які існують види умовиводів?"}, {"id": "4._Закон_виключеного_третього", "title": "4. Закон виключеного третього", "type": "rule", "domain": "formal_logic", "cluster": "Formal Logic Laws & Rules", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_24_4.4._Закон_виключеного_третього.md"], "summary": "Основні закони логіки · **Кількість сторінок:** 2\n\nроняє мислити і міркувати суперечливо. Цей закон кваліфікує протиріччя як серйозну логічну помилку, несумісну з логічним мисленням. Формула закону непротиріччя така: невірно, що А і не-А."}, {"id": "2._Логічна_структура_поняття._Закон_зворотного_відношення_між_змістом_і_обсягом_поняття", "title": "2. Логічна структура поняття. Закон зворотного відношення між змістом і обсягом поняття", "type": "rule", "domain": "formal_logic", "cluster": "Formal Logic Laws & Rules", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_10_2.2._Логічна_структура_поняття._Закон_зворотного_в.md"], "summary": "Поняття · **Кількість сторінок:** 1\n\nЗакон зворотного відношення між змістом і обсягом поняття Логічна структура поняття містить зміст і обсяг. З м і с т  поняття – це якісна (інтенсіональна) характеристика поняття, що становить сукупність суттєвих ознак предмета думки. Зміст передає основну інформацію відносно об’єкта пізнання (денотата)."}, {"id": "5._Закон_достатньої_підстави", "title": "5. Закон достатньої підстави", "type": "rule", "domain": "formal_logic", "cluster": "Formal Logic Laws & Rules", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_25_4.5._Закон_достатньої_підстави.md"], "summary": "Основні закони логіки · **Кількість сторінок:** 1\n\n«Звичайно, Семушкін не відмінник, але поки в нього немає інших оцінок, крім одних п’ятірок». Закон достатньої підстави З а к о н   д о с т а т н ь о ї   п і д с т а в и  вимагає доказовості й об­ґрунтованості думки. Він говорить про те, що всяка істинна думка має бути обґрунтована іншими думками, істинність яких уже доведена."}, {"id": "Контрольні_питання_до_Розділу_3", "title": "Контрольні питання до Розділу 3", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_20_Контрольні_питання_до_Розділу_3.md"], "summary": "Судження · **Кількість сторінок:** 1\n\nгії широко використовують подібні способи впливу на масову аудиторію в соціальній комунікації. Контрольні питання 1. Чим судження як форма мислення відрізняється від речення?"}, {"id": "1._Загальна_характеристика_основних_законів_логіки", "title": "1. Загальна характеристика основних законів логіки", "type": "rule", "domain": "formal_logic", "cluster": "Formal Logic Laws & Rules", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_21_4.1._Загальна_характеристика_основних_законів_логі.md"], "summary": "Основні закони логіки · **Кількість сторінок:** 1\n\n4.1. \u0007Загальна характеристика основних законів логіки Принципи правильного мислення – визначеність, послідовність, несуперечливість і доказовість. Поняття «логічний закон» З а к о н и  л о г і к и  відображають необхідний і сутнісний зв’язок між поняттями, судженнями й умовиводами."}, {"id": "2._Прості_судження", "title": "2. Прості судження", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_16_3.2._Прості_судження.md"], "summary": "Судження · **Кількість сторінок:** 16\n\nСтруктура простого судження. Види простих категоричних суджень: атрибутивні, релятивні й екзистенційні Так само як і  будь-яке судження, просте судження має своїми структурними елементами: суб’єкт, предикат, логічну зв’язку і кванторне слово. Залежно від того, що затверджується або заперечується в простих судженнях: належність ознаки предмету, відношення між ..."}, {"id": "2._Закон_тотожності", "title": "2. Закон тотожності", "type": "rule", "domain": "formal_logic", "cluster": "Formal Logic Laws & Rules", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_22_4.2._Закон_тотожності.md"], "summary": "Основні закони логіки · **Кількість сторінок:** 1\n\nОсновні закони логіки відображають специфічні риси розумової діяльності й  опосередковані нею. Властивість визначеності вказує на те, що будь-яка річ при логічному розгляді з необхідністю повинна мислитися в сукупності одних і тих самих одного разу виділених ознак. Ці ознаки задаються при визначенні понять і не можуть довільно змінюватися в рамках..."}, {"id": "Передмова", "title": "Передмова", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_02_Передмова.md"], "summary": "Саме в логіці пізнані та визначені правила істинності, за якими оцінюється будь-який предмет пізнання або соціальна дія. Мислення є найскладнішим предметом пізнання людської природи. Така давня зацікавленість філософів у пізнанні логічних критеріїв правильного мислення пов’язана з тим, що від якості мислення залежить і якість життя як окремої людини, суспільства, так і людської цивілізації в цілом..."}, {"id": "3._Історичні_етапи_розвитку_науки_логіки", "title": "3. Історичні етапи розвитку науки логіки", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_05_1.3._Історичні_етапи_розвитку_науки_логіки.md"], "summary": "Предмет і значення логіки. Мислення і мова · **Кількість сторінок:** 6\n\nструктурована відповідно до логічних норм. Особливістю юридичної логіки є зумовлені специфікою предметів права певні обмеження логічних можливостей мислення, а також деякі винятки з логічних правил."}, {"id": "2._Безпосередні_умовиводи", "title": "2. Безпосередні умовиводи", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_28_5.2._Безпосередні_умовиводи.md"], "summary": "Умовивід · **Кількість сторінок:** 11\n\nА б д у к ц і я – процес формування пояс­нювальної гіпотези. Логічно абдукція будується як міркування від істинності нас­лідку до істинності причини, що її пояснює. За ступенем обґрунтованості умовиводи поділяють на демонстративні та недемонстративні."}, {"id": "4._Модальні_судження", "title": "4. Модальні судження", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_18_3.4._Модальні_судження.md"], "summary": "Судження · **Кількість сторінок:** 5\n\nзаперечення можна представити у вигляді матриці, яка називається таблицею істинності (табл. Таблиця 8 а ~ а ~ ~ а i х i х i х Наприклад, «Усі соціальні норми мають під собою громадську потребу» – істинне судження. Якщо ми використовуємо зовнішнє заперечення, то отримаємо хибне судження: «Невірно, що всі соціальні норми мають під собою громадську потребу»."}, {"id": "5._Логічні_операції_з_поняттями", "title": "5. Логічні операції з поняттями", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_13_2.5._Логічні_операції_з_поняттями.md"], "summary": "Поняття · **Кількість сторінок:** 22\n\n3. Контрадикторні (суперечні)  поняття  – не мають жодного спільного елементу обсягу, одне позитивне, інше – негативне, а обсяг родового поняття вичерпується повністю. Тобто третього поняття не може бути."}, {"id": "1._Поняття_про_мислення", "title": "1. Поняття про мислення", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 2, "sources": ["Clippings/logica_json_segments/segment_03_1.1._Поняття_про_мислення.md"], "summary": "Предмет і значення логіки. Мислення і мова · **Кількість сторінок:** 7\n\nЛогіка – одна зі стародавніх наук, що набула значення пропедевтики (вступу) до вивчення наук і здійснення наукових досліджень. І в сучасному світі вона залишається загальнокультурним феноменом, продовжує продукувати знання, що надають поштовху до розвитку постіндустріальної цивілізації, головною рисою якої є широка інтелектуал..."}, {"id": "3._Дедуктивні_умовиводи", "title": "3. Дедуктивні умовиводи", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 3, "sources": ["Clippings/logica_json_segments/segment_29_5.3._Дедуктивні_умовиводи.md"], "summary": "Умовивід · **Кількість сторінок:** 39\n\nТрадиційно формальна логіка виділяє три види опосередкованих умовиводів: дедукцію як достовірний умовивід, індукцію та аналогію як імовірні, недемонстративні умовиводи. Сучасна логіка включає ще й четвертий умовивід – абдукцію, яка є недемонстративним умовиводом, що відповідає за побудову версій. Д е д у к ц і я (з грец."}, {"id": "5._Гіпотеза_як_форма_пізнання", "title": "5. Гіпотеза як форма пізнання", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 2, "sources": ["Clippings/logica_json_segments/segment_36_6.5._Гіпотеза_як_форма_пізнання.md"], "summary": "Доведення і спростування. Гіпотеза · **Кількість сторінок:** 6\n\nЦі два методи можуть застосовуватися для спростування будь-якої тези незалежно від того, чи забезпечена ця теза аргументами, що її підтримують, чи ні. Виводячи з тези помилковий наслідок або показавши істинність антитези, ми тим самим доводимо хибність тези."}, {"id": "4._Спростування._Методи_спростування", "title": "4. Спростування. Методи спростування", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_35_6.4._Спростування._Методи_спростування.md"], "summary": "Доведення і спростування. Гіпотеза · **Кількість сторінок:** 2\n\nПарадокс неочікуваної страти. У неділю начальник в’язниці повідомив в’язня: «Страта відбудеться на наступному тижні опівдні."}, {"id": "Для_нотаток", "title": "Для нотаток", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 1, "sources": ["Clippings/logica_json_segments/segment_39_Для_нотаток.md"], "summary": "**Розділ:** Додаткові матеріали · **Кількість сторінок:** 4..."}, {"id": "1._Загальна_характеристика_доведення", "title": "1. Загальна характеристика доведення", "type": "concept", "domain": "formal_logic", "cluster": "Categorical Logic & Syllogistics", "degree": 4, "sources": ["Clippings/logica_json_segments/segment_32_6.1._Загальна_характеристика_доведення.md"], "summary": "Доведення і спростування. Гіпотеза · **Кількість сторінок:** 2\n\n6.1. \u0007Загальна характеристика доведення Особливо важливе місце в курсі логіки займає тема «доведення»."}, {"id": "Знати,_як_використовувати_та_структурувати_частини_меморандуму", "title": "Знати, як використовувати та структурувати частини меморандуму", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_042_36._Know_how_to_use_and_arrange_the_parts_of_a_brief.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 16\n\n36. Знати, як користуватися та оформляти частини пояснювальної записки. Обов’язково включайте всі частини пояснювальної записки, які вимагаються судом, у якому вона буде подана."}, {"id": "Спробуйте_знайти_явне_формулювання_вашої_основної_передумови_у_керуючих_або_переконливих_справах.", "title": "Спробуйте знайти явне формулювання вашої основної передумови у керуючих або переконливих справах.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 5, "sources": ["Clippings/making_json_segments/segment_032_27._Try_to_find_an_explicit_statement_of_your_major_pre.md"], "summary": "Юридичне мислення та правова аргументація · **Кількість сторінок:** 1\n\n27. Спробуйте знайти явну формулювання вашої головної передумови у прецедентних або переконливих рішеннях. Часто досить легко знайти прецедентне рішення, яке містить фрагмент, що точно відповідає тому, чим має бути ваша головна передумова."}, {"id": "Прагніть_здобути_репутацію_досконалості", "title": "Прагніть здобути репутацію досконалості", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_122_115._Plan_on_developing_a_reputation_for_excellence..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n115. Прагніть здобути репутацію досконалості. Не сприймайте рішення суду як мірило вашої компетентності."}, {"id": "Передмова_Голови_Верховного_Суду_США_Джона_Г._Робертса", "title": "Передмова (Голови Верховного Суду США Джона Г. Робертса)", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_002_Foreword_by_Chief_Justice_John_G._Roberts_Jr..md"], "summary": "Опубліковані поради щодо того, як переконувати суддів, існують стільки ж, скільки і сама професія суддівства. Їхні джерела включають Арістотеля, Ісократа, Деметрія, Цицерона та Квінтіліана. Тому будь‑яке принципово нове, внесене в цей невеликий том, ймовірно, буде помилковим."}, {"id": "Ніколи_не_питайте,_скільки_часу_у_вас_залишилось.", "title": "Ніколи не питайте, скільки часу у вас залишилось.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_104_97._Never_ask_how_much_time_you_have_left..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n97. Ніколи не питайте, скільки часу у вас залишилось. Відстеження часу — ваша відповідальність, а не суду."}, {"id": "Опануйте_відносну_вагу_прецедентів.", "title": "Опануйте відносну вагу прецедентів.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_031_26._Master_the_relative_weight_of_precedents..md"], "summary": "Юридичне мислення та правова аргументація · **Кількість сторінок:** 3\n\n26. Опануйте відносну вагу прецедентів. З юридичної точки зору, правові джерела поділяються на два типи: обов’язкові (напряму або за наслідком) та переконливі."}, {"id": "Знай_свій_справи.", "title": "Знай свій справи.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_007_3._Know_your_case..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 2\n\n3. Знайте свою справу. Чи коли‑небудь ви намагалися придбати обладнання у продавця, який не мав жодного уявлення про нього?"}, {"id": "Використовувати_підписані_заголовки_розділів", "title": "Використовувати підписані заголовки розділів", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_046_40._Use_captioned_section_headings..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n40. Використовуйте підзаголовки з підписами. Багато судових рішень обходяться без підписів до розділів і підрозділів, спираючись лише на цифри та літери (I, II, III; A, B, C у кожному)."}, {"id": "Знайте_правила_текстової_інтерпретації.", "title": "Знайте правила текстової інтерпретації.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 3, "sources": ["Clippings/making_json_segments/segment_028_23._Know_the_rules_of_textual_interpretation..md"], "summary": "Юридичне мислення та правова аргументація · **Кількість сторінок:** 2\n\n23. Знання правил текстової інтерпретації. Головне правило: перш ніж робити будь-які висновки щодо змісту тексту, прочитайте весь документ, а не лише конкретну положення, що є предметом розгляду."}, {"id": "Посилайтеся_не_лише_на_правила,_а_й_на_справедливість_і_здоровий_глузд.", "title": "Посилайтеся не лише на правила, а й на справедливість і здоровий глузд.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_019_15._Appeal_not_just_to_rules_but_to_justice_and_common.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 3\n\n15. Апеляція не лише до правил, а й до справедливості та здорового глузду. Відомо, що суди іноді виносять рішення, які здаються несправедливими або протирічать здоровому глузду."}, {"id": "Ознайомтеся_з_застосовними_правилами_суду.", "title": "Ознайомтеся з застосовними правилами суду.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_036_30._Consult_the_applicable_rules_of_court..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n30. Консультуйтеся з застосовними правилами суду. Різні суди мають різні правила — вказують дати, до яких мають бути подані меморандуми, заголовки, які вони повинні містити, шрифти та розміри шрифту, у яких їх слід оформляти, максимальну кількість слів або сторінок, які вони можуть містити, кількість копій, які треба подати, та..."}, {"id": "Виключити_жаргон,_клішовані_вирази_та_зайву_латину.", "title": "Виключити жаргон, клішовані вирази та зайву латину.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_050_44._Banish_jargon_hackneyed_expressions_and_needless_La.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n44. Вигань жаргон, заїжджені вислови та надлишкову латину. Під «жаргоном» маємо на увазі слова й вирази, якими майже виключно користуються юристи замість звичайних слів і виразів англійської мови, що передають ту саму думку."}, {"id": "Окресліть_ваш_короткий_виклад", "title": "Окресліть ваш короткий виклад", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_040_34._Outline_your_brief.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 8\n\n34. Складіть план вашого меморандума. Незважаючи на те, що підготовка плану перед початком написання тексту є необхідною, пропуск цього етапу є хибною економією."}, {"id": "Остерігайтеся_запрошених_поступок", "title": "Остерігайтеся запрошених поступок", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_118_111._Beware_invited_concessions..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 2\n\n111. Не давайтеся на запрошені поступки. Ми радили вам добровільно робити поступки, які ретельне розглядання показує, що вони необхідні (§ 11)."}, {"id": "Займіть_найкраще_захищене_становище.", "title": "Займіть найкраще захищене становище.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_014_10._Occupy_the_most_defensible_terrain..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 2\n\n10. Займіть найзахисніше місце. Виберіть найпростіше захисне становище, яке сприятиме вашому клієнту."}, {"id": "Ніколи_не_перебільшуйте_свою_справу._Будьте_скрупульозно_точними.", "title": "Ніколи не перебільшуйте свою справу. Будьте скрупульозно точними.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_010_6._Never_overstate_your_case._Be_scrupulously_accurate..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n6. Ніколи не перебільшуйте свою позицію. Будьте бездоганно точними."}, {"id": "Підготовлюйтеся_сумлінно.", "title": "Підготовлюйтеся сумлінно.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_068_61._Prepare_assiduously..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n61. Готуйтесь старанно. Найскладнішим елементом усної аргументації є несподіване — аргумент опонента або питання суду, яке не передбачалося."}, {"id": "Сядьте_і_пишіть._Потім_перегляньте._Потім_перегляньте_ще_раз._Нарешті,_перегляньте.", "title": "Сядьте і пишіть. Потім перегляньте. Потім перегляньте ще раз. Нарешті, перегляньте.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_041_35._Sit_down_and_write._Then_revise._Then_revise_again..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n35. Потім редагуй знову. І нарешті — знову редагуй."}, {"id": "Коли_у_вас_залишився_час,_але_більше_нічого_корисного_сказати,_підсумуйте_ефективно_та_граціозно.", "title": "Коли у вас залишився час, але більше нічого корисного сказати, підсумуйте ефективно та граціозно.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_094_87._When_you_have_time_left_but_nothing_else_useful_to.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n87. Коли у вас залишився час, але більше нічого корисного сказати, підведіть підсумки ефективно та граціозно. Час, відведений на усний захист, зазвичай настільки короткий, що підсумковий виклад ваших зауважень, у якому ще раз перебираються всі ваші головні пункти, не є ні необхідним, ні можливим."}, {"id": "Ніколи_не_читайте_аргумент;_ніколи_не_виголошуйте_його_з_пам’яті,_окрім_вступу_і,_можливо,_заключної", "title": "Ніколи не читайте аргумент; ніколи не виголошуйте його з пам’яті, окрім вступу і, можливо, заключної частини.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_099_92._Never_read_an_argument_never_deliver_it_from_memory.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n92. Ніколи не читайте аргумент; не виголошуйте його з пам’яті, окрім вступу і, можливо, заключної частини. Деякі судові правила прямо забороняють читання аргументу."}, {"id": "Для_уточнення_абстрактних_понять_наводити_приклади.", "title": "Для уточнення абстрактних понять наводити приклади.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_048_42._To_clarify_abstract_concepts_give_examples..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n42. Щоб уточнити абстрактні поняття, подайте приклади. Юридичні меморанди обов’язково насичені абстрактними поняттями, які важко пояснити."}, {"id": "Організуйте_та_індексуйте_матеріали,_які_можуть_знадобитися.", "title": "Організуйте та індексуйте матеріали, які можуть знадобитися.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_075_68._Organize_and_index_the_materials_you_may_need..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n68. Організуйте та індексуйте матеріали, які можуть знадобитися. Як і «мертве» мовлення на радіо, «мертве» час у усному аргументуванні – це катастрофа."}, {"id": "Уникайте_абревіатур._Використовуйте_назви_сторін.", "title": "Уникайте абревіатур. Використовуйте назви сторін.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_052_46._Avoid_acronyms._Use_the_parties_names..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 2\n\n46. Уникайте абревіатур. Використовуйте імена сторін."}, {"id": "Визначте,_які_частини_вашого_юридичного_меморандума_ви_розглянете.", "title": "Визначте, які частини вашого юридичного меморандума ви розглянете.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_071_64._Decide_which_parts_of_your_brief_you_ll_cover..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n64. Визначте, які частини вашої пояснювальної записки ви розкриватимете. Іноді час, відведений на вашу усну аргументацію, настільки обмежений, що ви не можете належним чином розкрити всі пункти вашої пояснювальної записки."}, {"id": "Досконало_опануйте_вступну_частину.", "title": "Досконало опануйте вступну частину.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_085_78._Have_your_opener_down_pat..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n78. Маєте відкриття під контролем. Будь‑хто, хто коли‑небудь виступав перед публікою, знає, що найскладнішою частиною є саме відкриття."}, {"id": "Будьте_розмовними,_але_не_надто_неформальними.", "title": "Будьте розмовними, але не надто неформальними.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_097_90._Be_conversational_but_not_familiar..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n90. Будьте розмовними, але не фамільярними. Пам’ятайте про відносини, які ви прагнете встановити: це відносини молодшого партнера, що звертається до старшого партнера."}, {"id": "Негайно_зупиняйтеся,_коли_час_вичерпано.", "title": "Негайно зупиняйтеся, коли час вичерпано.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_093_86._Stop_promptly_when_you_re_out_of_time..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n86. Негайно зупиняйтеся, коли час вичерпано. Коли запалить червоне світло або коли вам іншим чином повідомлять, що ваш час вичерпано, виділіть не більше п’яти-десяти секунд, щоб завершити речення та підготуватися до того, щоб сісти."}, {"id": "Цінуй_простоту.", "title": "Цінуй простоту.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_100_93._Treasure_simplicity..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n93. Цінуйте простоту. Висловлюйте свої ідеї прямо, без зайвих обхідних шляхів — простими словами."}, {"id": "Дізнайтеся,_як_використовувати_та_як_відповідати_на_друковані_заяви_amicus_curiae.", "title": "Дізнайтеся, як використовувати та як відповідати на друковані заяви amicus curiae.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_044_38._Learn_how_to_use_and_how_to_respond_to_amicus_brief.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 3\n\n38. Навчіться користуватись і реагувати на довідкові (amicus) листки. Головна перевага створення або уточнення права шляхом законодавства полягає в тому, що теоретично — і на практиці, якщо це робиться правильно — усі зацікавлені сторони можуть виразити свою думку."}, {"id": "Якщо_ви_є_апелянтом,_починайте_зі_свого_найсильнішого_аргументу.", "title": "Якщо ви є апелянтом, починайте зі свого найсильнішого аргументу.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_088_81._If_you_re_the_appellant_lead_with_your_strength..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n81. Якщо ви є апелянтом, починайте зі свого найсильнішого аргументу. Тоді як у письмовому брифі часто буває необхідно надати перше місце логічно передуючим пунктам, під час усної аргументації вам цього робити не потрібно."}, {"id": "Встановіть_часові_межі_для_етапів_вашої_роботи.", "title": "Встановіть часові межі для етапів вашої роботи.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_037_31._Set_timelines_for_the_stages_of_your_work..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n31. Встановіть графіки етапів вашої роботи. Існує кілька етапів написання: розробка та збір ідей; їх упорядкування в плані; створення чернетки; «охолодження» тексту; його перегляд; а також редагування і повторне редагування готового продукту."}, {"id": "Дивіться_суддям_у_вічі._Встановіть_контакт.", "title": "Дивіться суддям у вічі. Встановіть контакт.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_096_89._Look_the_judges_in_the_eye._Connect..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n89. Дивіться суддям у вічі. Встановлюйте контакт."}, {"id": "Не_надмірно_використовуйте_курсив;_не_використовуйте_жирний_шрифт,_крім_заголовків;_не_використовуйт", "title": "Не надмірно використовуйте курсив; не використовуйте жирний шрифт, крім заголовків; не використовуйте підкреслення взагалі.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_053_47._Don_t_overuse_italics_don_t_use_bold_type_except_in.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n47. Не зловживайте курсивом; не використовуйте напівжирний шрифт, крім заголовків; не підкреслюйте взагалі. Використовуйте курсив для наголошення, але робіть це економно."}, {"id": "Повідомити_суд_про_значну_нову_правову_основу.", "title": "Повідомити суд про значну нову правову основу.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_119_112._Advise_the_court_of_significant_new_authority..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n112. Повідомте суд про суттєву нову правову авторитетність. Коли аргументація завершена, а справа перебуває на розгляді, ваша робота ще не закінчена."}, {"id": "Створіть_гарне_перше_враження._Одягайтеся_відповідно_до_ситуації_та_поводьтеся_з_гідністю.", "title": "Створіть гарне перше враження. Одягайтеся відповідно до ситуації та поводьтеся з гідністю.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_080_73._Make_a_good_first_impression._Dress_appropriately_a.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n73. Залиште гарне перше враження. Одягайтеся відповідно до ситуації та поводьтеся з гідністю."}, {"id": "Ніколи_не_хвали_питання.", "title": "Ніколи не хвали питання.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_113_106._Never_praise_a_question..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n106. Ніколи не хваліть запитання. Ніколи — ніколи — не ставтеся знисходливо до судді, добровільно заявляючи: «Це дуже гарне запитання»."}, {"id": "Вивчайте_справи.", "title": "Вивчайте справи.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia
