 події явно недоступні, будь-які ..."}, {"id": "Титул,_вихідні_дані_та_зміст_Title,_Copyright_&_Contents", "title": "Титул, вихідні дані та зміст (Title, Copyright & Contents)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_001_Title_Copyright_and_Contents.md"], "summary": "Едвард Деймер Видання: Шосте видання Видавництво: Wadsworth, Cengage Learning (2009) ISBN-13: 978-0-495-09506-4 / ISBN-10: 0-495-09506-0 [Порожня сторінка або зображення] КРИТИКА ХИБНИХ МІРКУВАНЬ. Практичний посібник з безпомилкової аргументації Шосте видання. Едвард Деймер Коледж Еморі та Генрі Австралія • Канада • Мексика • Сінгапур Іспанія • Велика Британія • Сполучені Штати Атака на хибні мірк..."}, {"id": "Атаки_на_особистість_Ad_Hominem_огляд_Ad_Hominem_Fallacies_Overview", "title": "Атаки на особистість (Ad Hominem): огляд (Ad Hominem Fallacies: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_093_Ch9_Ad_Hominem_Overview.md"], "summary": "Помилки критерію спростування · **Сторінки:** 211-212\n\nПомилки ad hominem (апеляції до особи) Аргумент ad hominem — це аргумент, спрямований «до особи». Помилки в цьому розділі не відповідають вимозі ефективного спростування, оскільки несправедливо атакують критика власного аргументу замість того, щоб звертатися до його критики чи наведених контрдоказів. Це може відбуватися шляхом особистих або об..."}, {"id": "Критика_логічних_помилок_та_правила_гри_з_помилками_Attacking_the_Fallacy_&_Rules", "title": "Критика логічних помилок та правила гри з помилками (Attacking the Fallacy & Rules)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_018_Ch4_Attacking_the_Fallacy_and_Rules.md"], "summary": "Як атакувати помилки · **Сторінки:** 68-74\n\nКритика логічних помилок. Існує низка стратегій, які можна застосовувати для критики хибних міркувань щоразу, коли ви з ними стикаєтеся. Конкретні стратегії для окремих логічних помилок наведено в наступних розділах цієї книги; однак два методи критики заслуговують на особливу увагу."}, {"id": "Denying_the_Antecedent_Заперечення_антецедента", "title": "Denying the Antecedent (Заперечення антецедента)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_031_Ch5_07_Denying_the_Antecedent.md"], "summary": "Помилки структурного критерію · **Сторінки:** 90-91\n\nЗаперечення антецедента. Заперечення антецедента (попереднього члена) умовного судження з подальшим висновком про заперечення консеквента (наступного члена). В умовному судженні (висловлюванні типу «якщо..., то...») частина речення, яка йде після «якщо», називається антецедентом (попередником або умовою), а частина, яка йде після «то», називаєть..."}, {"id": "Помилки_контрдоказів_огляд_Fallacies_of_Counterevidence_Overview", "title": "Помилки контрдоказів: огляд (Fallacies of Counterevidence: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_089_Ch9_Counterevidence_Overview.md"], "summary": "Помилки критерію спростування · **Сторінки:** 206-207\n\nГлава 9. Помилки, що порушують критерій спростування. Ця глава має допомогти вам: Своїми словами визначити або описати істотні риси кожної з названих помилок, які порушують критерій спростування доброго аргументу."}, {"id": "Помилки_відсутності_доказів_огляд_Fallacies_of_Missing_Evidence_Overview", "title": "Помилки відсутності доказів: огляд (Fallacies of Missing Evidence: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_071_Ch8_Missing_Evidence_Overview.md"], "summary": "Помилки критерію достатності · **Сторінки:** 173-174\n\nГлава 8: Помилки, що порушують критерій достатності. Ця глава допоможе вам: - Визначити або описати власними словами сутнісні риси кожної з пойменованих помилок, які порушують критерій достатності хорошого аргументу. - Розпізнавати, називати та пояснювати хибну модель міркування в кожній із цих помилок, коли вони трапляються в повсякденному мов..."}, {"id": "Incompatible_Premises_Несумісні_засновки", "title": "Incompatible Premises (Несумісні засновки)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 16, "sources": ["Clippings/attaking_json-segments/segment_027_Ch5_05_Incompatible_Premises.md"], "summary": "Помилки структурного критерію · **Сторінки:** 85-87\n\nНесумісні засновки. Висновок, що робиться з несумісних або невідповідних засновок. Аргумент, що використовує засновки, які не є взаємно сумісними, не може функціонувати як хороший аргумент, оскільки не може привести людину до прийнятного або істинного висновку."}, {"id": "Принципи_утримання_від_судження_та_розв'язання_спору_Suspension_of_Judgment_&_Resolution", "title": "Принципи утримання від судження та розв'язання спору (Suspension of Judgment & Resolution)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_015_Ch3_Suspension_of_Judgment_and_Resolution.md"], "summary": "Що таке хороший аргумент? · **Сторінки:** 61-63\n\nПринцип утримання від судження. Якщо жодна позиція не захищена добрим аргументом, або якщо дві й більше позицій здаються захищеними з однаковою силою, у більшості випадків слід утриматися від судження щодо питання."}, {"id": "Тягар_доведення_та_стандартна_форма_аргументу_Burden_of_Proof_&_Standard_Form", "title": "Тягар доведення та стандартна форма аргументу (Burden of Proof & Standard Form)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_008_Ch2_Burden_of_Proof_and_Standard_Form.md"], "summary": "Що таке аргумент? · **Сторінки:** 28-32\n\nПринцип тягара доведення. Тягар доведення будь‑якої позиції зазвичай лежить на учаснику, який її викладає."}, {"id": "Помилки_несумісності_огляд_Fallacies_of_Inconsistency_Overview", "title": "Помилки несумісності: огляд (Fallacies of Inconsistency: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 3, "sources": ["Clippings/attaking_json-segments/segment_026_Ch5_Inconsistency_Overview.md"], "summary": "Помилки структурного критерію · **Сторінки:** 85\n\nПомилки несумісності. Той, хто намагається висунути аргумент, що є самосуперечливим, вчиняє помилку несумісності. Якщо аргумент є самосуперечливим, то між його частинами існує несумісність або несумісність, і, отже, аргумент має структурний дефект."}, {"id": "Ціннісні_аргументи_моральні,_правові_та_естетичні_Moral,_Legal,_and_Aesthetic_Arguments", "title": "Ціннісні аргументи: моральні, правові та естетичні (Moral, Legal, and Aesthetic Arguments)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_010_Ch2_Moral_Legal_Aesthetic_Arguments.md"], "summary": "Що таке аргумент? · **Сторінки:** 36-41\n\nМоральні аргументи. Ми вже зазначали, що моральні питання схильні до дедуктивної форми аргументу, що означає, що моральні аргументи можна розглядати як одні з найсильніших аргументів."}, {"id": "Помилки_передрішення_підстави_огляд_Begging-the-Question_Fallacies_Overview", "title": "Помилки передрішення підстави: огляд (Begging-the-Question Fallacies: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_020_Ch5_Begging_the_Question_Overview.md"], "summary": "Помилки структурного критерію · **Сторінки:** 75-76\n\nРозділ 5: Логічні помилки, що порушують структурний критерій. Цей розділ має допомогти вам: - визначити або описати власними словами суттєві ознаки кожної названої логічної помилки, що порушує структурний критерій доброго міркування; - розпізнавати, називати та пояснювати хибний шаблон міркування в кожній із цих помилок, коли ви стикаєтеся з нею..."}, {"id": "Illicit_Contrast_Незаконний_контраст", "title": "Illicit Contrast (Незаконний контраст)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_055_Ch7_25_Illicit_Contrast.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 141-142\n\nНеправильний контраст. Ця логічна помилка полягає у тому, що слухач, а не спікер, неправильно наголошує на слові або фразі у висловлюванні спікера, що призводить до виведення пов’язаної, але не висловленої, контрастної позиції. Ця помилка дуже схожа на помилку помилкової двозначності, коли слухач або читач інтерпретує твердження так, як це не ..."}, {"id": "Genetic_Fallacy_Генетична_помилка", "title": "Genetic Fallacy (Генетична помилка)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_038_Ch6_12_Genetic_Fallacy.md"], "summary": "Помилки релевантності · **Сторінки:** 106-108\n\nГенетична помилка. Оцінювання предмета, ідеї чи явища крізь призму їхнього раннього контексту або походження з подальшим перенесенням цієї оцінки на цей предмет у теперішньому часі за одночасного ігнорування суттєвих змін, які могли змінити його природу за цей період. Ті, хто припускається генетичної помилки, намагаються звести значення ідеї, людини, ..."}, {"id": "Omission_of_Key_Evidence_Замовчування_ключових_доказів", "title": "Omission of Key Evidence (Замовчування ключових доказів)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_078_Ch8_44_Omission_of_Key_Evidence.md"], "summary": "Помилки критерію достатності · **Сторінки:** 186-188\n\nЗамовчування ключових доказів. Побудова аргументу, в якому не враховано ключові свідчення, що мають вирішальне значення для підтримки висновку. Критерій достатності хорошого аргументу порушується, мабуть, найбільш очевидно тоді, коли вирішальні чи ключові докази, необхідні для підтримки висновку, просто відсутні в засновках аргументу."}, {"id": "Вправи_до_Глави_4_Assignments_What_Is_a_Fallacy", "title": "Вправи до Глави 4 (Assignments: What Is a Fallacy?)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_019_Ch4_Assignments.md"], "summary": "Що таке логічна помилка (софізм)? · **Сторінки:** 74-75\n\nЗавдання. Пригадайте недавню розмову, у якій ви брали участь, або лекцію чи промову, яку ви чули, і в якій доповідач зробив, на вашу думку, логічну помилку."}, {"id": "Wishful_Thinking_Видавання_бажаного_за_дійсне", "title": "Wishful Thinking (Видавання бажаного за дійсне)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_066_Ch7_34_Wishful_Thinking.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 159-161\n\nВидавання бажаного за дійсне. Припущення про те, що якщо людина бажає, аби щось було істинним, то воно є або буде істинним. І навпаки: припущення, що якщо людина не хоче, аби щось було істинним, то воно не є або не буде істинним."}, {"id": "Покажчик", "title": "Покажчик", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_109_Index.md"], "summary": "П О К А Ж Ч И К. Метод абсурдного контрприкладу (Absurd counterexample method), 57 – 60 Образливий ad hominem (Abusive ad hominem), 55, 199 – 200 Акцент, оманливий (Accent, misleading), 126 – 128 Прийнятності критерій (Acceptability criterion), 33 – 36 принцип, 8, 33, 120 стандарти прийнятності засновку, 34 – 35 Софізми неприйнятного засновку (Acceptable premise, fallacies of) софізми мовної плута..."}, {"id": "Attacking_a_Straw_Man_Атака_на_«солом'яне_опудало»", "title": "Attacking a Straw Man (Атака на «солом'яне опудало»)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_099_Ch9_57_Attacking_a_Straw_Man.md"], "summary": "Помилки критерію спростування · **Сторінки:** 217-219\n\nАтака на «солом'яне опудало» (Attacking a Straw Man) Визначення. Спотворення позиції чи аргументу опонента, зазвичай з метою полегшити атаку на них. «Солом'яне опудало» — це метафора, яка описує карикатуру на аргумент опонента, якою недобросовісний сперечальник підміняє реальний оригінал із плоті й крові."}, {"id": "Вправи_до_Глави_10_Assignments_Writing_the_Argumentative_Essay", "title": "Вправи до Глави 10 (Assignments: Writing the Argumentative Essay)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_106_Ch10_Assignments.md"], "summary": "Написання аргументативного есе · **Сторінки:** 236-237\n\nВправи. Напишіть аргументативне есе обсягом у дві-три сторінки відповідно до рекомендацій, викладених у цій главі. Есе має виражати вашу особисту позицію щодо актуального суперечливого питання."}, {"id": "Вправи_Помилки_контрдоказів_Assignments_Counterevidence", "title": "Вправи: Помилки контрдоказів (Assignments: Counterevidence)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_092_Ch9_Assignments_Counterevidence.md"], "summary": "Помилки критерію спростування · **Сторінки:** 210-211\n\nВправи. Помилки контрдоказів. Для кожного з наведених нижче аргументів: (1) визначте тип проілюстрованої помилки контрдоказів та (2) поясніть, як саме міркування порушує критерій спростування."}, {"id": "Using_the_Wrong_Reasons_Використання_неналежних_підстав", "title": "Using the Wrong Reasons (Використання неналежних підстав)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_041_Ch6_15_Using_the_Wrong_Reasons.md"], "summary": "Помилки релевантності · **Сторінки:** 112-114\n\nВикористання неналежних підстав. Спроба обґрунтувати певне твердження (тезу) підставами (засновками), відмінними від тих, які є належними та релевантними для цього твердження. Цю логічну помилку найкраще охарактеризувати як дзеркальне відображення помилки виведення неправильного висновку (non sequitur)."}, {"id": "Процедурний_та_етичний_стандарт_дискусії_An_Effective_Procedural_&_Ethical_Standard", "title": "Процедурний та етичний стандарт дискусії (An Effective Procedural & Ethical Standard)", "type": "rule", "domain": "fallacy_theory", "cluster": "Argumentation Principles & Ethics", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_004_Ch1_Procedural_and_Ethical_Standard.md"], "summary": "Кодекс інтелектуальної поведінки · **Сторінки:** 18-21\n\nРозділ 1: Код інтелектуальної поведінки. Цей розділ допоможе вам: - Участь у раціональній дискусії з іншими способом, що більш ймовірно призведе до ефективного вирішення спорної проблеми. - Усвідомити важливість визнавання власної помилковості та відкритості до нових розумінь як перших кроків до досягнення більш захищеної позиції щодо супереч..."}, {"id": "Вправи_до_Глави_2_Assignments_What_Is_an_Argument", "title": "Вправи до Глави 2 (Assignments: What Is an Argument?)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_011_Ch2_Assignments.md"], "summary": "Що таке аргумент? · **Сторінки:** 41-43\n\nЗавдання. Знайдіть приклад міркування і поясніть, чому це міркування, а не лише думка."}, {"id": "Two-Wrongs_Fallacy_Tu_Quoque_Два_зла_«Сам_такий»", "title": "Two-Wrongs Fallacy / Tu Quoque (Два зла / «Сам такий»)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_096_Ch9_56_Two_Wrongs_Fallacy.md"], "summary": "Помилки критерію спростування · **Сторінки:** 214-216\n\nПомилка «два зла» / Tu Quoque (Two-Wrongs Fallacy) Визначення. Відкидання критики свого аргументу чи дій через звинувачення критика або інших людей у тому, що вони мислять або діють подібним чином. Латинська назва цієї помилки, tu quoque, перекладається як «ти також [це робиш]»."}, {"id": "Causal_Oversimplification_Каузальне_надмірне_спрощення", "title": "Causal Oversimplification (Каузальне надмірне спрощення)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_082_Ch8_46_Causal_Oversimplification.md"], "summary": "Помилки критерію достатності · **Сторінки:** 191-193\n\nКаузальне надмірне спрощення. Надмірне спрощення причинних передумов події шляхом виокремлення факторів, які є недостатніми для пояснення розглядуваного явища, або шляхом надмірного перебільшення ролі одного чи кількох із цих факторів. У поясненні причин поширеною практикою є вказати на найбільш очевидну попередню подію й проголосити її єдиною ..."}, {"id": "Question-Begging_Language_Упереджена_мова,_що_передрішає_відповідь", "title": "Question-Begging Language (Упереджена мова, що передрішає відповідь)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_022_Ch5_02_Question_Begging_Language.md"], "summary": "Помилки структурного критерію · **Сторінки:** 78-80\n\nМова, що передбачає питання. Обговорення питання за допомогою мови, яка передбачає позицію щодо самого питання, таким чином, щоб спрямувати слухача до того самого висновку. Той, хто вчиняє логічну помилку мови, що передбачає питання, передчасно припускає, чи то навмисно, чи то необережно, що невирішене питання вже вирішене."}, {"id": "Argument_by_Innuendo_Аргумент_через_інсинуацію_натяк", "title": "Argument by Innuendo (Аргумент через інсинуацію / натяк)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_056_Ch7_26_Argument_by_Innuendo.md"], "summary": "Помилки прийнятності · **Сторінки:** 142-144\n\nАргумент через інсинуацію (натяк) Визначення. Схиляння іншої людини до певного, зазвичай принизливого або компрометуючого висновку за допомогою майстерного підбору слів, який імпліцитно натякає на цей висновок, проте прямо його не стверджує. Сила цієї логічної помилки полягає у створенні враження, ніби якесь завуальоване твердження є істинним, хоча для..."}, {"id": "Appeal_to_Irrelevant_Authority_Апеляція_до_некомпетентного_авторитету", "title": "Appeal to Irrelevant Authority (Апеляція до некомпетентного авторитету)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 15, "sources": ["Clippings/attaking_json-segments/segment_044_Ch6_16_Appeal_to_Irrelevant_Authority.md"], "summary": "Помилки критерію релевантності · **Сторінки:** 115-117\n\nАпеляція до нерелевантного авторитету. Спроба підтвердити твердження шляхом покликання на судження особи, яка не є авторитетом у даній галузі, судження неідентифікованого авторитету або судження авторитету, який, імовірно, упереджений. Авторитетом у певній галузі є особа, яка має доступ до знань, які вона приписує собі, має кваліфікацію (за о..."}, {"id": "Поняття_аргументу_та_відмінність_від_думки_Argument_vs._Opinion", "title": "Поняття аргументу та відмінність від думки (Argument vs. Opinion)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_007_Ch2_Argument_vs_Opinion.md"], "summary": "Що таке аргумент? · **Сторінки:** 26-28\n\nChapter 2: What Is an Argument? - Відрізнити аргумент від думки (або недоводу) при зустрічі з письмовим чи усним матеріалом і визначити, хто несе тягар доведення в аргументативному контексті."}, {"id": "Fallacy_of_the_Mean_Помилка_золотого_перетину_компромісу", "title": "Fallacy of the Mean (Помилка золотого перетину / компромісу)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_068_Ch7_36_Fallacy_of_the_Mean.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 163-164\n\nПомилка золотого перетину. Припущення про те, що поміркована або середня позиція між двома крайнощами обов'язково є найкращою чи правильною просто тому, що вона є середньою. Інша назва цього хибного міркування — помилка поміркованості."}, {"id": "Ignoring_the_Counterevidence_Ігнорування_контрдоказів", "title": "Ignoring the Counterevidence (Ігнорування контрдоказів)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_091_Ch9_53_Ignoring_the_Counterevidence.md"], "summary": "Помилки критерію спростування · **Сторінки:** 208-210\n\nІгнорування контрдоказів (Ignoring the Counterevidence) Визначення. Ведення аргументації таким чином, що ігнорує чи опускає будь-які посилання на важливі докази, несприятливі для власної позиції, створюючи оманливе враження, ніби вагомих доказів проти неї не існує. Нікому з нас не подобається програвати напружену тенісну партію, особливо якщо ..."}, {"id": "Faulty_Analogy_Хибна_аналогія", "title": "Faulty Analogy (Хибна аналогія)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 16, "sources": ["Clippings/attaking_json-segments/segment_069_Ch7_37_Faulty_Analogy.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 164-167\n\nХибна аналогія. Припущення про те, що оскільки дві речі схожі в одному або кількох відношеннях, вони обов'язково подібні і в якомусь іншому важливому відношенні, без урахування незначущості їхніх подібностей та/або суттєвості їхніх відмінностей. Той, хто міркує за аналогією, зазвичай порівнює річ, щодо якої існує суперечка, з іншою річчю, яка ..."}, {"id": "Is-Ought_Fallacy_Помилка_належного_з_сущого_гільйотина_Юма", "title": "Is-Ought Fallacy (Помилка належного з сущого / гільйотина Юма)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_065_Ch7_33_Is_Ought_Fallacy.md"], "summary": "Помилки прийнятності · **Сторінки:** 158-159\n\nПомилка переходу від сущого до належного (Is-Ought Fallacy / Гільйотина Юма) Визначення. Припущення про те, що оскільки щось зараз є усталеною практикою, воно обов'язково повинно бути практикою. І навпаки: припущення про те, що оскільки щось зараз не практикується, воно й не повинно практикуватися."}, {"id": "Post_Hoc_Fallacy_Помилка_«Після_цього_—_отже,_з_причини_цього»", "title": "Post Hoc Fallacy (Помилка «Після цього — отже, з причини цього»)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 15, "sources": ["Clippings/attaking_json-segments/segment_083_Ch8_47_Post_Hoc_Fallacy.md"], "summary": "Помилки критерію достатності · **Сторінки:** 193-195\n\nПомилка «Після цього — отже, з причини цього» Визначення. Припущення про те, що певна подія B спричинена іншою подією A, просто тому, що B настає після A в часі. Встановлення часової послідовності однієї події перед іншою не є достатньою умовою для висновку про причинний зв'язок між ними."}, {"id": "Fallacy_of_Popular_Wisdom_Помилка_народної_мудрості_прислів'їв", "title": "Fallacy of Popular Wisdom (Помилка народної мудрості / прислів'їв)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_076_Ch8_42_Fallacy_of_Popular_Wisdom.md"], "summary": "Помилки критерію достатності · **Сторінки:** 182-184\n\nПомилка народної мудрості. Апеляція до ідей, висловлених в афоризмах чи кліше, народній мудрості або так званому «здоровому глузді», замість наведення релевантних доказів на користь твердження. Ця помилка зазвичай має вигляд використання кліше чи афоризму як засновку в аргументі так, ніби це реальний доказ, без будь-якого обґрунтування надійнос..."}, {"id": "Вправи_Помилки_дедуктивного_висновку_Assignments_Deductive_Inference", "title": "Вправи: Помилки дедуктивного висновку (Assignments: Deductive Inference)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_036_Ch5_Assignments_Deductive_Inference.md"], "summary": "Помилки структурного критерію · **Сторінки:** 100-104\n\nВправи. Помилки дедуктивного висновку Для кожного з наведених нижче аргументів: (1) визначте, яку помилку дедуктивного висновку проілюстровано, і (2) поясніть, у чому саме міркування порушує структурний критерій. Тут наведено по два приклади для кожної з логічних помилок, розглянутих у цьому розділі."}, {"id": "Confusion_of_Cause_and_Effect_Змішування_причини_і_наслідку", "title": "Confusion of Cause and Effect (Змішування причини і наслідку)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 15, "sources": ["Clippings/attaking_json-segments/segment_084_Ch8_48_Confusion_of_Cause_and_Effect.md"], "summary": "Помилки критерію достатності · **Сторінки:** 195-196\n\nЗмішування причини і наслідку. Прийняття причини за наслідок або наслідку за причину певної події. Коли Опудало просить у Чарівника країни Оз мізки, Чарівник відповідає, що не може дати йому мізки, але може вручити диплом Канзаського університету."}, {"id": "Помилки_відволікання_уваги_огляд_Fallacies_of_Diversion_Overview", "title": "Помилки відволікання уваги: огляд (Fallacies of Diversion: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 5, "sources": ["Clippings/attaking_json-segments/segment_098_Ch9_Diversion_Overview.md"], "summary": "Помилки критерію спростування · **Сторінки:** 217\n\nПомилки відволікання уваги. Помилки в цьому розділі не задовольняють критерій спростування тим, що в різні способи намагаються відвернути увагу від слабкості власного аргументу, сили критики чи аргументу опонента, або від того й іншого разом. Ці прийоми аргументації допомагають зайняти вигіднішу або менш незручну позицію, зміщуючи фокус уваги зі с..."}, {"id": "Етапи_написання_аргументативного_есе_Steps_in_Writing_the_Argumentative_Essay", "title": "Етапи написання аргументативного есе (Steps in Writing the Argumentative Essay)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_104_Ch10_Steps_in_Writing_Argumentative_Essay.md"], "summary": "Написання аргументативного есе · **Сторінки:** 229-233\n\nГлава 10. Написання аргументативного есе. Ця глава має допомогти вам: Зрозуміти та активно застосовувати базові етапи написання розлогого аргументативного есе."}, {"id": "Distinction_Without_a_Difference_Розрізнення_без_відмінності", "title": "Distinction Without a Difference (Розрізнення без відмінності)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_058_Ch7_28_Distinction_Without_a_Difference.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 147-148\n\nРізниця без різниці. Спроба захистити певну дію чи позицію, заявляючи про її відмінність від іншої, з якою її можна сплутати, за допомогою ретельного розмежування в мові, тоді як захищена дія чи позиція за своєю суттю нічим не відрізняється від тієї, від якої її мовно відокремлюють. Найімовірнішою причиною виникнення цієї логічної помилки є ба..."}, {"id": "Fallacy_of_the_Continuum_Помилка_континууму_бороди", "title": "Fallacy of the Continuum (Помилка континууму / бороди)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_061_Ch7_29_Fallacy_of_the_Continuum.md"], "summary": "Помилки прийнятності · **Сторінки:** 150-153\n\nПомилка континууму (Софізм бороди) Визначення. Припущення про те, що незначні зміни або відмінності на континуумі між певною річчю та її протилежністю мають незначний ефект, і що проведення чітких розмежувань між точками на цій шкалі є неможливим або принаймні свавільним. Необґрунтоване припущення, що лежить в основі цієї помилки, є дуже поширеним, і п..."}, {"id": "Помилки_дедуктивного_висновку_огляд_Fallacies_of_Deductive_Inference_Overview", "title": "Помилки дедуктивного висновку: огляд (Fallacies of Deductive Inference: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_030_Ch5_Deductive_Inference_Overview.md"], "summary": "Помилки структурного критерію · **Сторінки:** 89-90\n\nСофізми дедуктивного виведення. Софізми дедуктивного виведення порушують одне з добре встановлених правил дедуктивного міркування. Існує багато таких дедуктивних логічних помилок, проте ми вирішили розглядати лише найчастіше вчинювані."}, {"id": "Red_Herring_Копчений_оселедець_Відволікання_теми", "title": "Red Herring (Копчений оселедець / Відволікання теми)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_101_Ch9_59_Red_Herring.md"], "summary": "Помилки критерію спростування · **Сторінки:** 221-223\n\n«Копчений оселедець» / Відволікання уваги (Red Herring) Визначення. Спроба приховати слабкість позиції шляхом переведення уваги зі справжньої проблеми на побічне питання. Одне з пояснень дивної назви цієї помилки пов'язане з полюванням на лисиць."}, {"id": "Gambler's_Fallacy_Помилка_гравця", "title": "Gambler's Fallacy (Помилка гравця)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_087_Ch8_51_Gamblers_Fallacy.md"], "summary": "Помилки критерію достатності · **Сторінки:** 199-201\n\nПомилка гравця. Твердження про те, що оскільки випадкова подія мала певну серію повторень у минулому, ймовірність її настання в майбутньому суттєво змінилася. Цієї помилки зазвичай припускаються азартні гравці, які помилково вважають, що шанси на виграш зростають або суттєво змінюються на їхню користь через певну серію подій у безпосередньому м..."}, {"id": "Помилки_необґрунтованого_припущення_огляд_Unwarranted_Assumption_Fallacies_Overview", "title": "Помилки необґрунтованого припущення: огляд (Unwarranted Assumption Fallacies: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_060_Ch7_Unwarranted_Assumption_Overview.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 149-150\n\nПомилки необґрунтованих припущень. Міркування, розглянуті в цьому розділі, є хибними, оскільки їхні засновки спираються на надзвичайно сумнівні, хоча іноді й поширені, припущення. Зазвичай ці припущення є імпліцитними або невисловленими, але водночас критично важливими для переконливості аргументу."}, {"id": "Neglect_of_a_Common_Cause_Ігнорування_спільної_причини", "title": "Neglect of a Common Cause (Ігнорування спільної причини)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 15, "sources": ["Clippings/attaking_json-segments/segment_085_Ch8_49_Neglect_of_a_Common_Cause.md"], "summary": "Помилки критерію достатності · **Сторінки:** 196-198\n\nІгнорування спільної причини. Невміння або небажання визнати, що дві зовні пов'язані події можуть взагалі не бути причинно пов'язаними між собою, а є спільними наслідками третьої причини. Коли дві події спостерігаються разом у тому, що видається причинним зв'язком, ми схильні вважати, що одна з них є причиною, а друга — наслідком."}, {"id": "Вступ_Навіщо_вивчати_логіку_та_цілі_посібника_Introduction_Studying_Logic_&_Goals", "title": "Вступ: Навіщо вивчати логіку та цілі посібника (Introduction: Studying Logic & Goals)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_003_Introduction_Studying_Logic_and_Goals.md"], "summary": "Вивчення логіки. Схоже, що дуже мало людей справді зацікавлені у вивченні логіки, оскільки, як зазначав філософ Чарльз Пірс багато років тому, кожна людина «вважає себе вже досить вправною в мистецтві міркування». Варто, однак, відзначити, що ми, ці «вправні» мислителі, рідко визнаємо подібну вправність у інших."}, {"id": "Insufficient_Sample_Недостатня_вибірка_поспішне_узагальнення", "title": "Insufficient Sample (Недостатня вибірка / поспішне узагальнення)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 15, "sources": ["Clippings/attaking_json-segments/segment_072_Ch8_38_Insufficient_Sample.md"], "summary": "Помилки критерію достатності · **Сторінки:** 174-176\n\nНедостатня вибірка. Формулювання висновку чи узагальнення на основі занадто малої вибірки випадків. Свідчення, що використовуються у випадку недостатньої вибірки, зазвичай є прийнятними й релевантними, але їх замало для встановлення висновку аргументу."}, {"id": "False_Conversion_Хибне_навернення_хибна_конверсія", "title": "False Conversion (Хибне навернення / хибна конверсія)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_033_Ch5_09_False_Conversion.md"], "summary": "Помилки структурного критерію · **Сторінки:** 93-95\n\nХибна конверсія. Перевертання передумови та наслідку умовного вислову або обмін предмета і підмета в універсальному позитивному вислові, а потім висновок, що ці конвертовані вислови зберігають свою оригінальну істинність. Аргумент, у якому засновок є умовним висловом «якщо, то», а висновок перевертає передумову з наслідком того вислову, порушує ..."}, {"id": "Вправи_Помилки_несумісності_Assignments_Inconsistency", "title": "Вправи: Помилки несумісності (Assignments: Inconsistency)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_029_Ch5_Assignments_Inconsistency.md"], "summary": "Помилки структурного критерію · **Сторінки:** 89\n\nЗавдання. Помилки несумісності Для кожного з наведених нижче міркувань: (1) визначте тип ілюстрованої несумісності та (2) поясніть, як міркування порушує структурний критерій. Для кожної з обговорених у цьому розділі помилок наведено два приклади."}, {"id": "Undistributed_Middle_Term_Нерозподілений_середній_термін", "title": "Undistributed Middle Term (Нерозподілений середній термін)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_034_Ch5_10_Undistributed_Middle_Term.md"], "summary": "Помилки структурного критерію · **Сторінки:** 95-98\n\nНерозподілений середній термін. Формулювання висновку в силогізмі, у засновках якого середній термін не є розподіленим принаймні один раз. Щоб зрозуміти та розпізнати цю, а також наступну поширену дедуктивну помилку, вам необхідно знати кілька речей про силогістичне міркування: структуру силогізму, чотири типи суджень, які використовуються в сил..."}, {"id": "Порушення_критеріїв,_нова_теорія_та_класифікація_помилок_Theory_&_Organization_of_Fallacies", "title": "Порушення критеріїв, нова теорія та класифікація помилок (Theory & Organization of Fallacies)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_017_Ch4_Theory_and_Organization_of_Fallacies.md"], "summary": "Що таке логічна помилка (софізм)? · **Сторінки:** 64-68\n\nРозділ 4: Що таке логічна помилка? Цей розділ допоможе вам: Зрозуміти логічну помилку як порушення одного з п’яти критеріїв хорошого міркування, щоб у дискусії завжди зосереджувались на побудові якісних аргументів."}, {"id": "Глосарій_логічних_помилок_Glossary_of_Fallacies", "title": "Глосарій логічних помилок (Glossary of Fallacies)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_107_Glossary_of_Fallacies.md"], "summary": "ГЛОСАРІЙ ЛОГІЧНИХ ПОМИЛОК. Апеляція до сили або погрози. Сила або погроза, апеляція до."}, {"id": "Вправи_Помилки_нерелевантної_апеляції_Assignments_Irrelevant_Appeal", "title": "Вправи: Помилки нерелевантної апеляції (Assignments: Irrelevant Appeal)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_050_Ch6_Assignments_Irrelevant_Appeal.md"], "summary": "Помилки релевантності · **Сторінки:** 128-132\n\nВправи. Помилки нерелевантної апеляції Для кожного з наведених нижче аргументів: (1) визначте тип проілюстрованої нерелевантної емоційної апеляції та (2) поясніть, у чому саме міркування порушує критерій релевантності. Тут наведено по два приклади для кожної логічної помилки, розглянутої в цьому підрозділі."}, {"id": "Вправи_Помилки_відволікання_уваги_Assignments_Diversion", "title": "Вправи: Помилки відволікання уваги (Assignments: Diversion)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_103_Ch9_Assignments_Diversion.md"], "summary": "Помилки критерію спростування · **Сторінки:** 224-229\n\nВправи. Помилки відволікання уваги. Для кожного з наведених нижче аргументів: (1) визначте тип проілюстрованої помилки відволікання уваги та (2) поясніть, як саме міркування порушує критерій спростування."}, {"id": "Вправи_до_Глави_1_Assignments_A_Code_of_Intellectual_Conduct", "title": "Вправи до Глави 1 (Assignments: A Code of Intellectual Conduct)", "type": "rule", "domain": "fallacy_theory", "cluster": "Argumentation Principles & Ethics", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_006_Ch1_Assignments.md"], "summary": "Кодекс інтелектуальної поведінки · **Сторінки:** 25-26\n\nAssignments. Обговоріть деякі перешкоди до впровадження «Кодексу поведінки для ефективної дискусії» як засобу розв’язання конфліктів у нашому практичному житті. Наприклад, чому, на вашу думку, добрі аргументи так рідко змінюють думки людей?"}, {"id": "Affirming_the_Consequent_Ствердження_консеквента", "title": "Affirming the Consequent (Ствердження консеквента)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_032_Ch5_08_Affirming_the_Consequent.md"], "summary": "Помилки структурного критерію · **Сторінки:** 91-93\n\nПідтвердження наслідку. Підтвердження наслідку умовного твердження і потім висновок про підтвердження передумови. Ще один приклад правильно сформованого умовного аргументу називається запереченням наслідку, або modus tollens."}, {"id": "Помилки_мовної_плутанини_огляд_Fallacies_of_Linguistic_Confusion_Overview", "title": "Помилки мовної плутанини: огляд (Fallacies of Linguistic Confusion: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 8, "sources": ["Clippings/attaking_json-segments/segment_051_Ch7_Linguistic_Confusion_Overview.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 133-134\n\nРозділ 7: Помилки, що порушують критерій прийнятності. Цей розділ має допомогти вам: визначити або описати власними словами суттєві ознаки кожної з іменних логічних помилок, що порушують критерій прийнятності хорошого аргументу. Розпізнавати, називати та пояснювати хибний патерн міркування в кожній з цих помилок, коли вони зустрічаються в звич..."}, {"id": "Rationalization_Раціоналізація", "title": "Rationalization (Раціоналізація)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_039_Ch6_13_Rationalization.md"], "summary": "Помилки релевантності · **Сторінки:** 108-110\n\nРаціоналізація. Використання правдоподібних на вигляд, але насправді надуманих (фіктивних) підстав для виправдання певної позиції, яка насправді підтримується з інших, значно менш шляхетних або презентабельних міркувань. Раціоналізацію цілком слушно визначають як порушення критерію релевантності хорошого аргументу, оскільки надумані засновки аргументу..."}, {"id": "Misleading_Accent_Оманливий_акцент_виривання_з_контексту", "title": "Misleading Accent (Оманливий акцент / виривання з контексту)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_054_Ch7_24_Misleading_Accent.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 139-141\n\nМіраж акцентування. Спрямовування іншої особи до необґрунтованого висновку шляхом надання неправильного або нетипового акценту на слові, фразі чи окремому аспекті проблеми чи твердження. Ця логічна помилка іноді вчиняється шляхом вилучення окремих частин висловлювання іншої людини з їхнього первісного контексту таким чином, що це передає непер..."}, {"id": "Drawing_the_Wrong_Conclusion_Хибний_висновок_із_засновків", "title": "Drawing the Wrong Conclusion (Хибний висновок із засновків)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 15, "sources": ["Clippings/attaking_json-segments/segment_040_Ch6_14_Drawing_the_Wrong_Conclusion.md"], "summary": "Помилки критерію релевантності · **Сторінки:** 110-112\n\nВисновок, що не випливає з засновків. Висновок, відмінний від того, який підтверджується доказами, наведеними в аргументі. Логічну помилку «висновок, що не випливає з засновків» часто називають помилкою «промаху від суті», оскільки вона полягає в «промазі від суті доказів»."}, {"id": "Contradiction_Between_Premise_and_Conclusion_Суперечність_між_засновком_і_висновком", "title": "Contradiction Between Premise and Conclusion (Суперечність між засновком і висновком)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 16, "sources": ["Clippings/attaking_json-segments/segment_028_Ch5_06_Contradiction_Premise_Conclusion.md"], "summary": "Помилки структурного критерію · **Сторінки:** 87-89\n\nПротиворечие між засновком і висновком. Аргумент, який формулює висновок, що суперечить хоча б одному із засновок, є неструктурно правильним. Нехто з помилок, які можуть бути присутні в такому аргументі, полягає в тому, що він не відповідає формальній структуру."}, {"id": "Denying_the_Counterevidence_Заперечення_контрдоказів", "title": "Denying the Counterevidence (Заперечення контрдоказів)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_090_Ch9_52_Denying_the_Counterevidence.md"], "summary": "Помилки критерію спростування · **Сторінки:** 207-208\n\nЗаперечення контрдоказів (Denying the Counterevidence) Визначення. Відмова серйозно розглядати або несправедливе применшення сили доказів, висунутих проти власного твердження. Найбільш радикальною формою цієї помилки є небажання визнавати будь-які можливі докази, які могли б свідчити проти власної позиції."}, {"id": "Manipulation_of_Emotions_Маніпуляція_емоціями_жалість,_вина,_страх,_лестощі", "title": "Manipulation of Emotions (Маніпуляція емоціями: жалість, вина, страх, лестощі)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_049_Ch6_21_Manipulation_of_Emotions.md"], "summary": "Помилки релевантності · **Сторінки:** 124-128\n\nМаніпуляція емоціями. Спроба схилити інших до прийняття певної позиції шляхом експлуатації їхніх емоцій замість надання раціональних доказів на користь цієї позиції. Цю помилку іноді називають «грою на публіку» (гра на гальорку, argumentum ad populum / ad passiones)."}, {"id": "Принципи_1-3_Помильність,_пошук_істини_та_ясність_Principles_1-3_Fallibility,_Truth-Seeking,_Clarity", "title": "Принципи 1-3: Помильність, пошук істини та ясність (Principles 1-3: Fallibility, Truth-Seeking, Clarity)", "type": "rule", "domain": "fallacy_theory", "cluster": "Argumentation Principles & Ethics", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_005_Ch1_Principles_1_to_3.md"], "summary": "Кодекс інтелектуальної поведінки · **Сторінки:** 21-25\n\nПринцип помилковості. Кожен учасник дискусії щодо спірного питання має бути готовим прийняти той факт, що він або вона помилкові, що означає, що треба визнати, що власна початкова позиція може не бути найзахищенішою щодо даного питання. Застосування принципу помилковості в дискусії означає свідоме прийняття того, що ви помилкові, тобто що ваш..."}, {"id": "Arguing_from_Ignorance_Аргумент_до_незнання_тягар_доведення", "title": "Arguing from Ignorance (Аргумент до незнання / тягар доведення)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_074_Ch8_40_Arguing_from_Ignorance.md"], "summary": "Помилки критерію достатності · **Сторінки:** 178-181\n\nАргумент до незнання. Доведення істинності (або хибності) твердження на тій підставі, що немає свідчень чи доказів протилежного, або через нездатність чи відмову опонента навести переконливі докази протилежного. Аргумент до незнання — це тактика, яку багато людей використовують для захисту своїх улюблених переконань."}, {"id": "Trivial_Objections_Прискіпування_до_дрібниць", "title": "Trivial Objections (Прискіпування до дрібниць)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_100_Ch9_58_Trivial_Objections.md"], "summary": "Помилки критерію спростування · **Сторінки:** 219-221\n\nПрискіпування до дрібниць (Trivial Objections) Визначення. Атака на позицію опонента шляхом зосередження критичної уваги на незначній деталі чи другорядному пункті аргументу. Найімовірніший час для появи дріб'язкових заперечень — це момент, коли основний аргумент видається дійсно сильним."}, {"id": "Ambiguity_Двозначність_амфіболія", "title": "Ambiguity (Двозначність / амфіболія)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_053_Ch7_23_Ambiguity.md"], "summary": "Помилки прийнятності · **Сторінки:** 136-139\n\nДвозначність (Амфіболія) Визначення. Схиляння іншої людини до необґрунтованого висновку шляхом висловлення твердження або аргументу, у якому використано слово, фразу чи граматичну конструкцію, що допускає два чи більше суттєво різних тлумачень, без уточнення того, яке саме значення мається на увазі. Якщо слухач не знає, яке з двох чи більше значень слі..."}, {"id": "Вправи_Каузальні_помилки_Assignments_Causal_Fallacies", "title": "Вправи: Каузальні помилки (Assignments: Causal Fallacies)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_088_Ch8_Assignments_Causal_Fallacies.md"], "summary": "Помилки критерію достатності · **Сторінки:** 201-206\n\nВправи. Каузальні помилки. Для кожного з наведених нижче аргументів: (1) визначте тип проілюстрованої каузальної помилки, і (2) поясніть, у який спосіб це міркування порушує критерій достатності."}, {"id": "Вправи_Атаки_на_особистість_Assignments_Ad_Hominem", "title": "Вправи: Атаки на особистість (Assignments: Ad Hominem)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_097_Ch9_Assignments_Ad_Hominem.md"], "summary": "Помилки критерію спростування · **Сторінки:** 216-217\n\nВправи. Помилки ad hominem (апеляції до особи). Для кожного з наведених нижче аргументів: (1) визначте тип проілюстрованої помилки ad hominem та (2) поясніть, як саме міркування порушує критерій спростування."}, {"id": "Зразок_аргументативного_есе_Дівоче_прізвище_заміжньої_жінки_Sample_Essay_A_Married_Woman's_Name", "title": "Зразок аргументативного есе: Дівоче прізвище заміжньої жінки (Sample Essay: A Married Woman's Name)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_105_Ch10_Sample_Essay_Married_Woman_Name.md"], "summary": "Написання аргументативного есе · **Сторінки:** 233-236\n\nЗразок аргументативного есе. Наведене нижче аргументативне есе втілює в собі запропоновані вище риси добре побудованого тексту. Це питання, дослідженням якого ми з дружиною займалися дуже ґрунтовно."}, {"id": "Передмова_та_про_автора_Preface_&_About_the_Author", "title": "Передмова та про автора (Preface & About the Author)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_002_Preface_and_About_the_Author.md"], "summary": "Кожне нове видання Attacking Faulty Reasoning дає мені можливість написати кращу книгу про те, що, на мою думку, є життєво важливим у пошуку істини. Зосередженість на логічних помилках постійно нагадує, як часто аргументи йдуть не так і відводять нас від цієї мети. Розвиток навички розпізнавання хибного міркування, коли ми його чуємо, не лише допоможе нам уникнути оман, а й зробить нас ефективними..."}, {"id": "Критерії_релевантності,_прийнятності,_достатності_та_спростування_Relevance,_Acceptability,_Sufficie", "title": "Критерії релевантності, прийнятності, достатності та спростування (Relevance, Acceptability, Sufficiency, Rebuttal)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_013_Ch3_Relevance_Acceptability_Sufficiency_Rebuttal.md"], "summary": "Що таке хороший аргумент? · **Сторінки:** 45-53\n\nПринцип релевантності. Той, хто подає аргумент за чи проти певної позиції, має викладати лише ті засновки, істинність яких надає певні докази на користь істинності висновку."}, {"id": "Помилки_нерелевантної_засновки_огляд_Fallacies_of_Irrelevant_Premise_Overview", "title": "Помилки нерелевантної засновки: огляд (Fallacies of Irrelevant Premise: Overview)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 15, "sources": ["Clippings/attaking_json-segments/segment_037_Ch6_Irrelevant_Premise_Overview.md"], "summary": "Помилки критерію релевантності · **Сторінки:** 105-106\n\nРозділ 6: Помилки, що порушують критерій релевантності. Цей розділ допоможе вам: - Визначити або описати власними словами суттєві особливості кожної названої логічної помилки, що порушує критерій релевантності хорошого аргументу. - Визначити, назвати і пояснити хибний шаблон розумової діяльності у кожній з цих помилок, коли ви зустрічаєте їх ..."}, {"id": "Вправи_Помилки_відсутності_доказів_Assignments_Missing_Evidence", "title": "Вправи: Помилки відсутності доказів (Assignments: Missing Evidence)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_079_Ch8_Assignments_Missing_Evidence.md"], "summary": "Помилки критерію достатності · **Сторінки:** 188-189\n\nВправи. Помилки відсутності доказів. Для кожного з наведених нижче аргументів: (1) визначте тип проілюстрованої помилки відсутності доказів, і (2) поясніть, у який спосіб це міркування порушує критерій достатності."}, {"id": "Вправи_Помилки_нерелевантної_засновки_Assignments_Irrelevant_Premise", "title": "Вправи: Помилки нерелевантної засновки (Assignments: Irrelevant Premise)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 15, "sources": ["Clippings/attaking_json-segments/segment_042_Ch6_Assignments_Irrelevant_Premise.md"], "summary": "Помилки критерію релевантності · **Сторінки:** 114-115\n\nЗавдання. Помилки нерелевантного засновку. Для кожного з наведених нижче аргументів: (1) визначте тип помилки нерелевантного засновку, який ілюструє даний приклад, та (2) поясніть, як міркування порушує критерій релевантності."}, {"id": "П'ять_критеріїв_хорошого_аргументу_та_структурний_принцип_Five_Criteria_&_Structural_Principle", "title": "П'ять критеріїв хорошого аргументу та структурний принцип (Five Criteria & Structural Principle)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_012_Ch3_Five_Criteria_and_Structural_Principle.md"], "summary": "Що таке хороший аргумент? · **Сторінки:** 43-45\n\nРозділ 3: Що таке хороший аргумент? Цей розділ допоможе вам: - визначити, чи є аргумент хорошим, застосовуючи п’ять критеріїв хорошого аргументу до реальних міркувань; - застосовувати умови, за яких раціональна особа повинна вважати засновок прийнятним або неприйнятним; - оволодіти списком перевірених стратегій, які перетворюють слабкі міркування на..."}, {"id": "Вправи_Помилки_мовної_плутанини_Assignments_Linguistic_Confusion", "title": "Вправи: Помилки мовної плутанини (Assignments: Linguistic Confusion)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_059_Ch7_Assignments_Linguistic_Confusion.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 148-149\n\nЗавдання. Помилки лінгвістичної плутанини Для кожного з наведених міркувань (1) визначте тип лінгвістичної плутанини, що проілюстрована, і (2) поясніть, яким чином міркування порушує критерій прийнятності. У цьому розділі розглядаються по два приклади кожної помилки."}, {"id": "Abusive_Ad_Hominem_Образлива_атака_на_опонента", "title": "Abusive Ad Hominem (Образлива атака на опонента)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_094_Ch9_54_Abusive_Ad_Hominem.md"], "summary": "Помилки критерію спростування · **Сторінки:** 212-213\n\nОбразлива атака на опонента (Abusive Ad Hominem) Визначення. Особиста або образлива атака на опонента як спосіб проігнорувати чи дискредитувати його критику або аргумент. Образливий або особистий напад часто набуває форми привертання уваги до якоїсь неприємної особистої характеристики критика."}, {"id": "Appeal_to_Common_Opinion_Апеляція_до_загальної_думки_більшості", "title": "Appeal to Common Opinion (Апеляція до загальної думки / більшості)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_045_Ch6_17_Appeal_to_Common_Opinion.md"], "summary": "Помилки релевантності · **Сторінки:** 117-119\n\nАпеляція до загальної думки. Заклик прийняти певну позицію виключно на тій підставі, що її поділяє велика кількість людей (більшість), або заклик відхилити певну позицію на підставі того, що її поділяє дуже мало людей. Цю помилку також іноді називають апеляцією до натовпу / популярності (argumentum ad populum), помилкою «потяга, що набирає хід» (bandw..."}, {"id": "Confusion_of_Necessary_with_Sufficient_Condition_Змішування_необхідної_та_достатньої_умов", "title": "Confusion of Necessary with Sufficient Condition (Змішування необхідної та достатньої умов)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_081_Ch8_45_Confusion_Necessary_Sufficient.md"], "summary": "Помилки критерію достатності · **Сторінки:** 190-191\n\nЗмішування необхідної та достатньої умов. Припущення про те, що необхідна умова події є також її достатньою умовою. Необхідна умова події — це умова або набір умов, за відсутності яких розглядувана подія не може відбутися."}, {"id": "Відповіді_до_обраних_завдань", "title": "Відповіді до обраних завдань", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_108_Answers_to_Selected_Assignments.md"], "summary": "РОЗДІЛ V: СОФІЗМИ, ЩО ПОРУШУЮТЬ СТРУКТУРНИЙ КРИТЕРІЙ. Софізми предрішення тези (с. Визначення з предрішенням тези (Question-begging definition)."}, {"id": "Appeal_to_Force_or_Threat_Апеляція_до_сили_або_погрози", "title": "Appeal to Force or Threat (Апеляція до сили або погрози)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_046_Ch6_18_Appeal_to_Force_or_Threat.md"], "summary": "Помилки критерію релевантності · **Сторінки:** 119-121\n\nАпеляція до сили або загрози. Спроба переконати інших у правильності певної позиції шляхом погрози небажаним станом справ замість надання доказів на підтримку власної думки. Нічого поганого немає в тому, щоб вказувати на наслідки певного курсу дій або бездіяльності."}, {"id": "Equivocation_Еквівокація_підміна_значення_слова", "title": "Equivocation (Еквівокація / підміна значення слова)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_052_Ch7_22_Equivocation.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 134-136\n\nЕквівіокація. Спрямовування іншої особи до необґрунтованого висновку шляхом створення ілюзії того, що слово або фраза, використані в аргументі в двох різних значеннях, мають однакове значення протягом усього міркування. У якісному аргументі слова або фрази, що використовуються, повинні зберігати одне й те саме значення протягом усього міркуван..."}, {"id": "Arguing_in_a_Circle_Коло_в_доведенні", "title": "Arguing in a Circle (Коло в доведенні)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_021_Ch5_01_Arguing_in_a_Circle.md"], "summary": "Помилки структурного критерію · **Сторінки:** 76-78\n\nМіркування по колу. Явне або приховане ствердження в засновку аргументу того, що стверджується у висновку цього аргументу. Помилка міркування по колу використовує власний висновок як один із її засновків."}, {"id": "Domino_Fallacy_Slippery_Slope_Помилка_доміно_слизький_схил", "title": "Domino Fallacy / Slippery Slope (Помилка доміно / слизький схил)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_086_Ch8_50_Domino_Fallacy.md"], "summary": "Помилки критерію достатності · **Сторінки:** 198-199\n\nПомилка доміно. Припущення без належних доказів про те, що конкретна дія чи подія є лише одним — зазвичай першим — кроком у низці подій, які неминуче призведуть до конкретного, зазвичай украй небажаного наслідку. Назва «помилка доміно» походить від дитячої гри, коли кісточки доміно ставлять вертикально на ребро на невеликій відстані одна від од..."}, {"id": "Complex_Question_Складне_провокаційне_запитання", "title": "Complex Question (Складне / провокаційне запитання)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_023_Ch5_03_Complex_Question.md"], "summary": "Помилки структурного критерію · **Сторінки:** 80-82\n\nСкладне запитання. Формулювання запитання в такий спосіб, що неналежно передбачається, ніби на невисловлене запитання щодо відкритого питання вже було дано ствердну відповідь, або коли до низки запитань ставляться так, ніби на кожне з них буде дано однакову відповідь. Складне запитання перетворюється на софізм передрішення підстави (передбачення..."}, {"id": "Принцип_доброзичливості,_дедуктивна_та_індуктивна_сила_Principle_of_Charity,_Deductive_vs_Inductive", "title": "Принцип доброзичливості, дедуктивна та індуктивна сила (Principle of Charity, Deductive vs Inductive)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_009_Ch2_Charity_Deductive_Inductive.md"], "summary": "Що таке аргумент? · **Сторінки:** 32-36\n\nПринцип доброзичливості. Якщо аргумент учасника переформулюється опонентом, його слід ретельно сформулювати у найсильнішій можливій версії, що відповідає тому, що вважається початковим наміром аргументатора."}, {"id": "Misuse_of_a_Principle_Зловживання_загальним_принципом", "title": "Misuse of a Principle (Зловживання загальним принципом)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_067_Ch7_35_Misuse_of_a_Principle.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 161-163\n\nЗловживання загальним принципом. Неправильне застосування принципу чи правила в конкретному випадку через припущення, що воно не має винятків. І навпаки: спроба спростувати принцип чи правило за допомогою виняткового випадку."}, {"id": "Misuse_of_a_Vague_Expression_Зловживання_нечітким_виразом", "title": "Misuse of a Vague Expression (Зловживання нечітким виразом)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_057_Ch7_27_Misuse_of_a_Vague_Expression.md"], "summary": "Помилки прийнятності · **Сторінки:** 144-147\n\nЗловживання нечітким виразом. Спроба обґрунтувати позицію за допомогою нечіткого (розмитого) виразу або виведення невиправданого висновку внаслідок свавільного приписування надмірно точного значення чужому слову чи вислову, який за своєю суттю або межами застосування є неточним. У використанні нечіткої мови як такої немає нічого поганого."}, {"id": "Вправи_Помилки_передрішення_підстави_Assignments_Begging-the-Question", "title": "Вправи: Помилки передрішення підстави (Assignments: Begging-the-Question)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_025_Ch5_Assignments_Begging_the_Question.md"], "summary": "Помилки структурного критерію · **Сторінки:** 84-85\n\nЗавдання. Помилки «підміни питання» (Begging the Question). Для кожного з наведених нижче аргументів: (1) визначте тип помилки «підміни питання», який тут ілюструється, та (2) поясніть, як міркування порушує структурний критерій."}, {"id": "Poisoning_the_Well_Отруєння_колодязя", "title": "Poisoning the Well (Отруєння колодязя)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_095_Ch9_55_Poisoning_the_Well.md"], "summary": "Помилки критерію спростування · **Сторінки:** 213-214\n\nОтруєння колодязя (Poisoning the Well) Визначення. Відкидання критики або аргументу іншої особи через її особисті обставини або неналежні мотиви. Ця помилка називається «отруєнням колодязя», оскільки її мета — дискредитувати саме джерело аргументу чи погляду в такий спосіб, щоб повністю усунути потребу розглядати зміст цієї позиції."}, {"id": "Resort_to_Humor_or_Ridicule_Висміювання_та_сарказм_замість_аргументу", "title": "Resort to Humor or Ridicule (Висміювання та сарказм замість аргументу)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_102_Ch9_60_Resort_to_Humor_or_Ridicule.md"], "summary": "Помилки критерію спростування · **Сторінки:** 223-224\n\nВдавання до гумору або глузування (Resort to Humor or Ridicule) Визначення. Використання гумору, іронії чи глузування в аргументації, щоб замаскувати нездатність або небажання належним чином відповісти на критику чи контраргумент опонента. Гумор — дуже ефективна відволікаюча тактика, адже дотепне й вчасно вставлене слівце може швидко звести на..."}, {"id": "Посилення_аргументів_та_застосування_критеріїв_Strengthening_Arguments_&_Applying_Criteria", "title": "Посилення аргументів та застосування критеріїв (Strengthening Arguments & Applying Criteria)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_014_Ch3_Strengthening_and_Applying_Criteria.md"], "summary": "Що таке хороший аргумент? · **Сторінки:** 53-61\n\nЗміцнення аргументів. Аргумент, що порушує будь-який із п'яти критеріїв хорошого аргументу, є хибним."}, {"id": "False_Alternatives_Хибна_альтернатива_чорно-біле_мислення", "title": "False Alternatives (Хибна альтернатива / чорно-біле мислення)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_064_Ch7_32_False_Alternatives.md"], "summary": "Помилки прийнятності · **Сторінки:** 156-158\n\nХибна альтернатива (Чорно-біле мислення) Визначення. Надмірно суворе обмеження кількості можливих варіантів вирішення проблеми чи ситуації за одночасного припущення, що один із запропонованих варіантів обов'язково є істинним або правильним. Цю помилку іноді називають «чорно-білим мисленням» або помилкою фальшивої дилеми."}, {"id": "Question-Begging_Definition_Визначення,_що_передрішає_питання", "title": "Question-Begging Definition (Визначення, що передрішає питання)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_024_Ch5_04_Question_Begging_Definition.md"], "summary": "Помилки структурного критерію · **Сторінки:** 82-84\n\nПитання-начальна визначення. Використання надзвичайно сумнівного визначення, замаскованого під незаперечний емпіричний засновок, що має ефект зробити емпіричне твердження, що розглядається, істинним за визначенням. Логічна помилка питання-начальної визначення ґрунтується на плутанині між емпіричним засновком і визначальним засновком."}, {"id": "Illicit_Distribution_of_an_End_Term_Незаконний_розподіл_крайнього_терміна", "title": "Illicit Distribution of an End Term (Незаконний розподіл крайнього терміна)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_035_Ch5_11_Illicit_Distribution_End_Term.md"], "summary": "Помилки структурного критерію · **Сторінки:** 98-100\n\nНеправильне розподілення крайнього терміна. Висунення висновку в силогізмі, у якому розподілений крайній термін у висновку не є розподіленим у засновках. Друге правило, що регулює силогістичне міркування, стверджує, що якщо термін у висновку аргументу є розподіленим, він також має бути розподіленим, коли з’являється в одному з засновків."}, {"id": "Unrepresentative_Data_Нерепрезентативні_дані", "title": "Unrepresentative Data (Нерепрезентативні дані)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_073_Ch8_39_Unrepresentative_Data.md"], "summary": "Помилки критерію достатності · **Сторінки:** 176-178\n\nНерепрезентативні дані. Формулювання висновку на основі даних із нерепрезентативної або упередженої вибірки. Нерепрезентативними є дані, які не пропорційно взяті з усіх релевантних підкласів генеральної сукупності."}, {"id": "Special_Pleading_Подвійні_стандарти_виняткове_ставлення", "title": "Special Pleading (Подвійні стандарти / виняткове ставлення)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_077_Ch8_43_Special_Pleading.md"], "summary": "Помилки критерію достатності · **Сторінки:** 184-186\n\nПодвійні стандарти. Застосування принципів, правил або критеріїв до іншої людини при одночасній відмові або ухиленні від їх застосування до себе чи до ситуації власного інтересу без надання достатніх підстав для такого винятку. Помилка подвійних стандартів (упередженого виправдання) виникає в контексті, коли передбачається або розуміється, що п..."}, {"id": "Appeal_to_Tradition_Апеляція_до_традиції", "title": "Appeal to Tradition (Апеляція до традиції)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_047_Ch6_19_Appeal_to_Tradition.md"], "summary": "Помилки релевантності · **Сторінки:** 121-122\n\nАпеляція до традиції. Спроба схилити інших до прийняття певної точки зору шляхом апеляції до їхнього почуття благоговіння чи поваги до традиції замість надання раціональних доказів, особливо коли на кону стоїть більш важливий принцип чи проблема. Звичні, теплі почуття, які ми плекаємо до певного традиційного способу дій, можуть бути причиною нашої пов..."}, {"id": "Вправи_до_Глави_3_Assignments_What_Is_a_Good_Argument", "title": "Вправи до Глави 3 (Assignments: What Is a Good Argument?)", "type": "concept", "domain": "fallacy_theory", "cluster": "Damer Critical Thinking", "degree": 1, "sources": ["Clippings/attaking_json-segments/segment_016_Ch3_Assignments.md"], "summary": "Що таке хороший аргумент? · **Сторінки:** 63-64\n\nЗавдання. Подайте міркування, яке ви прочитали або почули протягом останнього тижня і яке захищає позицію щодо актуальної суперечливої соціальної, політичної, моральної, релігійної чи естетичної проблеми."}, {"id": "Ніл_Маккормік_Neil_MacCormick", "title": "Ніл Маккормік (Neil MacCormick)", "type": "entity", "domain": "legal_theory", "cluster": "Legal Philosophers & Authors", "degree": 13, "sources": ["logicagraphify/Clippings/theory_json_segments/segment_001_Title_and_Abstract.md"], "summary": "Шотландський правознавець і філософ права, автор інституційної теорії права, концепцій виправдання першого і другого порядків, універсалізації та консеквенціалістських аргументів."}, {"id": "Антонін_Скаліа_Antonin_Scalia", "title": "Антонін Скаліа (Antonin Scalia)", "type": "entity", "domain": "legal_persuasion", "cluster": "Legal Philosophers & Authors", "degree": 124, "sources": ["logicagraphify/Clippings/m           if (panel) {

          if (infoPanel) {

            searchTerm = (e.data.query || '').toLowerCase().trim();

          searchTerm = (e.data.query || '').toLowerCase().trim();

      const typeColors = {

      const aspect = Math.max(0.6, Math.min(2.5, width / height));

      // Dynamic scale factor relative to reference 1920x873 screen baseline
      function getScreenScale() {
        return Math.max(0.35, Math.min(2.5, Math.sqrt((width * height) / (1920 * 873))));

      const nodeMap = new Map();
      const nodes = GRAPH_DATA.nodes.map((n, i) => {

        const node = {

      let alpha = 1.0;
      const minGap = 2.5; // Minimum 2.5px gap between dot boundaries

            if (distSq < minDist * minDist) {

              const overlap = (minDist - dist);
