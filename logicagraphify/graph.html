& Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_070_63._Learn_the_cases..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n63. Ймовірно, у вашій апеляційній скарзі або відзиві на неї було розмежовано ключові справи вашого опонента — і було надано відповідь на його спроби розмежувати ваші справи. Не лише суд може бажати дослідити ці розбіжності, а й він може мати власне погляд на те, чому та як основні справи, на які посилаються або які обговорюються, є або не є релевант..."}, {"id": "Ніколи_або_майже_ніколи_не_ставте_суду_жодних_інших_питань.", "title": "Ніколи (або майже ніколи) не ставте суду жодних інших питань.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_105_98._Never_or_almost_never_put_any_other_question_to_the.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n98. Ніколи (або майже ніколи) не ставте інше питання суду. Звісно, ви ніколи не повинні ставити суттєве питання суду."}, {"id": "Якщо_ви_не_знаєте,_скажіть_про_це._І_ніколи_не_давайте_категоричної_відповіді,_у_якій_ви_не_впевнені", "title": "Якщо ви не знаєте, скажіть про це. І ніколи не давайте категоричної відповіді, у якій ви не впевнені.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_111_104._If_you_don_t_know_say_so._And_never_give_a_categor.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n104. Якщо ви не знаєте, скажіть про це. І ніколи не давайте категоричної відповіді, у якій не впевнені."}, {"id": "Будьте_гнучкими.", "title": "Будьте гнучкими.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_072_65._Be_flexible..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n65. Будьте гнучкими. Гнучкість — ключове слово в усному судочинстві."}, {"id": "Ніколи_не_перебивайте_суддю.", "title": "Ніколи не перебивайте суддю.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_103_96._Never_speak_over_a_judge..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n96. Ніколи не говоріть перебиваючи суддю. Як тільки суддя починає говорити — навіть якщо це грубе перебивання — припиніть говорити."}, {"id": "Огляд_-_Підготовка_письмових_матеріалів", "title": "Огляд - Підготовка письмових матеріалів", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_033_Overview_-_Briefing.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\nІнструкція. Оцініть мету пояснювальної записки. Посиліть свою майстерність письмової англійської мови."}, {"id": "Дізнайтеся,_як_впоратися_з_важким_суддею.", "title": "Дізнайтеся, як впоратися з важким суддею.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_117_110._Learn_how_to_handle_a_difficult_judge..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 2\n\n110. Навчіться взаємодіяти з складним суддею. Іноді вам доведеться мати справу з суддею, чиї запитання спрямовані не на отримання прояснення ситуації, а на демонстрацію колегам слабкості вашої справи."}, {"id": "ураховувати_особливі_ураховування,_що_стосуються_аргументу_контрсуду.", "title": "ураховувати особливі ураховування, що стосуються аргументу контрсуду.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_095_88._Take_account_of_the_special_considerations_applicab.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 2\n\n88. Враховуйте особливі міркування, що стосуються аргументації у відповіді. Порада не відмовлятися від відповіді заздалегідь практично не потрібна."}, {"id": "Рекомендовані_джерела_та_література", "title": "Рекомендовані джерела та література", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_124_Recommended_Sources.md"], "summary": "Загальні англомовні словники. (остання редакція, якщо не зазначено інше) - The American Heritage Dictionary of the English Language (ретельний, з хорошими примітками щодо вживання). - Merriam-Webster’s Collegiate Dictionary (використовується більшістю книжкових видавництв, проте будьте обережні щодо його надмірно ліберальних приміток щодо вживання)."}, {"id": "Готуйте_себе_загалом_як_публічного_оратора.", "title": "Готуйте себе загалом як публічного оратора.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_063_56._Prepare_yourself_generally_as_a_public_speaker..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 2\n\n56. Готуйте себе загалом як публічного оратора. У кожного є своя особиста манера мовлення, і великою помилкою є намагання бути тим, ким ви не є."}, {"id": "Уникати_розподілу_аргументації_між_співзахисниками.", "title": "Уникати розподілу аргументації між співзахисниками.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_067_60._Avoid_splitting_the_argument_between_cocounsel..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n60. Уникайте розподілу аргументації між співправниками. Коли у справі беруть участь два правники, які представляють різних позивачів або відповідачів і піднімають однакові питання, кожен із них часто хоче виступати."}, {"id": "Знайте_справу_свого_противника.", "title": "Знайте справу свого противника.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_008_4._Know_your_adversary_s_case..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n4. Знайте справу вашого супротивника. Ні один генерал не вступає у бій без бойового плану, який значною мірою базується на передбачуваних діях ворога."}, {"id": "Джерела_цитат_у_тексті", "title": "Джерела цитат у тексті", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_123_Sources_for_Inset_Quotations.md"], "summary": "Фронтиспис: T.W. Wakeling, The Oral Component of Appellate Work, 5 Dalhousie L.J. 584, 586 (1979)."}, {"id": "Не_зруйнуйте_ваш_продукт_поганою_типографією.", "title": "Не зруйнуйте ваш продукт поганою типографією.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_060_54._Don_t_spoil_your_product_with_poor_typography..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n54. Не псуйте свій продукт поганою типографікою. Коли бізнес‑консультанти проводять презентацію перед потенційним клієнтом, вони представляють професійно підготовлену, переплетену пропозицію."}, {"id": "Не_використовуйте_візуальні_засоби_незрозуміло.", "title": "Не використовуйте візуальні засоби незрозуміло.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_107_100._Don_t_use_visual_aids_unintelligently..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n100. Не використовуйте наочні посібники бездумно. Загалом, наочні посібники призначені для судових розглядів з присяжними."}, {"id": "Спільно_зі_своїм_опонентом_підготуйте_Спільний_додаток.", "title": "Спільно зі своїм опонентом підготуйте Спільний додаток.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_038_32._In_cooperation_with_your_opponent_prepare_the_Joint.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n32. Спільно зі своїм опонентом підготуйте Спільний додаток. Правила більшості апеляційних судів передбачають подання Спільного додатка, який містить ті частини матеріалів справи, на які сторони наміряються покладатися."}, {"id": "Будьте_обережні_з_гумором.", "title": "Будьте обережні з гумором.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_106_99._Be_cautious_about_humor..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n99. Будьте обережні з гумором. Ніколи не розповідайте заздалегідь підготовлені жарти."}, {"id": "Знайте_свою_аудиторію.", "title": "Знайте свою аудиторію.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_006_2._Know_your_audience..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 3\n\n2. Знайте свою аудиторію. Добрий адвокат намагається дізнатися якомога більше про суддю, який буде вирішувати справу."}, {"id": "Прийміть_позицію_шанобливої_інтелектуальної_рівності_з_суддівським_колективом.", "title": "Прийміть позицію шанобливої інтелектуальної рівності з суддівським колективом.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_022_18._Assume_a_posture_of_respectful_intellectual_equalit.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n18. Припустіть позицію шанобливої інтелектуальної рівності з судом. Генеральний адвокат Сполучених Штатів — найчастіший і часто найвміліший захисник перед Верховним судом Сполучених Штатів — іноді називається «десятим суддею»."}, {"id": "Якщо_ви_перші,_хто_виступає,_спочатку_викладіть_свою_позитивну_позицію,_а_потім_попередньо_спростуйт", "title": "Якщо ви перші, хто виступає, спочатку викладіть свою позитивну позицію, а потім попередньо спростуйте посередині — не на початку й не в кінці.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_012_8._If_you_re_the_first_to_argue_make_your_positive_case.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n8. Якщо ви перший, хто виступає, викладіть свою позитивну позицію, а потім попередньо спростуйте в середині – не на початку і не в кінці. Це старовинне правило адвокатури: той, хто перший виступає, має спростовувати в середині, а не на початку чи в кінці."}, {"id": "Забезпечити_суду_легкий_доступ_до_відповідного_тексту.", "title": "Забезпечити суду легкий доступ до відповідного тексту.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_059_53._Make_the_relevant_text_readily_available_to_the_cou.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n53. Зробіть відповідний текст легкодоступним для суду. Текст, який заслуговує на обговорення, заслуговує на прочитання."}, {"id": "Розгляньте_розміщення_посилань_у_виносках_—_чи_ні.", "title": "Розгляньте розміщення посилань у виносках — чи ні.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_058_52._Consider_putting_citations_in_footnotes_or_not..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 3\n\n52. Розглянути можливість розміщення цитат у виносках — чи ні. Погляд Гарнера: Я перетворив це на справжню справу‑прецедент щодо реформування способу, у який цитати вплітаються у тексти юристів.^47 З 1992 року я радив розміщувати весь бібліографічний матеріал (номери томів і сторінок) у виносках, уникаючи при цьому розміщення б..."}, {"id": "Ознайомтеся_зі_справою.", "title": "Ознайомтеся зі справою.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_069_62._Learn_the_record..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n62. Опануйте протокол. Апеляція базується на протоколі, складеному у нижчій інстанції (або перед агентством), і непрофесійно привертати увагу суду до фактів, яких у протоколі немає."}, {"id": "Напередодні_судового_засідання_перевірте_свої_правові_джерела.", "title": "Напередодні судового засідання перевірте свої правові джерела.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 13, "sources": ["Clippings/making_json_segments/segment_078_71._On_the_eve_of_argument_check_your_authorities..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n71. Напередодні судового засідання перевірте свої правові підстави. Як же соромно дізнатися від суду, що одна з ваших ключових справ була скасована в апеляційному порядку або втрачала чинність!"}, {"id": "Швидко_зосереджуйтеся_на_ключовому_тексті_та_вкажіть_суду,_де_його_знайти.", "title": "Швидко зосереджуйтеся на ключовому тексті та вкажіть суду, де його знайти.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_091_84._Focus_quickly_on_crucial_text_and_tell_the_court_wh.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n84. Швидко зосереджуйтеся на ключовому тексті та вкажіть суду, де його знайти. Якщо результат вашої справи залежить від значення тексту — чи то закону, підзаконного акта, постанови чи умови договору — негайно переходьте до розгляду цього тексту."}, {"id": "Віддайте_незаслонену_позицію_—_демонстративно.", "title": "Віддайте незаслонену позицію — демонстративно.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_015_11._Yield_indefensible_terrain_ostentatiously..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n11. Віддайте незаслонену позицію — демонстративно. Не намагайтеся захищати те, що неможливо захистити."}, {"id": "Будьте_абсолютно_чіткі_щодо_теорії_вашої_справи.", "title": "Будьте абсолютно чіткі щодо теорії вашої справи.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_073_66._Be_absolutely_clear_on_the_theory_of_your_case..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n66. Будь абсолютно чітким щодо теорії свого справи. Суді турбуються не лише з результатом вашого справи, а й з результатом багатьох майбутніх справ, які будуть регулюватися правилом, яким ви просите суд прийняти."}, {"id": "Добровільно_відповідати_на_гіпотетичні_питання.", "title": "Добровільно відповідати на гіпотетичні питання.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_114_107._Willingly_answer_hypotheticals..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n107. Відповідайте на гіпотетичні запитання з готовністю. Багато питань, поставлених апеляційною колегією, будуть так званими гіпотетиками, у яких запитується, як правило права, яке ви наполегливо відстоюєте, застосуватиметься до фактичної ситуації, відмінної від тієї, що розглядається судом."}, {"id": "Не_гризти_нігті.", "title": "Не гризти нігті.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_101_94._Don_t_chew_your_fingernails..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n94. Не гризіть нігті. Добре, ми ніколи насправді не бачили, щоб адвокати гризли нігті під усним виступом."}, {"id": "Якщо_ви_незадоволені_рішенням,_розгляньте_можливість_подати_клопотання_про_перегляд.", "title": "Якщо ви незадоволені рішенням, розгляньте можливість подати клопотання про перегляд.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_120_113._If_you_re_unhappy_with_the_ruling_think_about_fili.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 3\n\n113. Якщо ви незадоволені рішенням, розгляньте можливість подання клопотання про перегляд. Клопотання про перегляд мають різні назви."}, {"id": "Уникайте_докладного_обговорення_прецедентів.", "title": "Уникайте докладного обговорення прецедентів.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_090_83._Avoid_detailed_discussion_of_precedents..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n83. Уникайте докладного обговорення прецедентів. Хоча повний опис основних справ часто бажаний у письмовій заяві, у усному аргументуванні це рідко виправдовує обмежений час."}, {"id": "Вислати_найкваліфікованішого_адвоката,_який_найповніше_обізнаний_у_справі.", "title": "Вислати найкваліфікованішого адвоката, який найповніше обізнаний у справі.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_066_59._Send_up_the_skilled_advocate_most_knowledgeable_abo.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n59. Призначте найкваліфікованішого адвоката, який найкраще обізнаний у справі. Клієнт іноді наполягає, щоб «відомий» партнер вів справу."}, {"id": "Огляд_-_Юридичне_мислення", "title": "Огляд - Юридичне мислення", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_026_Overview_-_Legal_Reasoning.md"], "summary": "Юридичне мислення та правова аргументація · **Кількість сторінок:** 1\n\nЮридичне міркування. Думайте силогістично. Знайте правила тлумачення тексту."}, {"id": "Завершуйте_потужно_—_і_чітко_вкажіть,_що,_на_вашу_думку,_суд_має_зробити.", "title": "Завершуйте потужно — і чітко вкажіть, що, на вашу думку, суд має зробити.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_025_21._Close_powerfully_and_say_explicitly_what_you_think.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n21. Завершуйте потужно — і чітко вкажіть, що, на вашу думку, має зробити суд. Переконливий аргумент не повинен різко обірватися й не може розпливатися у безладну сукупність другорядних пунктів."}, {"id": "Контролюйте_семантичне_поле_гри.", "title": "Контролюйте семантичне поле гри.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_024_20._Control_the_semantic_playing_field..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n20. Керуйте семантичним полем гри. Позначки важливі."}, {"id": "Проведення_імітованих_судових_засідань.", "title": "Проведення імітованих судових засідань.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_076_69._Conduct_moot_courts..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n69. Проводьте імітаційний суд. Немає підготовки до усного захисту, яка була б такою ж цінною, як імітаційний суд, під час якого вас допитують юристи, які знають вашу справу так добре, як і суд."}, {"id": "Описуйте_та_цитуйте_джерела_права_з_ретельною_точністю.", "title": "Описуйте та цитуйте джерела права з ретельною точністю.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 13, "sources": ["Clippings/making_json_segments/segment_054_48._Describe_and_cite_authorities_with_scrupulous_accur.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 2\n\n48. Описуйте та посилайтеся на джерела з бездоганною точністю. Переконливий бриф змушує суд робити сприятливі висновки, спираючись на точні описи ваших джерел."}, {"id": "Визначте,_чи_доцільно_викладати_факти_та_історію_справи.", "title": "Визначте, чи доцільно викладати факти та історію справи.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 3, "sources": ["Clippings/making_json_segments/segment_087_80._Decide_whether_it_s_worth_giving_the_facts_and_hist.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n80. Визначте, чи варто викладати факти та історію справи. У вас обмежений час для усної аргументації, і ви не хочете марнувати жодної хвилини."}, {"id": "Питання,_які_вітаються", "title": "Питання, які вітаються", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_108_101._Welcome_questions..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 2\n\n101. Welcome questions. У багатьох сучасних судах на усному обговоренні менше часу приділяється заздалегідь підготовленим виступам адвокатів, ніж діалогу між адвокатами та судом, який виникає завдяки запитанням суддів."}, {"id": "Оволодіти_рекомендованими_варіантами_вимови_англійських_слів,_юридичних_термінів_і_власних_назв.", "title": "Оволодіти рекомендованими варіантами вимови англійських слів, юридичних термінів і власних назв.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_064_57._Master_the_preferred_pronunciations_of_English_word.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 2\n\n57. Опануйте бажані вимови англійських слів, юридичних термінів та власних імен. Як Еліза Дулітл у Моя прекрасна леді, вас будуть сприймати або як вишукану, або як простодушну, обізнану чи невігласу, не лише за те, що ви говорите, а й за те, як ви це говорите."}, {"id": "У_справах,_що_регулюються_чинними_правовими_актами,_завжди_починайте_зі_слів_тексту,_щоб_сформулюват", "title": "У справах, що регулюються чинними правовими актами, завжди починайте зі слів тексту, щоб сформулювати головну передумову.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 3, "sources": ["Clippings/making_json_segments/segment_029_24._In_cases_controlled_by_governing_legal_texts_always.md"], "summary": "Юридичне мислення та правова аргументація · **Кількість сторінок:** 2\n\n24. У справах, що регулюються чинними правовими текстами, завжди починайте зі слів тексту, щоб сформулювати більший засновок. Як приклад тлумачення тексту розгляньмо позиції, яких могли б дотримуватися адвокати у справі, ситуацію в якій неважко уявити."}, {"id": "Розгляньте_можливість_іноді_вживати_скорочення_—_або_ні.", "title": "Розгляньте можливість іноді вживати скорочення — або ні.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_051_45._Consider_using_contractions_occasionally_or_not..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 4\n\n45. Розгляньте можливість використання скорочень час від часу — чи ні. Точка зору Гарнера: У книзі, яку я написав у 1991 р., з’явилася така порада: «Скорочення зазвичай недоречні в юридичному письмі."}, {"id": "Якщо_ви_апелянт,_врахуйте_попереднє,_очистіть_підлісок_і_тоді_зверніться_до_своєї_сили.", "title": "Якщо ви апелянт, врахуйте попереднє, очистіть підлісок і тоді зверніться до своєї сили.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_089_82._If_you_re_the_appellee_take_account_of_what_has_pre.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n82. Якщо ви відповідач, врахуйте те, що передувало, приберіть «підлісок» і лише тоді переходьте до своїх сильних сторін. Аргументація відповідача має бути адаптивною."}, {"id": "Вчіться_на_своїх_помилках", "title": "Вчіться на своїх помилках", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_121_114._Learn_from_your_mistakes..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n114. Навчайтесь на власних помилках. Коли дискусія завершиться, згадайте її."}, {"id": "Відмовитися_від_змістовних_виносок_—_чи_ні.", "title": "Відмовитися від змістовних виносок — чи ні.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_057_51._Swear_off_substantive_footnotes_or_not..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 2\n\n51. Відмовтеся від змістовних приміток — чи ні. Позиція Гарнера: Не розміщуйте в примітках жодних суттєвих тез — принаймні тих, які ви вважаєте важливими для вашого аргументу."}, {"id": "Використовуйте_правильну_термінологію_суду.", "title": "Використовуйте правильну термінологію суду.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_098_91._Use_correct_courtroom_terminology..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n91. Використовуйте правильну термінологію суду. Звертайтеся до членів суду коректно."}, {"id": "Дбайливо_обирайте_найкращі_аргументи._Фокусуйте_вогонь.", "title": "Дбайливо обирайте найкращі аргументи. Фокусуйте вогонь.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_016_12._Take_pains_to_select_your_best_arguments._Concentra.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n12. Дбайливо обирайте найкращі аргументи. Фокусуйте вогонь."}, {"id": "Ніколи_не_відкладайте_відповідь.", "title": "Ніколи не відкладайте відповідь.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_110_103._Never_postpone_an_answer..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n103. Ніколи не відкладайте відповідь. Можливо, найдратівливіша з усіх реакцій на питання судді — це: «Ваша честь, я повернуся до цього пункту пізніше."}, {"id": "Завжди_починайте_з_формулювання_головного_питання,_перш_ніж_докладно_викладати_факти.", "title": "Завжди починайте з формулювання головного питання, перш ніж докладно викладати факти.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 3, "sources": ["Clippings/making_json_segments/segment_018_14._Always_start_with_a_statement_of_the_main_issue_bef.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n14. Завжди починайте з формулювання головного питання, перш ніж повністю викладати факти. Цицерон радив не переходити одразу до частини презентації, що стосується конкретних фактів, оскільки «це не є частиною питання, і люди спочатку прагнуть дізнатися саме той пункт, який підлягає їхньому судженню».^7 У 1981 році правила Верховного суду ..."}, {"id": "Якщо_можливо,_починайте_зі_свого_найсильнішого_аргументу.", "title": "Якщо можливо, починайте зі свого найсильнішого аргументу.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_011_7._If_possible_lead_with_your_strongest_argument..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n7. Якщо можливо, розпочинайте зі своєї найсильнішої аргументації. Коли логіка дозволяє, розмістіть свою ключову аргументацію на початку у своїй позитивній позиції."}, {"id": "Убевідайтеся,_що_трибунал_має_юрисдикцію.", "title": "Убевідайтеся, що трибунал має юрисдикцію.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_005_1._Be_sure_that_the_tribunal_has_jurisdiction..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 2\n\n1. Переконайтесь, що суд має юрисдикцію. Нічого не досягнеться, якщо ви намагатиметеся переконати того, хто не має повноважень виконати те, що ви від нього вимагаєте — чи то готельного клерка, який не має дискреційного права змінити ваш рахунок, чи то реєстратора, який не може зобов'язати компанію за контрактом, який ви пропонуєте."}, {"id": "Представляйте_свою_аргументацію_як_істину,_а_не_як_свою_думку.", "title": "Представляйте свою аргументацію як істину, а не як свою думку.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_102_95._Present_your_argument_as_truth_not_as_your_opinion..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n95. Представляйте свою аргументацію як істину, а не як свою думку. Уникайте вжитку першої особи однини (I, me) та конструкцій типу «Апелянт стверджує, що …», «Наша позиція полягає в тому, що …», «На нашу думку …»."}, {"id": "Визнавати_важливість_устних_аргументації_та_розуміти_свої_цілі.", "title": "Визнавати важливість устних аргументації та розуміти свої цілі.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_062_55._Appreciate_the_importance_of_oral_argument_and_know.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 2\n\n55. Оцініть значення усного обговорення та знайте свої цілі. Багато юристів сприймають усне обговорення як суто формальність, особливо в судах, де існує практика попереднього ознайомлення з процесуальними документами."}, {"id": "Коли_слід_спиратися_на_справедливість,_щоб_пом’якшити_суворе_застосування_закону,_назвіть_юриспруден", "title": "Коли слід спиратися на справедливість, щоб пом’якшити суворе застосування закону, назвіть юриспруденційну максиму, що це обґрунтовує.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_020_16._When_you_must_rely_on_fairness_to_modify_the_strict.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n16. Коли вам доводиться покладатися на справедливість, щоб змінити суворе застосування закону, визначте якийсь юридичний принцип (максиму), який підтримує вашу позицію. Голосне звернення до справедливості в обличчі, здавалося б, суперечливої судової практики, малоймовірно принесе успіх."}, {"id": "Уважно_дотримуйтесь_застосовного_стандарту_рішення", "title": "Уважно дотримуйтесь застосовного стандарту рішення", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_009_5._Pay_careful_attention_to_the_applicable_standard_of.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 2\n\n5. Уважно стежте за застосовним стандартом рішення. Окремі питання, що виникають у вашій справі, можуть підлягати різним презумпціям і тягарам доказування."}, {"id": "Розуміти_мету_юридичного_документа.", "title": "Розуміти мету юридичного документа.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_034_28._Appreciate_the_objective_of_a_brief..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n28. Оцінюйте мету юридичного меморандума. Головною метою будь-якого юридичного меморандума є спрощення роботи суду."}, {"id": "Огляд_-_Загальні_принципи_аргументації", "title": "Огляд - Загальні принципи аргументації", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_004_Overview_-_General_Principles_of_Argumentation.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\nЗагальні принципи аргументації. Переконайтеся, що трибунал має юрисдикцію. Знайте свою аудиторію."}, {"id": "Огляд_-_Усні_виступи", "title": "Огляд - Усні виступи", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_061_Overview_-_Oral_Argument.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 2\n\nУсна аргументація. Оцініть важливість усної аргументації та знайте свої цілі. Готуйте себе загалом як публічного оратора."}, {"id": "Привітайте_суд_і,_за_потреби,_представте_себе.", "title": "Привітайте суд і, за потреби, представте себе.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_084_77._Greet_the_court_and_if_necessary_introduce_yourself.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n77. Привітайте суд і, за потреби, представтеся. Заведіть зоровий контакт із головуючим суддею і розпочніть свою промову тим формульованим привітанням, яке є звичним у цьому суді, перед яким ви виступаєте."}, {"id": "Цитувати_авторитети_ще_більш_економно.", "title": "Цитувати авторитети ще більш економно.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 13, "sources": ["Clippings/making_json_segments/segment_056_50._Quote_authorities_more_sparingly_still..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n50. Цитувати авторитети ще обережніше. Ми вже зазначали, що варто безпосередньо цитувати справу, у якій викладено вашу головну гіпотезу."}, {"id": "Підсилайте_володіння_письмовою_англійською.", "title": "Підсилайте володіння письмовою англійською.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_035_29._Strengthen_your_command_of_written_English..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 3\n\n29. Удоскональте володіння письмовою англійською. Ви не мали б довіри до теслі, чиї інструменти тупі й іржаві."}, {"id": "Перегляньте_деякі_аргументи.", "title": "Перегляньте деякі аргументи.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_077_70._Watch_some_arguments..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n70. Спостерігайте за аргументами. Професійні оратори зазвичай люблять заздалегідь ознайомитися з приміщенням, у якому вони виступатимуть."}, {"id": "Спілкуйтеся_чітко_та_стисло.", "title": "Спілкуйтеся чітко та стисло.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_017_13._Communicate_clearly_and_concisely..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n13. Комунікуйте ясно та стисло. У системі суперечливого судочинства саме вам належить ясно викладати право та факти, що сприяють вашій стороні справи, — це не обов'язок суддів збирати елементи розбірливості зі слів'яної та заплутаної доповіді або аргументації."}, {"id": "Слухайте_уважно_і,_за_потреби,_просіть_уточнення.", "title": "Слухайте уважно і, за потреби, просіть уточнення.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_109_102._Listen_carefully_and_if_necessary_ask_for_clarific.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n102. Слухайте уважно і, за потреби, просіть уточнення. Багато часу на аргументацію витрачається даремно, коли адвокат одразу переходить до відповіді на питання, яке цілком відрізняється від того, яке поставив суддя."}, {"id": "Титул,_зміст_та_подяки", "title": "Титул, зміст та подяки", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_001_Title_Contents_Acknowledgments.md"], "summary": "«Making Your Case»: Мистецтво переконання суддів. Автори: Ганнер, Браян А., Антонін Скалiя Джерело: base/dokumen.pub_making-your-case-the-art-of-persuading-judges-0314184716-9780314184719.epub Зміст Титульна сторінка Сторінка авторських прав Епіграф Присвята Подяки Передмова Вступ Загальні принципи аргументації. Переконайтеся, що трибунал має юрисдикцію."}, {"id": "Думайте_силлогістично.", "title": "Думайте силлогістично.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_027_22._Think_syllogistically..md"], "summary": "Юридичне мислення та правова аргументація · **Кількість сторінок:** 2\n\n22. Думайте силогістично. Відкинувши емоційні апеляції, переконання можливе лише тому, що всі люди народжуються зі здатністю до логічного мислення."}, {"id": "Будьте_абсолютно_чіткими_щодо_мандату,_який_ви_шукаєте.", "title": "Будьте абсолютно чіткими щодо мандату, який ви шукаєте.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_074_67._Be_absolutely_clear_on_the_mandate_you_seek..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n67. Будьте абсолютно чіткими щодо запиту, який ви формулюєте. Судді, з якими ми консультувалися, стверджують, що трагічно часто адвокати не знають, як заповнити це порожнє місце: «Суд, отже, наказує, щоб _________________________»."}, {"id": "Виділяйте_багато_часу_просто_на_«зрозуміння»_ваших_аргументів.", "title": "Виділяйте багато часу просто на «зрозуміння» ваших аргументів.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_039_33._Spend_plenty_of_time_simply_getting_your_arguments..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n33. Витрачайте значний час просто на «усвідомлення» ваших аргументів. Якісна підготовка процесу є плодом тривалого роздумування."}, {"id": "Розумно_використовуйте_абзаци;_чітко_позначайте_аргументи.", "title": "Розумно використовуйте абзаци; чітко позначайте аргументи.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_047_41._Use_paragraphs_intelligently_signpost_your_argument.md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 2\n\n41. Використовуйте абзаци розумно; позначайте свої аргументи. Заголовки розділів – не єдине засіб структурування вашого аргументу."}, {"id": "Не_крутити_мертвого_коня._Не_допускайте,_щоб_мертвий_кінь_крутив_вас.", "title": "Не крутити мертвого коня. Не допускайте, щоб мертвий кінь крутив вас.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_092_85._Don_t_beat_a_dead_horse._Don_t_let_a_dead_horse_bea.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n85. Не крутити мертвого коня. Не дозволяй мертвому коню крутити тебе."}, {"id": "Усвідомте,_що_розум_має_перевагу_у_суддів,_і_відкрите_звернення_до_їхніх_емоцій_викликає_осуд.", "title": "Усвідомте, що розум має перевагу у суддів, і відкрите звернення до їхніх емоцій викликає осуд.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_021_17._Understand_that_reason_is_paramount_with_judges_and.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 2\n\n17. Усвідомте: судді понад усе цінують раціональність, а відверта апеляція до їхніх емоцій викликає неприязнь. Часто кажуть, що «промова для присяжних» не справить належного враження на суддю."}, {"id": "Якщо_ви_апелянт,_зарезервуйте_час_для_репліки.", "title": "Якщо ви апелянт, зарезервуйте час для репліки.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_086_79._If_you_re_the_appellant_reserve_rebuttal_time..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n79. Якщо ви апелянт, зарезервуйте час для репліки. Ніколи не варто відмовлятися від права на репліку заздалегідь, однак вам не нададуть такого права, якщо ви використаєте весь свій час під час першої частини виступу."}, {"id": "Утримуйте_емоції._І_не_звинувачуйте.", "title": "Утримуйте емоції. І не звинувачуйте.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_023_19._Restrain_your_emotions._And_don_t_accuse..md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 1\n\n19. Стримуйте емоції. І не звинувачуйте."}, {"id": "Володіть_уміло_використання_паузи", "title": "Володіть уміло використання паузи", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_065_58._Master_the_use_of_the_pause..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n58. Мастер використання паузи. Риторичний прийом, найбільше недооцінюється і взагалі ігнорується адвокатами, — це пауза."}, {"id": "На_столі_адвоката_має_сидіти_лише_співрозмовник_співзаступник.", "title": "На столі адвоката має сидіти лише співрозмовник (співзаступник).", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_081_74._Seat_only_cocounsel_at_counsel_table..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n74. За столом адвокатури сидіти лише співавоката. Клієнт іноді просить присутності на усному засіданні — прохання, яке сьогодні важко відмовити."}, {"id": "Зробіть_це_цікавим.", "title": "Зробіть це цікавим.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_049_43._Make_it_interesting..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n43. Зробіть це цікавим. Стверджувати, що ваш текст має бути чітким і стислим, зовсім не означає, що він повинен бути нудним."}, {"id": "Пам’ятайте,_що_навіть_коли_ви_не_стоїте_на_ногах,_ви_все_одно_на_сцені_й_працюєте.", "title": "Пам’ятайте, що навіть коли ви не стоїте на ногах, ви все одно на сцені й працюєте.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_082_75._Bear_in_mind_that_even_when_you_re_not_on_your_feet.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n75. Пам'ятайте, що навіть коли ви не говорите, ви все одно на сцені й працюєте. У устній аргументації немає часу на відпочинок для жодного з адвокатів."}, {"id": "Якщо_ви_виступаєте_після_опонента,_сплануйте_порядок_подання_позитивної_частини_справи_та_спростуван", "title": "Якщо ви виступаєте після опонента, сплануйте порядок подання позитивної частини справи та спростування так, щоб він був максимально ефективним, враховуючи характер аргументу опонента.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_013_9._If_you_re_arguing_after_your_opponent_design_the_ord.md"], "summary": "Загальні принципи аргументації · **Кількість сторінок:** 2\n\n9. Якщо ви виступаєте після суперника, структуруйте порядок викладу позитивної частини справи та спростування так, щоб вони були максимально ефективними з урахуванням природи аргументів вашого суперника. Аристотель радив відповідачам рішуче спростовувати суперечливі тези вже на початку свого виступу: [Я]кщо хтось виступає другим, він пови..."}, {"id": "Розпізнавайте_дружні_запитання.", "title": "Розпізнавайте дружні запитання.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_116_109._Recognize_friendly_questions..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n109. Визнавайте дружні запитання. Більшість запитань, які ви отримуєте, спрямовані на виявлення слабких місць у вашому випадку."}, {"id": "Вступ", "title": "Вступ", "type": "concept", "domain": "legal_persuasion", "cluster": "Judicial Advocacy & Briefing", "degree": 2, "sources": ["Clippings/making_json_segments/segment_003_Introduction.md"], "summary": "Суддів можна переконати лише за умови виконання трьох вимог: 1. Вони повинні мати чітке уявлення про те, що саме ви просите суд зробити. Вони мають бути впевнені, що це входить до повноважень суду."}, {"id": "Ясність_понад_усі_інші_елементи_стилю", "title": "Ясність понад усі інші елементи стилю", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_045_39._Value_clarity_above_all_other_elements_of_style..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 1\n\n39. Чіткість важливіша за всі інші елементи стилю. У написанні бріфу одна риса хорошого стилю переважає всі інші."}, {"id": "Після_відповіді_плавно_повернутись_до_вашого_аргументу_—_це_означає,_що_це_не_обов’язково_має_відбув", "title": "Після відповіді плавно повернутись до вашого аргументу — це означає, що це не обов’язково має відбуватись у точці, де ви зупинились.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_115_108._After_answering_transition_back_into_your_argument.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n108. Після відповіді плавно повернутися до вашого аргументу — що означає не обов’язково саме в тому місці, де ви зупинилися. Серед найскладніших завдань усного захисника — досягти граціозного та впорядкованого повернення до одного з пунктів підготовленої презентації після відповіді на питання."}, {"id": "Посилайтеся_на_авторитетні_джерела_зрозуміло.", "title": "Посилайтеся на авторитетні джерела зрозуміло.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 13, "sources": ["Clippings/making_json_segments/segment_055_49._Cite_authorities_sparingly..md"], "summary": "Підготовка письмових матеріалів (Брифінг) · **Кількість сторінок:** 2\n\n49. Цитуйте авторитетні джерела помірно. Ви не пишете трактат, статтю для юридичного журналу чи всеосяжну анотацію Corpus Juris."}, {"id": "Підійдіть_до_кафедри_без_зайвих_речей;_налаштуйте_її_під_свій_зріст;_стоячи_прямо,_встановіть_зорови", "title": "Підійдіть до кафедри без зайвих речей; налаштуйте її під свій зріст; стоячи прямо, встановіть зоровий контакт із судом.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_083_76._Approach_the_lectern_unencumbered_adjust_it_to_your.md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n76. Підійдіть до кафедри без зайвих речей; відрегулюйте її під свій зріст; станьте прямо і встановіть зоровий контакт із судом. Підійдіть до кафедри швидко, але без поспіху."}, {"id": "Починайте_з_«так»_або_«ні».", "title": "Починайте з «так» або «ні».", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 2, "sources": ["Clippings/making_json_segments/segment_112_105._Begin_with_a_yes_or_a_no..md"], "summary": "Усні виступи в суді · **Кількість сторінок:** 1\n\n105. Починайте з «так» або «ні» Не змушуйте суд, після того як ви закінчите відповідь на запитання, питати: «Це „так“ чи „ні“?». Починайте з «так» або «ні» (а не «можливо» чи «іноді»), а потім додайте необхідні уточнення."}, {"id": "Будьте_готові_захищати_свою_інтерпретацію,_спираючись_на_історію_законодавства.", "title": "Будьте готові захищати свою інтерпретацію, спираючись на історію законодавства.", "type": "rule", "domain": "legal_persuasion", "cluster": "Scalia & Garner Legal Persuasion", "degree": 3, "sources": ["Clippings/making_json_segments/segment_030_25._Be_prepar ки критерію релевантності · **Сторінки:** 115\n\nПомилки нерелевантного звернення. Деякі хибні міркування намагаються підтвердити твердження, посилаючись на сумнівний авторитет інших людей або на емоційні фактори, жоден із яких не є релевантним і не надає підтримки істинності чи обґрунтованості розглядуваного твердження. Звернення до інших людей спробують захистити погляд, або посилаючись на ав..."}, {"id": "Fallacy_of_Composition_Помилка_композиції_хибне_об'єднання", "title": "Fallacy of Composition (Помилка композиції / хибне об'єднання)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 2, "sources": ["Clippings/attaking_json-segments/segment_062_Ch7_30_Fallacy_of_Composition.md"], "summary": "Помилки прийнятності · **Сторінки:** 153-154\n\nПомилка композиції (Хибне об'єднання) Визначення. Припущення про те, що те, що є істинним для частин цілого, обов'язково є істинним і для всього цілого. Імпліцитний засновок, який використовується в помилці композиції — а саме твердження про те, що властивість частин цілого автоматично переноситься на саме ціле, — є необґрунтованим і невиправданим прип..."}, {"id": "Вправи_Помилки_необґрунтованого_припущення_Assignments_Unwarranted_Assumption", "title": "Вправи: Помилки необґрунтованого припущення (Assignments: Unwarranted Assumption)", "type": "fallacy", "domain": "fallacy_theory", "cluster": "Fallacies & Faulty Reasoning (Damer)", "degree": 11, "sources": ["Clippings/attaking_json-segments/segment_070_Ch7_Assignments_Unwarranted_Assumption.md"], "summary": "Помилки критерію прийнятності · **Сторінки:** 167-173\n\nВправи. Помилки необґрунтованого припущення. Для кожного з наведених нижче аргументів: (1) визначте тип проілюстрованої помилки необґрунтованого припущення, і (2) поясніть, у який спосіб це міркування порушує критерій прийнятності."}, {"id": "Appeal_to_Self-Interest_Апеляція_до_особистого_інтересу_егоїзму", "title": "Appeal to Self-Interest (Апеляція до особ
